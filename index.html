<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="Bodega Tony Tony - Mini Market ¡Siempre fresco y cerca!">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bodega Tony Tony">
<meta name="mobile-web-app-capable" content="yes">

<title>Bodega Tony Tony 🛒</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f7f7f7;--card:#fff;--text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;}
.dark{--bg:#0f0f1a;--card:#1a1a2e;--text:#f0f0f0;--subtext:#aaa;--border:#2a2a3e;--gris:#2a2a3e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--oscuro);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--amarillo);}
.logo span{color:var(--rojo);}
.cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(230,57,70,0.4);}
.cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
.tienda-status-bar{text-align:center;padding:10px 16px;font-size:13px;font-weight:700;}
.tienda-abierta{background:linear-gradient(90deg,#2dc653,#1a9e3f);color:white;}
.tienda-cerrada{background:linear-gradient(90deg,#e63946,#c1121f);color:white;}
.envio-bar{background:linear-gradient(90deg,#2dc653,#1a9e3f);color:white;text-align:center;padding:8px 16px;font-size:13px;font-weight:700;}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;}
.tab-btn{padding:11px 16px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.search-wrap{padding:10px 16px;background:var(--card);}
.search-wrap input{width:100%;padding:10px 16px;border:2px solid var(--border);border-radius:50px;font-size:14px;outline:none;background:var(--bg);color:var(--text);}
.view{display:none;padding:14px;}
.view.active{display:block;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.product-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);display:flex;flex-direction:column;cursor:pointer;}
.product-card:active{transform:scale(0.97);}
.product-img{width:100%;height:120px;object-fit:cover;}
.product-emoji-big{font-size:46px;text-align:center;padding:14px 0 6px;}
.product-info{padding:8px 12px 12px;flex:1;display:flex;flex-direction:column;gap:5px;}
.product-name{font-weight:700;font-size:13px;}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--rojo);}
.add-btn{background:var(--oscuro);color:white;border:none;border-radius:50px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:auto;}
.agotado-badge{background:#555;color:white;border:none;border-radius:50px;padding:8px 14px;font-weight:800;font-size:12px;width:100%;margin-top:auto;text-align:center;}
.qty-ctrl{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;margin-top:auto;}
.qty-btn{background:var(--gris);border:none;border-radius:50%;width:30px;height:30px;font-size:18px;font-weight:900;cursor:pointer;}
.qty-num{font-weight:800;font-size:16px;}
.cat-filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;}
.cat-chip{padding:7px 14px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--subtext);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
.cat-chip.active{border-color:var(--rojo);background:var(--rojo);color:white;}
.empty{text-align:center;padding:40px 20px;color:var(--subtext);}
.empty-icon{font-size:60px;margin-bottom:12px;}
.cart-item{background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.cart-total{background:var(--oscuro);color:white;border-radius:16px;padding:18px;margin:14px 0;text-align:center;}
.cart-total .amount{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--amarillo);}
.customer-info input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:10px;outline:none;background:var(--bg);color:var(--text);}
.whatsapp-btn{background:#25d366;color:white;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;z-index:999;transition:transform 0.3s;}
.toast.show{transform:translateX(-50%) translateY(0);}
.floating-cart{position:fixed;bottom:0;left:0;right:0;z-index:300;padding:10px 16px;background:var(--oscuro);display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 -4px 20px rgba(0,0,0,0.25);transform:translateY(100%);transition:transform 0.3s;}
.floating-cart.visible{transform:translateY(0);}
.floating-cart-total{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--amarillo);}
.floating-cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:12px 22px;font-weight:800;cursor:pointer;}
body.has-float-bar .view{padding-bottom:80px;}
.chat-fab{position:fixed;bottom:100px;right:20px;z-index:400;background:var(--verde);color:white;width:56px;height:56px;border-radius:50%;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;}
@media(max-width:400px){.products-grid{grid-template-columns:repeat(2,1fr);}.logo{font-size:22px;}}
</style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;background:var(--oscuro);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s;">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--amarillo);">Bodega <span style="color:var(--rojo);">Tony</span> Tony</div>
  <div style="width:35px;height:35px;border:3px solid rgba(255,255,255,0.2);border-radius:50%;border-top-color:var(--rojo);animation:spin 0.8s linear infinite;margin-top:16px;"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<header>
  <div><div class="logo">Bodega <span>Tony</span> Tony</div><div style="font-size:11px;color:#aaa;">🛒 Haz tu pedido aquí</div></div>
  <button class="cart-btn" onclick="showTab('carrito')">🛒 <span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="tienda-status-bar tienda-abierta" id="tiendaStatusBar">✅ Abierto ahora</div>
<div class="envio-bar" id="envioBar">🛵 Domicilio gratis</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('tienda')">🏪 Tienda</button>
  <button class="tab-btn" onclick="showTab('carrito')">🛒 Mi Pedido</button>
  <button class="tab-btn" onclick="showTab('tracking')">📦 Pedido</button>
  <button class="tab-btn" onclick="showTab('soporte')">❗ Soporte</button>
</div>

<div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar producto..." oninput="renderStore()"></div>

<div class="view active" id="view-tienda"><div id="storeContainer"></div></div>
<div class="view" id="view-carrito"><div id="cartContainer"></div></div>
<div class="view" id="view-tracking"><div id="trackingContainer"></div></div>
<div class="view" id="view-soporte"><div id="soporteContainer"></div></div>

<div class="floating-cart" id="floatingCart">
  <div class="floating-cart-info"><div class="floating-cart-label">Tu pedido</div><div class="floating-cart-total" id="floatTotal">$ 0.00</div></div>
  <button class="floating-cart-btn" onclick="showTab('carrito')">Ver pedido 🛒</button>
</div>

<button class="chat-fab" onclick="toggleChat()">💬</button>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",authDomain:"bodegatonytony.firebaseapp.com",projectId:"bodegatonytony",storageBucket:"bodegatonytony.firebasestorage.app",messagingSenderId:"763208241886",appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"});
const db=firebase.firestore();

let products=[],cart={},selectedCategory='Todos',selectedMetodo='pagoMovil';
let config={whatsapp:'+584242520138',metodosPago:{efectivo:true,pagoMovil:true,transferencia:false},tiempoPreparacion:30,pedidoMinimo:0,pagoMovil:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cedula:'6.966.714',telefono:'04241572275'},transferencia:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cuenta:''}};
let darkMode=localStorage.getItem('darkMode')==='1';

function applyDark(){document.body.classList.toggle('dark',darkMode);}
applyDark();

function tiendaAbierta(){return true;}
function horarioTexto(){return'09:00 AM - 10:00 PM';}
function actualizarBannerHorario(){const bar=document.getElementById('tiendaStatusBar');if(bar)bar.innerHTML='✅ Abierto · '+horarioTexto();}

db.collection('config').doc('tienda').onSnapshot(snap=>{if(snap.exists){const d=snap.data();config.whatsapp=d.whatsapp||config.whatsapp;config.metodosPago=d.metodosPago||config.metodosPago;config.tiempoPreparacion=d.tiempoPreparacion||30;config.pedidoMinimo=d.pedidoMinimo||0;config.pagoMovil=d.pagoMovil||config.pagoMovil;config.transferencia=d.transferencia||config.transferencia;}});
db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.visible!==false);console.log('Productos cargados:',products.length);renderStore();});

function cartKey(pid,v){return pid+'_'+(v||'');}
function getQty(pid,v){return(cart[cartKey(pid,v)]||{}).qty||0;}
function cartTotal(){return Object.values(cart).reduce((s,i)=>s+i.product.price*i.qty,0);}
function updateCartCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b.qty,0);}

function showTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab)?.classList.add('active');
  if(tab==='tienda')renderStore();
  if(tab==='carrito')renderCart();
  if(tab==='tracking')renderTracking();
  if(tab==='soporte')renderSoporte();
}

function renderStore(){
  const container=document.getElementById('storeContainer');
  if(!products.length){container.innerHTML='<div class="empty"><div class="empty-icon">🏪</div><p>No hay productos aún</p></div>';return;}
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
  const allCats=['Todos',...new Set(products.map(p=>p.category||'General'))];
  let html='<div class="cat-filter">';
  allCats.forEach(c=>{html+=`<button class="cat-chip${selectedCategory===c?' active':''}" onclick="filterCat('${c}')">${c}</button>`;});
  html+='</div>';
  const filtered=products.filter(p=>{const mc=selectedCategory==='Todos'||(p.category||'General')===selectedCategory;const ms=!q||p.name.toLowerCase().includes(q);return mc&&ms;});
  if(!filtered.length){html+='<div class="empty"><div class="empty-icon">🔍</div><p>No encontramos productos</p></div>';}
  else{
    html+='<div class="products-grid">';
    filtered.forEach(p=>{
      const imgHtml=p.photo?`<img src="${p.photo}" class="product-img">`:`<div class="product-emoji-big">${p.emoji||'📦'}</div>`;
      const actionHtml=p.agotado?`<div class="agotado-badge">❌ Agotado</div>`:(getQty(p.id,'')>0?`<div class="qty-ctrl"><button class="qty-btn" onclick="event.stopPropagation();changeQty('${p.id}','',-1)">−</button><span class="qty-num">${getQty(p.id,'')}</span><button class="qty-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+</button></div>`:`<button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+ Agregar</button>`);
      html+=`<div class="product-card">${p.oferta?'<span style="position:absolute;top:8px;left:8px;background:var(--rojo);color:white;border-radius:50px;padding:3px 9px;font-size:11px;font-weight:800;">🔥</span>':''}${imgHtml}<div class="product-info"><div class="product-name">${p.name}</div><div class="product-price">$ ${p.price}</div>${actionHtml}</div></div>`;
    });
    html+='</div>';
  }
  container.innerHTML=html;updateCartCount();
}

function filterCat(c){selectedCategory=c;renderStore();}
function addToCart(pid,v){
  console.log('addToCart llamado:',pid,v);
  const p=products.find(x=>x.id===pid);
  if(!p||p.agotado){showToast('❌ No disponible');return;}
  const key=cartKey(pid,v);
  if(!cart[key])cart[key]={product:p,variant:v||'',qty:0};
  cart[key].qty++;
  renderStore();showToast('✅ Agregado');updateCartCount();actualizarFloatingCart();
}
function changeQty(pid,v,delta){
  const key=cartKey(pid,v);if(!cart[key])return;
  cart[key].qty+=delta;if(cart[key].qty<=0)delete cart[key];
  renderStore();updateCartCount();actualizarFloatingCart();
}

function renderCart(){
  const container=document.getElementById('cartContainer');const keys=Object.keys(cart);
  if(!keys.length){container.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><p>Tu carrito está vacío</p></div>';return;}
  let total=0,itemsHtml='';keys.forEach(key=>{const item=cart[key],p=item.product,sub=p.price*item.qty;total+=sub;itemsHtml+=`<div class="cart-item"><div style="flex:1;"><div style="font-weight:700;">${p.name}</div><div style="color:var(--rojo);">$ ${p.price} × ${item.qty} = $ ${sub.toFixed(2)}</div></div><div class="qty-ctrl" style="width:auto;"><button class="qty-btn" onclick="changeQty('${p.id}','${item.variant}',-1);renderCart()">−</button><span class="qty-num">${item.qty}</span><button class="qty-btn" onclick="addToCart('${p.id}','${item.variant}');renderCart()">+</button></div></div>`;});
  const savedName=localStorage.getItem('clientName')||'',savedPhone=localStorage.getItem('clientPhone')||'',savedAddr=localStorage.getItem('clientAddress')||'';
  container.innerHTML=`<div>${itemsHtml}</div><div class="cart-total"><div>Total</div><div class="amount">$ ${total.toFixed(2)}</div></div><div class="customer-info" style="margin-top:12px;"><div style="font-weight:700;">📝 Tus datos</div><input type="text" id="custName" placeholder="Tu nombre *" value="${savedName}"><input type="tel" id="custPhone" placeholder="Tu teléfono *" value="${savedPhone}"><input type="text" id="custAddress" placeholder="Tu dirección *" value="${savedAddr}"></div><button class="whatsapp-btn" onclick="sendOrder()">📤 Enviar pedido por WhatsApp</button>`;
}

async function sendOrder(){
  const name=document.getElementById('custName')?.value.trim(),phone=document.getElementById('custPhone')?.value.trim(),address=document.getElementById('custAddress')?.value.trim();
  if(!name||!phone||!address){showToast('⚠️ Completa todos los campos');return;}
  let total=0,productosMsg='';
  Object.values(cart).forEach(item=>{const sub=item.product.price*item.qty;total+=sub;productosMsg+=`${item.product.emoji||'📦'} ${item.product.name} × ${item.qty} — $${sub.toFixed(2)}\n`;});
  localStorage.setItem('clientName',name);localStorage.setItem('clientPhone',phone);localStorage.setItem('clientAddress',address);
  try{
    const ref=await db.collection('pedidos').add({nombre:name,telefono:phone,direccion:address,metodoPago:selectedMetodo,productos:productosMsg,total,fecha:new Date().toISOString(),estado:'pendiente',tiempoEstimado:config.tiempoPreparacion||30});
    localStorage.setItem('pedidoActivoId',ref.id);
    let msg=`🛒 *Pedido #${ref.id.slice(-4).toUpperCase()} - Bodega Tony Tony*\n👤 *${name}*\n📞 *${phone}*\n📌 *${address}*\n\n🧺 *Productos:*\n${productosMsg}\n💰 *TOTAL: $${total.toFixed(2)}*`;
    window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
    cart={};updateCartCount();actualizarFloatingCart();showToast('✅ Pedido enviado');showTab('tienda');
  }catch(e){showToast('❌ Error al enviar');}
}

function renderTracking(){
  const container=document.getElementById('trackingContainer');
  const pid=localStorage.getItem('pedidoActivoId');
  if(!pid){container.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No tienes pedidos activos</p></div>';return;}
  db.collection('pedidos').doc(pid).get().then(snap=>{
    if(!snap.exists){container.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>Pedido no encontrado</p></div>';return;}
    const p=snap.data();
    container.innerHTML=`<div style="text-align:center;padding:20px;"><div style="font-size:50px;">📦</div><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;margin:10px 0;">#${pid.slice(-4).toUpperCase()}</div><span style="padding:6px 14px;border-radius:50px;background:#fff3cd;color:#856404;font-weight:800;">${p.estado||'pendiente'}</span><div style="margin:16px 0;font-size:13px;white-space:pre-line;">${p.productos}</div><div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--rojo);">$ ${p.total?.toFixed(2)||'0.00'}</div></div>`;
  });
}

function renderSoporte(){document.getElementById('soporteContainer').innerHTML=`<div style="background:var(--card);border-radius:16px;padding:18px;"><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--rojo);margin-bottom:16px;">❗ Reportar problema</div><input type="text" id="sNombre" placeholder="Tu nombre *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);"><input type="tel" id="sTelefono" placeholder="Tu teléfono *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);"><textarea id="sDescripcion" placeholder="Describe el problema *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);min-height:90px;"></textarea><button onclick="enviarSoporte()" style="width:100%;background:var(--rojo);color:white;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;">📤 Enviar reporte</button></div>`;}
async function enviarSoporte(){const n=document.getElementById('sNombre')?.value.trim(),t=document.getElementById('sTelefono')?.value.trim(),d=document.getElementById('sDescripcion')?.value.trim();if(!n||!t||!d){showToast('⚠️ Completa todos los campos');return;}await db.collection('soporte').add({clienteNombre:n,telefono:t,descripcion:d,estado:'nuevo',fecha:new Date().toISOString()});showToast('✅ Reporte enviado');showTab('tienda');}

function toggleChat(){window.open(`https://wa.me/${config.whatsapp}`,'_blank');}

function actualizarFloatingCart(){const total=cartTotal();const items=Object.values(cart).reduce((a,b)=>a+b.qty,0);const bar=document.getElementById('floatingCart');if(!bar)return;if(items>0){bar.classList.add('visible');document.body.classList.add('has-float-bar');document.getElementById('floatTotal').textContent=`$ ${total.toFixed(2)} · ${items} item${items>1?'s':''}`;}else{bar.classList.remove('visible');document.body.classList.remove('has-float-bar');}}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

setTimeout(()=>{
  if(!localStorage.getItem('clientName')){
    const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML=`<div style="background:var(--card);border-radius:24px;padding:28px 20px;width:100%;max-width:320px;text-align:center;"><div style="font-size:50px;">🛒</div><div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);margin-bottom:20px;">Bodega Tony Tony</div><input type="text" id="regNombre" placeholder="Tu nombre" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);"><div style="position:relative;margin-bottom:16px;"><select id="regCodigo" style="position:absolute;left:0;top:0;bottom:0;width:80px;border:2px solid var(--border);border-right:none;border-radius:12px 0 0 12px;font-weight:700;outline:none;background:var(--bg);color:var(--text);"><option value="+58">🇻🇪 +58</option><option value="+57">🇨🇴 +57</option></select><input type="tel" id="regTelefono" placeholder="Número sin código" style="width:100%;padding:12px 16px 12px 90px;border:2px solid var(--border);border-radius:12px;outline:none;background:var(--bg);color:var(--text);"></div><button onclick="window._guardarRegistro()" style="width:100%;background:var(--rojo);color:white;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;">Continuar →</button></div>`;document.body.appendChild(modal);
    window._guardarRegistro=function(){const n=document.getElementById('regNombre')?.value.trim();const c=document.getElementById('regCodigo')?.value||'+58';const t=document.getElementById('regTelefono')?.value.trim();if(!n||!t){showToast('⚠️ Completa tus datos');return;}localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',c+t.replace(/\D/g,''));modal.remove();showToast('¡Bienvenido '+n+'! 🎉');};
  }
},800);

setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},1200);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
