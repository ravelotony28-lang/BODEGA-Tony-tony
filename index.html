</style>

<script>
firebase.initializeApp({apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",authDomain:"bodegatonytony.firebaseapp.com",projectId:"bodegatonytony",storageBucket:"bodegatonytony.firebasestorage.app",messagingSenderId:"763208241886",appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"});
const db=firebase.firestore();

let products=[],cart={},deliveryType='domicilio',selectedCategory='Todos',comprobanteBase64='',darkMode=localStorage.getItem('darkMode')==='1';
let config={whatsapp:'+584242520138',metodosPago:{efectivo:true,pagoMovil:true,transferencia:false},envioGratis:true,tiempoPreparacion:30,pedidoMinimo:0,horario:{apertura:0,cierre:24},pagoMovil:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cedula:'6.966.714',telefono:'04241572275'},transferencia:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cuenta:''}};
let zonas=[],selectedZona=null,selectedMetodo='pagoMovil',clienteGeo=null,pedidoActivoUnsub=null,chatUnsub=null;

function applyDark(){document.body.classList.toggle('dark',darkMode);document.getElementById('darkBtn').textContent=darkMode?'☀️':'🌙';}
function toggleDark(){darkMode=!darkMode;localStorage.setItem('darkMode',darkMode?'1':'0');applyDark();}
applyDark();

function tiendaAbierta(){const h=config.horario||{apertura:0,cierre:24};const ahora=new Date();const totalMin=ahora.getHours()*60+ahora.getMinutes();const aperMin=(h.apertura||0)*60+(h.minutosApertura||0);const cierreMin=(h.cierre||24)*60+(h.minutosCierre||0);if(aperMin<cierreMin)return totalMin>=aperMin&&totalMin<cierreMin;return totalMin>=aperMin||totalMin<cierreMin;}
function horarioTexto(){const h=config.horario||{apertura:10,cierre:22};function fmt(n){const v=Number(n);if(v===0)return'12:00 AM';if(v<12)return`${String(v).padStart(2,'0')}:00 AM`;if(v===12)return'12:00 PM';return`${String(v-12).padStart(2,'0')}:00 PM`;}return`${fmt(h.apertura)} - ${fmt(h.cierre)}`;}
function actualizarBannerHorario(){const bar=document.getElementById('tiendaStatusBar');if(!bar)return;const abierto=tiendaAbierta();bar.className=`tienda-status-bar ${abierto?'tienda-abierta':'tienda-cerrada'}`;bar.textContent=abierto?`✅ Abierto · ${horarioTexto()}`:`⏰ Cerrado · ${horarioTexto()}`;}
function tiempoRango(){const t=config.tiempoPreparacion||30;return`${t}–${t+10} min`;}

db.collection('config').doc('tienda').onSnapshot(snap=>{if(snap.exists){const d=snap.data();config.whatsapp=d.whatsapp||config.whatsapp;config.metodosPago=d.metodosPago||config.metodosPago;config.envioGratis=d.envioGratis!==false;config.tiempoPreparacion=d.tiempoPreparacion||30;config.pedidoMinimo=d.pedidoMinimo||0;config.horario=d.horario||config.horario;config.pagoMovil=d.pagoMovil||config.pagoMovil;config.transferencia=d.transferencia||config.transferencia;actualizarBannerHorario();}});
db.collection('zonas').onSnapshot(snap=>{zonas=snap.docs.map(d=>({id:d.id,...d.data()}));});
db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.visible!==false);renderStore();});
setInterval(actualizarBannerHorario,60000);

function cartKey(pid,v){return pid+'_'+(v||'');}
function getQty(pid,v){return(cart[cartKey(pid,v)]||{}).qty||0;}
function cartTotal(){return Object.values(cart).reduce((s,i)=>s+i.product.price*i.qty,0);}
function updateCartCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b.qty,0);}

function showTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab)?.classList.add('active');
  document.getElementById('tab-'+tab)?.classList.add('active');
  document.getElementById('searchWrap').style.display=tab==='tienda'?'block':'none';
  if(tab==='tienda')renderStore();
  if(tab==='carrito')renderCart();
  if(tab==='soporte')renderSoporte();
  if(tab==='historial')renderHistorial();
  if(tab==='tracking'){const pid=localStorage.getItem('pedidoActivoId');if(pid){db.collection('pedidos').doc(pid).get().then(snap=>{if(snap.exists)renderTracking(pid,snap.data());else document.getElementById('trackingContainer').innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No hay pedido activo</p></div>';});}else{document.getElementById('trackingContainer').innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No tienes pedidos en curso</p><button onclick="showTab(\'tienda\')" style="background:var(--rojo);color:white;border:none;border-radius:50px;padding:10px 20px;font-weight:700;cursor:pointer;margin-top:10px;">Hacer un pedido</button></div>';}}
}

function esc(str){return(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function renderStore(){
  const container=document.getElementById('storeContainer');
  if(!products.length){container.innerHTML='<div class="empty"><div class="empty-icon">🏪</div><p>¡Pronto hay productos!</p></div>';updateCartCount();return;}
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
  const badgeLabel={oferta:'🔥 Oferta',popular:'⭐ Popular',recomendado:'👍 Recomendado',combo:'📦 Combo',hoy:'⏰ Oferta por hoy'};
  const ofertas=products.filter(p=>p.oferta&&!p.agotado&&!q);
  const allCats=['Todos',...new Set(products.map(p=>p.category||'General'))];
  const catEmojis={'Todos':'🏪','Víveres':'🌽','Refrescos':'🥤','Dulces':'🍬','Frescos':'🧀','Higiene Personal':'🧴','Limpieza del Hogar':'🧺','Bebé':'🍼','Papelería':'✏️','Farmacia':'💊','Varios':'💡'};
  let html='';
  if(ofertas.length>0&&!q){html+=`<div class="ofertas-banner"><div><div class="title">🔥 Ofertas del día</div></div></div><div class="scroll-row">`;ofertas.forEach(p=>{html+=buildCard(p,badgeLabel,true);});html+='</div>';}
  html+='<div class="cat-filter">';allCats.forEach(c=>{html+=`<button class="cat-chip${selectedCategory===c?' active':''}" onclick="filterCat('${c}')">${catEmojis[c]||'📦'} ${c}</button>`;});html+='</div>';
  const filtered=products.filter(p=>{const mc=selectedCategory==='Todos'||(p.category||'General')===selectedCategory;const ms=!q||p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q);return mc&&ms;});
  if(!filtered.length){html+='<div class="empty"><div class="empty-icon">🔍</div><p>No encontramos productos</p></div>';}
  else{html+='<div class="products-grid">';filtered.forEach(p=>{html+=buildCard(p,badgeLabel,false);});html+='</div>';}
  container.innerHTML=html;updateCartCount();
}

function buildCard(p,badgeLabel,isScroll){
  const cls=isScroll?'oferta-card':'product-card';
  let badges='';if(p.oferta)badges+='<span class="badge badge-oferta">🔥 Oferta</span>';
  const imgHtml=p.photo?`<img src="${esc(p.photo)}" class="product-img">`:`<div class="product-emoji-big">${p.emoji||'📦'}</div>`;
  const priceHtml=p.oferta&&p.precioAnterior?`<div class="price-old">$ ${p.precioAnterior}</div><div class="price-new">$ ${p.price}</div>`:`<div class="product-price">$ ${p.price}</div>`;
  return`<div class="${cls}">${badges}<span class="cat-badge">${p.category||'General'}</span>${imgHtml}<div class="product-info"><div class="product-name">${p.name}</div>${priceHtml}${buildActionHtml(p)}</div></div>`;
}

function buildActionHtml(p){
  if(p.agotado)return'<div class="agotado-badge">❌ Agotado</div>';
  const qty=getQty(p.id,'');
  if(qty===0)return`<button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+ Agregar</button><button class="quick-btn" onclick="event.stopPropagation();pedidoRapido('${p.id}','')">⚡ Pedir rápido</button>`;
  return`<div class="qty-ctrl"><button class="qty-btn" onclick="event.stopPropagation();changeQty('${p.id}','',-1)">−</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="event.stopPropagation();changeQty('${p.id}','',1)">+</button></div>`;
}

function filterCat(c){selectedCategory=c;renderStore();}
function pedidoRapido(pid,v){addToCart(pid,v);showTab('carrito');}
function addToCart(pid,v){const p=products.find(x=>x.id===pid);if(!p||p.agotado){showToast('❌ No disponible');return;}const key=cartKey(pid,v);if(!cart[key])cart[key]={product:p,variant:v||'',qty:0};cart[key].qty++;renderStore();showToast('✅ Agregado');updateCartCount();actualizarFloatingCart();}
function changeQty(pid,v,delta){const key=cartKey(pid,v);if(!cart[key])return;cart[key].qty+=delta;if(cart[key].qty<=0)delete cart[key];renderStore();updateCartCount();actualizarFloatingCart();}

function renderCart(){
  const container=document.getElementById('cartContainer');const keys=Object.keys(cart);
  if(!keys.length){container.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><p>Tu carrito está vacío</p></div>';return;}
  let total=0,itemsHtml='';keys.forEach(key=>{const item=cart[key],p=item.product,sub=p.price*item.qty;total+=sub;const thumbHtml=p.photo?`<img src="${p.photo}" class="thumb">`:`<div class="cemoji">${p.emoji||'📦'}</div>`;itemsHtml+=`<div class="cart-item">${thumbHtml}<div style="flex:1;"><div style="font-weight:700;">${p.name}</div><div style="color:var(--rojo);">$ ${p.price} × ${item.qty} = $ ${sub.toFixed(2)}</div></div><div class="qty-ctrl" style="width:auto;"><button class="qty-btn" onclick="changeQty('${p.id}','${item.variant}',-1);renderCart()">−</button><span class="qty-num">${item.qty}</span><button class="qty-btn" onclick="addToCart('${p.id}','${item.variant}');renderCart()">+</button></div></div>`;});
  const savedName=localStorage.getItem('clientName')||'',savedPhone=localStorage.getItem('clientPhone')||'',savedAddr=localStorage.getItem('clientAddress')||'';
  const metodosHtml=Object.entries(config.metodosPago).filter(([,v])=>v).map(([k])=>{const labels={efectivo:'💵 Efectivo',pagoMovil:'📱 Pago Móvil',transferencia:'🏦 Transferencia'};return`<div class="metodo-chip${selectedMetodo===k?' selected':''}" onclick="selectedMetodo='${k}';renderCart()">${labels[k]||k}</div>`;}).join('');
  container.innerHTML=`
    <div>${itemsHtml}</div>
    <div class="cart-total"><div>Total</div><div class="amount">$ ${total.toFixed(2)}</div></div>
    <div style="display:flex;gap:10px;margin:12px 0;"><div class="delivery-opt ${deliveryType==='domicilio'?'selected':''}" onclick="setDelivery('domicilio')">🛵 Domicilio</div><div class="delivery-opt ${deliveryType==='recoger'?'selected':''}" onclick="setDelivery('recoger')">🏪 Recoger</div></div>
    <div style="font-weight:700;margin-bottom:8px;">💳 Método de pago</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${metodosHtml}</div>
    ${selectedMetodo==='pagoMovil'?`<div class="pago-card"><div style="font-weight:800;">📱 Pago Móvil</div><div>🏦 ${config.pagoMovil.banco}<br>👤 ${config.pagoMovil.nombre}<br>🪪 ${config.pagoMovil.cedula}<br>📱 ${config.pagoMovil.telefono}</div></div>`:''}
    <div class="customer-info" style="margin-top:12px;"><div style="font-weight:700;">📝 Tus datos</div><input type="text" id="custName" placeholder="Tu nombre *" value="${savedName}"><input type="tel" id="custPhone" placeholder="Tu teléfono *" value="${savedPhone}">${deliveryType==='domicilio'?`<input type="text" id="custAddress" placeholder="Tu dirección *" value="${savedAddr}">`:''}</div>
    <button class="whatsapp-btn" onclick="sendOrder()">📤 Enviar pedido por WhatsApp</button>`;
}

function setDelivery(type){deliveryType=type;renderCart();}

async function sendOrder(){
  const name=document.getElementById('custName')?.value.trim(),phone=document.getElementById('custPhone')?.value.trim(),address=document.getElementById('custAddress')?.value.trim();
  if(!name||!phone){showToast('⚠️ Completa nombre y teléfono');return;}
  if(deliveryType==='domicilio'&&!address){showToast('⚠️ Falta tu dirección');return;}
  let total=0,productosMsg='',productosArray=[];
  Object.values(cart).forEach(item=>{const sub=item.product.price*item.qty;total+=sub;productosMsg+=`${item.product.emoji||'📦'} ${item.product.name} × ${item.qty} — $${sub.toFixed(2)}\n`;productosArray.push({emoji:item.product.emoji||'📦',name:item.product.name,qty:item.qty,price:item.product.price});});
  localStorage.setItem('clientName',name);localStorage.setItem('clientPhone',phone);if(address)localStorage.setItem('clientAddress',address);
  try{
    const ref=await db.collection('pedidos').add({nombre:name,telefono:phone,entrega:deliveryType,direccion:address||'',metodoPago:selectedMetodo,productos:productosMsg,productosArray,total,fecha:new Date().toISOString(),estado:'pendiente',tiempoEstimado:config.tiempoPreparacion||30});
    localStorage.setItem('pedidoActivoId',ref.id);
    let msg=`🛒 *Pedido #${ref.id.slice(-4).toUpperCase()} - Bodega Tony Tony*\n👤 *${name}*\n📞 *${phone}*\n📌 *${address||'Recoger en tienda'}*\n💳 *${selectedMetodo}*\n\n🧺 *Productos:*\n${productosMsg}\n💰 *TOTAL: $${total.toFixed(2)}*`;
    window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
    cart={};updateCartCount();actualizarFloatingCart();showToast('✅ Pedido enviado');showTab('tracking');
  }catch(e){showToast('❌ Error al enviar');}
}

function renderTracking(pid,data){
  const container=document.getElementById('trackingContainer');
  const estado=data.estado||'pendiente',corto='#'+pid.slice(-4).toUpperCase();
  const estadoMap={pendiente:'⏳ Pendiente',confirmado:'✅ Confirmado',preparacion:'🍳 Preparando',camino:'🛵 En camino',entregado:'📦 Entregado'};
  const estadoColor={pendiente:'#856404',confirmado:'#155724',preparacion:'#004085',camino:'#c05621',entregado:'#155724'};
  const estadoBg={pendiente:'#fff3cd',confirmado:'#d4edda',preparacion:'#cce5ff',camino:'#ffe5d0',entregado:'#d4edda'};
  container.innerHTML=`<div style="text-align:center;padding:20px 0;"><div style="font-size:40px;">🛒</div><div style="font-family:'Bebas Neue',sans-serif;font-size:32px;">${corto}</div><span style="display:inline-block;font-size:13px;font-weight:800;padding:6px 14px;border-radius:50px;background:${estadoBg[estado]};color:${estadoColor[estado]};">${estadoMap[estado]}</span></div><div style="background:var(--oscuro);color:white;border-radius:16px;padding:16px;text-align:center;margin:14px 0;"><div style="font-size:12px;">Total</div><div style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--amarillo);">$ ${data.total?.toFixed(2)||'0.00'}</div></div><div style="font-size:13px;white-space:pre-line;color:var(--subtext);">${data.productos||''}</div><button onclick="showTab('tienda')" style="width:100%;margin-top:14px;padding:12px;background:var(--card);color:var(--text);border:2px solid var(--border);border-radius:12px;font-weight:800;cursor:pointer;">Hacer otro pedido</button>`;
}

function renderHistorial(){
  const container=document.getElementById('historialContainer');const phone=localStorage.getItem('clientPhone')||'';
  if(!phone){container.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>Haz tu primer pedido</p></div>';return;}
  container.innerHTML='<p style="text-align:center;color:var(--subtext);">⏳ Cargando...</p>';
  db.collection('pedidos').where('telefono','==',phone).orderBy('fecha','desc').limit(20).get().then(snap=>{if(snap.empty){container.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>No tienes pedidos</p></div>';return;}container.innerHTML=snap.docs.map(d=>{const p=d.data();return`<div style="background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;"><div style="font-weight:800;">#${d.id.slice(-4).toUpperCase()} · ${new Date(p.fecha).toLocaleString('es-VE')}</div><div style="font-size:13px;white-space:pre-line;color:var(--subtext);">${p.productos}</div><div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--rojo);">$ ${p.total?.toFixed(2)||'0.00'}</div></div>`;}).join('');});
}

function renderSoporte(){document.getElementById('soporteContainer').innerHTML=`<div style="background:var(--card);border-radius:16px;padding:18px;"><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--rojo);margin-bottom:16px;">❗ Reportar problema</div><input type="text" id="sNombre" placeholder="Tu nombre *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);"><input type="tel" id="sTelefono" placeholder="Tu teléfono *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);"><textarea id="sDescripcion" placeholder="Describe el problema *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);min-height:90px;"></textarea><button onclick="enviarSoporte()" style="width:100%;background:var(--rojo);color:white;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;">📤 Enviar reporte</button></div>`;}
async function enviarSoporte(){const n=document.getElementById('sNombre')?.value.trim(),t=document.getElementById('sTelefono')?.value.trim(),d=document.getElementById('sDescripcion')?.value.trim();if(!n||!t||!d){showToast('⚠️ Completa todos los campos');return;}await db.collection('soporte').add({clienteNombre:n,telefono:t,descripcion:d,estado:'nuevo',fecha:new Date().toISOString()});showToast('✅ Reporte enviado');showTab('tienda');}

function actualizarFloatingCart(){const total=cartTotal();const items=Object.values(cart).reduce((a,b)=>a+b.qty,0);const bar=document.getElementById('floatingCart');if(!bar)return;if(items>0){bar.classList.add('visible');document.body.classList.add('has-float-bar');document.getElementById('floatTotal').textContent=`$ ${total.toFixed(2)} · ${items} item${items>1?'s':''}`;}else{bar.classList.remove('visible');document.body.classList.remove('has-float-bar');}}

// ═══════════════ CHAT EN VIVO ═══════════════
function toggleChat(){
  const win=document.getElementById('chatWindow');
  win.classList.toggle('open');
  if(win.classList.contains('open'))initChat();
}

function initChat(){
  if(chatUnsub)return;
  const phone=localStorage.getItem('clientPhone')||'anonimo';
  const chatRef=db.collection('chats').doc(phone).collection('mensajes');
  chatUnsub=chatRef.orderBy('fecha','asc').onSnapshot(snap=>{
    const msgs=document.getElementById('chatMessages');
    if(!msgs)return;
    msgs.innerHTML=snap.docs.map(d=>{const m=d.data();return`<div class="chat-msg ${m.de==='cliente'?'mio':'tienda'}"><div style="font-size:10px;opacity:0.7;">${m.de==='cliente'?'Tú':'Bodega Tony'}</div>${m.texto}</div>`;}).join('');
    msgs.scrollTop=msgs.scrollHeight;
  });
}

function sendChat(){
  const input=document.getElementById('chatInput');
  const texto=input.value.trim();
  if(!texto)return;
  const phone=localStorage.getItem('clientPhone')||'anonimo';
  db.collection('chats').doc(phone).collection('mensajes').add({texto,fecha:new Date().toISOString(),de:'cliente'});
  input.value='';
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

setTimeout(()=>{if(!localStorage.getItem('clientName')){const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';modal.innerHTML=`<div style="background:var(--card);border-radius:24px;padding:28px 20px;width:100%;max-width:320px;text-align:center;"><div style="font-size:50px;">🛒</div><div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);margin-bottom:20px;">Bodega Tony Tony</div><input type="text" id="regNombre" placeholder="Tu nombre" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);"><div style="position:relative;margin-bottom:16px;"><select id="regCodigo" style="position:absolute;left:0;top:0;bottom:0;width:80px;border:2px solid var(--border);border-right:none;border-radius:12px 0 0 12px;font-weight:700;outline:none;background:var(--bg);color:var(--text);padding:0 4px;"><option value="+58">🇻🇪 +58</option><option value="+57">🇨🇴 +57</option></select><input type="tel" id="regTelefono" placeholder="Número sin código" style="width:100%;padding:12px 16px 12px 90px;border:2px solid var(--border);border-radius:12px;outline:none;background:var(--bg);color:var(--text);"></div><button onclick="window._guardarRegistro()" style="width:100%;background:var(--rojo);color:white;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;">Continuar →</button></div>`;document.body.appendChild(modal);window._guardarRegistro=function(){const n=document.getElementById('regNombre')?.value.trim();const c=document.getElementById('regCodigo')?.value||'+58';const t=document.getElementById('regTelefono')?.value.trim();if(!n||!t){showToast('⚠️ Completa tus datos');return;}localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',c+t.replace(/\D/g,''));modal.remove();showToast('¡Bienvenido '+n+'! 🎉');};}},800);

setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},1200);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
