<style>

body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overscroll-behavior:none;}

.cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:transform var(--anim),box-shadow 0.2s;box-shadow:0 4px 12px rgba(230,57,70,0.4);}

.cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;transition:transform var(--anim);}

.delivery-options{display:flex;gap:10px;margin:12px 0;}
.delivery-opt{flex:1;padding:12px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;font-weight:700;font-size:14px;background:var(--card);color:var(--text);transition:all 0.2s;}

.metodo-chip{flex:1;padding:10px;border:2px solid var(--border);border-radius:12px;cursor:pointer;text-align:center;font-weight:700;font-size:13px;background:var(--card);color:var(--text);transition:all 0.2s;}

.customer-info input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:10px;outline:none;background:var(--bg);color:var(--text);transition:border 0.2s,box-shadow 0.2s;}
.customer-info input:focus{border-color:var(--rojo);box-shadow:0 0 0 3px rgba(230,57,70,0.15);}
.whatsapp-btn{background:#25d366;color:white;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;transition:transform var(--anim),box-shadow 0.2s;box-shadow:0 4px 16px rgba(37,211,102,0.4);}

.toast{position:fixed;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;font-size:14px;z-index:999;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
.zoom-modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.2s ease;}

.floating-cart.visible{transform:translateY(0);}
.floating-cart-info{flex:1;}
.floating-cart-total{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--amarillo);}

.floating-cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:12px 22px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform var(--anim);}
.floating-cart-btn:active{transform:scale(0.95);}
body.has-float-bar .view{padding-bottom:80px;}
.chat-fab{position:fixed;bottom:100px;right:20px;z-index:400;background:var(--verde);color:white;width:56px;height:56px;border-radius:50%;border:none;font-size:28px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;transition:transform 0.2s;}
.chat-fab:active{transform:scale(0.9);}
.chat-window{position:fixed;bottom:0;right:0;width:100%;max-width:380px;height:70vh;background:var(--card);z-index:500;border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,0.3);display:flex;flex-direction:column;transform:translateY(100%);transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1);}
.chat-window.open{transform:translateY(0);}
.chat-header{background:var(--verde);color:white;padding:14px 16px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;}

.chat-input-wrap{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
.chat-input-wrap input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:20px;outline:none;background:var(--bg);color:var(--text);font-size:14px;}

@media(max-width:400px){.products-grid{grid-template-columns:repeat(2,1fr);}.logo-text{font-size:18px;}}
</style>
</head>

<script>
firebase.initializeApp({apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",authDomain:"bodegatonytony.firebaseapp.com",projectId:"bodegatonytony",storageBucket:"bodegatonytony.firebasestorage.app",messagingSenderId:"763208241886",appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"});
const db=firebase.firestore();

let products=[],cart={},deliveryType='domicilio',selectedCategory='Todos',comprobanteBase64='',darkMode=localStorage.getItem('darkMode')==='1';
let config={whatsapp:'+584242520138',metodosPago:{efectivo:true,pagoMovil:true,transferencia:false},envioGratis:true,tiempoPreparacion:30,pedidoMinimo:0,horario:{apertura:0,cierre:24},pagoMovil:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cedula:'6.966.714',telefono:'04241572275'},transferencia:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cuenta:''}};
let zonas=[],selectedZona=null,selectedMetodo='pagoMovil',clienteGeo=null;

function applyDark(){document.body.classList.toggle('dark',darkMode);document.getElementById('darkBtn').textContent=darkMode?'☀️':'🌙';}
function toggleDark(){darkMode=!darkMode;localStorage.setItem('darkMode',darkMode?'1':'0');applyDark();}
applyDark();

function tiendaAbierta(){const h=config.horario||{apertura:0,cierre:24};const ahora=new Date();const totalMin=ahora.getHours()*60+ahora.getMinutes();const aperMin=(h.apertura||0)*60+(h.minutosApertura||0);const cierreMin=(h.cierre||24)*60+(h.minutosCierre||0);if(aperMin<cierreMin)return totalMin>=aperMin&&totalMin<cierreMin;return totalMin>=aperMin||totalMin<cierreMin;}
function horarioTexto(){const h=config.horario||{apertura:10,cierre:22};function fmt(n){const v=Number(n);if(v===0)return'12:00 AM';if(v<12)return`${String(v).padStart(2,'0')}:00 AM`;if(v===12)return'12:00 PM';return`${String(v-12).padStart(2,'0')}:00 PM`;}return`${fmt(h.apertura)} - ${fmt(h.cierre)}`;}
function actualizarBannerHorario(){const bar=document.getElementById('tiendaStatusBar');if(!bar)return;const abierto=tiendaAbierta();bar.className=`tienda-status-bar ${abierto?'tienda-abierta':'tienda-cerrada'}`;bar.textContent=abierto?`✅ Abierto · ${horarioTexto()}`:`⏰ Cerrado · ${horarioTexto()}`;}
function tiempoRango(){const t=config.tiempoPreparacion||30;return`${t}–${t+10} min`;}

db.collection('config').doc('tienda').onSnapshot(snap=>{if(snap.exists){const d=snap.data();config.whatsapp=d.whatsapp||config.whatsapp;config.metodosPago=d.metodosPago||config.metodosPago;config.envioGratis=d.envioGratis!==false;config.tiempoPreparacion=d.tiempoPreparacion||30;config.pedidoMinimo=d.pedidoMinimo||0;config.horario=d.horario||config.horario;config.pagoMovil=d.pagoMovil||config.pagoMovil;config.transferencia=d.transferencia||config.transferencia;actualizarBannerHorario();}});
db.collection('zonas').onSnapshot(snap=>{zonas=snap.docs.map(d=>({id:d.id,...d.data()}));});
db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.visible!==false);console.log('Productos cargados:',products.length);renderStore();});
setInterval(actualizarBannerHorario,60000);

function cartKey(pid,v){return pid+'_'+(v||'');}
function getQty(pid,v){return(cart[cartKey(pid,v)]||{}).qty||0;}
function totalQtyForProduct(pid){return Object.keys(cart).filter(k=>k.startsWith(pid+'_')).reduce((s,k)=>s+cart[k].qty,0);}
function cartTotal(){return Object.values(cart).reduce((s,i)=>s+i.product.price*i.qty,0);}
function updateCartCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b.qty,0);}
function updateEnvioBar(){updateCartCount();actualizarFloatingCart();}

function showTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab)?.classList.add('active');
  document.getElementById('tab-'+tab)?.classList.add('active');
  document.getElementById('searchWrap').style.display=tab==='tienda'?'block':'none';
  if(tab==='tienda')renderStore();
  if(tab==='carrito')renderCart();
  if(tab==='soporte')renderSoporte();
  if(tab==='tracking'){const pid=localStorage.getItem('pedidoActivoId');if(pid){db.collection('pedidos').doc(pid).get().then(snap=>{if(snap.exists)renderTracking(pid,snap.data());else{document.getElementById('trackingContainer').innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No hay pedido activo</p></div>';}});}else{document.getElementById('trackingContainer').innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No tienes pedidos en curso</p><br><button onclick="showTab(\'tienda\')" style="background:var(--rojo);color:white;border:none;border-radius:50px;padding:10px 20px;font-weight:700;cursor:pointer;margin-top:10px;">Hacer un pedido</button></div>';}}
}

function esc(str){return(str||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}

function renderStore(){
  const container=document.getElementById('storeContainer');
  if(!products.length){container.innerHTML='<div class="empty"><div class="empty-icon">🏪</div><p>¡Pronto hay productos!</p></div>';updateCartCount();return;}
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
  const badgeLabel={oferta:'🔥 Oferta',popular:'⭐ Popular',recomendado:'👍 Recomendado',combo:'📦 Combo',hoy:'⏰ Oferta por hoy'};
  const ofertas=products.filter(p=>p.oferta&&!p.agotado&&!q);
  const allCats=['Todos',...new Set(products.map(p=>p.category||'General'))];
  const catEmojis={'Todos':'🏪','Víveres':'🌽','Refrescos':'🥤','Dulces':'🍬','Frescos':'🧀','Higiene Personal':'🧴','Cabello':'💆','Limpieza del Hogar':'🧺','Bebé':'🍼','Papelería':'✏️','Farmacia':'💊','Varios':'💡'};
  let html='';
  if(ofertas.length>0&&!q){html+=`<div class="ofertas-banner"><div><div class="title">🔥 Ofertas del día</div><div style="font-size:12px;opacity:0.9;">${ofertas.length} productos</div></div><div style="font-size:40px;">🏷️</div></div><div class="scroll-row">`;ofertas.forEach(p=>{html+=buildCard(p,badgeLabel,true);});html+='</div>';}
  html+='<div class="cat-filter">';allCats.forEach(c=>{html+=`<button class="cat-chip${selectedCategory===c?' active':''}" onclick="filterCat('${c}')">${catEmojis[c]||'📦'} ${c}</button>`;});html+='</div>';
  const filtered=products.filter(p=>{const mc=selectedCategory==='Todos'||(p.category||'General')===selectedCategory;const ms=!q||p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q);return mc&&ms;});
  if(!filtered.length){html+='<div class="empty"><div class="empty-icon">🔍</div><p>No encontramos productos</p></div>';}
  else{const cats={};filtered.forEach(p=>{const c=p.category||'General';if(!cats[c])cats[c]=[];cats[c].push(p);});for(const cat in cats){if(selectedCategory==='Todos')html+=`<div class="section-title">${catEmojis[cat]||'📦'} ${cat}</div>`;html+='<div class="products-grid">';cats[cat].forEach(p=>{html+=buildCard(p,badgeLabel,false);});html+='</div>';}}
  container.innerHTML=html;updateCartCount();
}

function buildCard(p,badgeLabel,isScroll){
  const cls=isScroll?'oferta-card':'product-card';
  let badges='';if(p.oferta)badges+='<span class="badge badge-oferta">🔥 Oferta</span>';else if(p.etiqueta&&badgeLabel[p.etiqueta])badges+=`<span class="badge badge-${p.etiqueta}">${badgeLabel[p.etiqueta]}</span>`;
  const safeName=esc(p.name),safeEmoji=esc(p.emoji||'📦');
  const imgHtml=p.photo?`<img src="${esc(p.photo)}" class="product-img" onclick="zoomProduct('${esc(p.photo)}','${safeName}','${safeEmoji}',${p.price})" style="cursor:zoom-in;">`:`<div class="product-emoji-big" onclick="zoomProduct('','${safeName}','${safeEmoji}',${p.price})" style="cursor:pointer;">${p.emoji||'📦'}</div>`;
  const priceHtml=p.oferta&&p.precioAnterior?`<div class="price-old">$ ${p.precioAnterior}</div><div class="price-new">$ ${p.price}</div><div class="price-save">Ahorras $${(p.precioAnterior-p.price).toFixed(2)}</div>`:`<div class="product-price">$ ${p.price}</div>`;
  return`<div class="${cls}">${badges}<span class="cat-badge">${p.category||'General'}</span>${imgHtml}<div class="product-info"><div class="product-name">${p.name}</div>${priceHtml}${buildActionHtml(p)}</div></div>`;
}

function buildActionHtml(p){
  if(p.agotado)return'<div class="agotado-badge">❌ Agotado</div>';
  const hasV=p.variants&&p.variants.length>0;const tQty=totalQtyForProduct(p.id);
  if(!hasV){const qty=getQty(p.id,'');if(qty===0)return`<button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+ Agregar</button>`;return`<div class="qty-ctrl"><button class="qty-btn" onclick="event.stopPropagation();changeQty('${p.id}','',-1)">−</button><span class="qty-num">${qty}</span><button class="qty-btn" onclick="event.stopPropagation();changeQty('${p.id}','',1)">+</button></div>`;}
  let v='<div class="variants-label">Elige:</div><div class="variants-list">';p.variants.forEach(vr=>{const qty=getQty(p.id,vr),safeVr=esc(vr);v+=`<span class="variant-chip${qty>0?' selected':''}" onclick="event.stopPropagation();toggleVariant('${p.id}','${safeVr}')">${vr}${qty>0?' ×'+qty:''}</span>`;});v+='</div>';if(tQty>0)v+=`<div class="in-cart-badge">✅ ${tQty} en carrito</div>`;return v;
}

function filterCat(c){selectedCategory=c;renderStore();}
function toggleVariant(pid,variant){getQty(pid,variant)===0?addToCart(pid,variant):changeQty(pid,variant,-getQty(pid,variant));}
function addToCart(pid,variant){const key=cartKey(pid,variant);const p=products.find(x=>x.id===pid);if(!p||p.agotado){showToast('❌ Producto no disponible');return;}if(!cart[key])cart[key]={product:p,variant:variant||'',qty:0};cart[key].qty++;renderStore();showToast('✅ Agregado al carrito');updateEnvioBar();}
function changeQty(pid,variant,delta){const key=cartKey(pid,variant);if(!cart[key])return;cart[key].qty+=delta;if(cart[key].qty<=0)delete cart[key];renderStore();updateEnvioBar();}

function zoomProduct(photo,name,emoji,price){const d=document.createElement('div');d.className='zoom-modal';d.innerHTML=`${photo?`<img src="${photo}" alt="${name}">`:`<div style="font-size:110px;">${emoji}</div>`}<div style="color:white;font-weight:800;font-size:18px;margin-top:14px;text-align:center;">${name}</div><div style="font-family:'Bebas Neue',sans-serif;font-size:30px;color:var(--amarillo);margin-top:2px;">$ ${price}</div><button class="zoom-close" onclick="this.parentElement.remove()">✕ Cerrar</button>`;d.onclick=e=>{if(e.target===d)d.remove();};document.body.appendChild(d);}

async function sendOrder(){
  if(!tiendaAbierta()){showToast('⏰ Estamos cerrados. Vuelve en horario de atención');return;}
  const name=document.getElementById('custName')?.value.trim(),phone=document.getElementById('custPhone')?.value.trim(),address=document.getElementById('custAddress')?.value.trim();

  if(deliveryType==='domicilio'&&!clienteGeo){showToast('📍 Activa tu ubicación GPS para continuar');return;}
  const costoEnvio=selectedZona?(selectedZona.costo||0):0;let total=0,productosMsg='',productosArray=[];

  const totalFinal=total+costoEnvio;if(config.pedidoMinimo>0&&totalFinal<config.pedidoMinimo){showToast(`💰 Mínimo $${config.pedidoMinimo}. Faltan $${(config.pedidoMinimo-totalFinal).toFixed(2)}`);return;}
  localStorage.setItem('clientName',name);const phoneNorm=normalizarTelefono(phone);localStorage.setItem('clientPhone',phoneNorm);if(address)localStorage.setItem('clientAddress',address);

  const pedidoId=pedidoRef.id,pedidoCorto='#'+pedidoId.slice(-4).toUpperCase();localStorage.setItem('pedidoActivoId',pedidoId);localStorage.setItem('pedidoActivoFecha',new Date().toISOString());
  let msg=`🛒 *Pedido ${pedidoCorto} - Bodega Tony Tony*\n🕒 *Tiempo estimado: ${tiempo} min*\n📍 Te avisaremos cuando salga\n━━━━━━━━━━━━━━━━━━━━\n👤 *Cliente:* ${name}\n📞 *Teléfono:* ${phone}\n`;
  if(deliveryType==='domicilio'){msg+=`📍 *Entrega:* 🛵 Domicilio\n📌 *Dirección:* ${address}\n`;if(selectedZona)msg+=`🗺️ *Zona:* ${selectedZona.nombre}\n`;if(clienteGeo)msg+=`📡 *Ubicación:* https://maps.google.com/?q=${clienteGeo.lat},${clienteGeo.lng}\n`;}else{msg+=`📍 *Entrega:* 🏪 Pasa a recoger\n`;}
  msg+=`💳 *Pago:* ${metodosLbl[selectedMetodo]||selectedMetodo}\n━━━━━━━━━━━━━━━━━━━━\n🧺 *Productos:*\n${productosMsg}━━━━━━━━━━━━━━━━━━━━\n`;msg+=costoEnvio>0?`💰 *Subtotal: $${total.toFixed(2)}*\n🛵 *Envío: $${costoEnvio.toFixed(2)}*\n💰 *TOTAL: $${totalFinal.toFixed(2)}*\n`:`🛵 *Envío: Gratis*\n💰 *TOTAL: $${totalFinal.toFixed(2)}*\n`;
  if(deliveryType==='recoger')msg+='\n📎 _(Comprobante adjunto)_';

  const mapaTrackHtml=data.geo?`<a href="https://www.google.com/maps/dir/?api=1&destination=${data.geo.lat},${data.geo.lng}" target="_blank" style="display:flex;align-items:center;gap:6px;background:#e8f5e9;color:#1b5e20;padding:10px 14px;border-radius:10px;text-decoration:none;font-weight:700;font-size:13px;margin:8px 0;">🗺️ Abrir en Google Maps</a>`:'';
  const puedeCancelar=(estado==='pendiente'||estado==='confirmado');
  container.innerHTML=`<div style="text-align:center;padding:20px 0;"><div style="font-size:40px;">🛒</div><div style="font-family:'Bebas Neue',sans-serif;font-size:32px;">${corto}</div><div style="font-size:13px;color:var(--subtext);margin-bottom:12px;">Pedido de ${data.nombre||'—'}</div><span style="display:inline-block;font-size:13px;font-weight:800;padding:6px 14px;border-radius:50px;background:${estadoBg[estado]||'#fff3cd'};color:${estadoColor[estado]||'#856404'};">${estadoMap[estado]||estado}</span></div><div style="background:var(--oscuro);color:white;border-radius:16px;padding:16px;text-align:center;margin:14px 0;"><div style="font-size:12px;opacity:0.7;">Total del pedido</div><div style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--amarillo);">$ ${data.total?.toFixed(2)||'0.00'}</div></div><div style="font-weight:800;font-size:14px;margin-bottom:6px;">🧺 Productos</div><div style="font-size:13px;white-space:pre-line;color:var(--subtext);margin:10px 0;">${data.productos||''}</div><div style="font-size:12px;color:var(--subtext);margin-top:10px;line-height:1.8;">📍 ${data.entrega==='domicilio'?data.direccion||'—':'Recoger en tienda'}<br>💳 ${data.metodoPago||'—'}<br>⏱️ Tiempo estimado: ${data.tiempoEstimado||30} min<br>🕐 ${new Date(data.fecha).toLocaleString('es-VE',{dateStyle:'short',timeStyle:'short'})}</div>${mapaTrackHtml}${repHtml}${puedeCancelar?`<button onclick="cancelarPedido('${pid}')" style="width:100%;margin-top:10px;padding:12px;background:var(--rojo);color:white;border:none;border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;">❌ Cancelar pedido</button>`:''}<button onclick="showTab('tienda')" style="width:100%;margin-top:14px;padding:12px;background:var(--card);color:var(--text);border:2px solid var(--border);border-radius:12px;font-weight:800;font-size:14px;cursor:pointer;">Hacer otro pedido</button>`;
}

async function cancelarPedido(pid){if(!confirm('¿Cancelar este pedido?'))return;await db.collection('pedidos').doc(pid).update({estado:'cancelado'});showToast('❌ Pedido cancelado');localStorage.removeItem('pedidoActivoId');}

function renderSoporte(){
  const savedName=localStorage.getItem('clientName')||'',savedPhone=localStorage.getItem('clientPhone')||'';
  document.getElementById('soporteContainer').innerHTML=`<div class="soporte-form"><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--rojo);margin-bottom:4px;border-left:4px solid var(--rojo);padding-left:10px;">❗ Reportar problema</div><p style="font-size:13px;color:var(--subtext);margin-bottom:16px;">¿Tuviste un problema? Cuéntanos y lo resolvemos.</p><input type="text" id="sNombre" placeholder="Tu nombre *" value="${savedName}"><input type="tel" id="sTelefono" placeholder="Tu teléfono *" value="${savedPhone}"><textarea id="sDescripcion" placeholder="Describe el problema con detalle *"></textarea><button class="soporte-btn" onclick="enviarSoporte()">📤 Enviar reporte</button></div>`;
}

async function enviarSoporte(){
  const nombre=document.getElementById('sNombre')?.value.trim(),telefono=document.getElementById('sTelefono')?.value.trim(),descripcion=document.getElementById('sDescripcion')?.value.trim();
  if(!nombre||!telefono||!descripcion){showToast('⚠️ Completa todos los campos');return;}
  showToast('⏳ Enviando reporte...');await db.collection('soporte').add({clienteNombre:nombre,telefono,descripcion,estado:'nuevo',fecha:new Date().toISOString()});
  showToast('✅ Reporte enviado. Te contactaremos pronto.');showTab('tienda');
}

function actualizarFloatingCart(){const total=cartTotal();const items=Object.values(cart).reduce((a,b)=>a+b.qty,0);const bar=document.getElementById('floatingCart');if(!bar)return;if(items>0){bar.classList.add('visible');document.body.classList.add('has-float-bar');document.getElementById('floatTotal').textContent=`$ ${total.toFixed(2)} · ${items} item${items>1?'s':''}`;}else{bar.classList.remove('visible');document.body.classList.remove('has-float-bar');}updateCartCount();}

function normalizarTelefono(tel){tel=tel.replace(/\s+/g,'').replace(/[^0-9+]/g,'');if(tel.startsWith('+'))return tel;if(tel.startsWith('0'))tel=tel.slice(1);return'+58'+tel;}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

setTimeout(()=>{
  if(!localStorage.getItem('clientName')){
    const modal=document.createElement('div');modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML=`<div style="background:var(--card);border-radius:24px;padding:28px 20px;width:100%;max-width:320px;text-align:center;"><img src="logo.png" alt="Logo" style="width:100px;height:auto;margin-bottom:12px;" onerror="this.style.display='none'"><div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);margin-bottom:20px;">Bodega Tony Tony</div><input type="text" id="regNombre" placeholder="Tu nombre" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);"><div style="position:relative;margin-bottom:16px;"><select id="regCodigo" style="position:absolute;left:0;top:0;bottom:0;width:80px;border:2px solid var(--border);border-right:none;border-radius:12px 0 0 12px;font-weight:700;outline:none;background:var(--bg);color:var(--text);"><option value="+58">🇻🇪 +58</option><option value="+57">🇨🇴 +57</option></select><input type="tel" id="regTelefono" placeholder="Número sin código" style="width:100%;padding:12px 16px 12px 90px;border:2px solid var(--border);border-radius:12px;outline:none;background:var(--bg);color:var(--text);"></div><button onclick="window._guardarRegistro()" style="width:100%;background:var(--rojo);color:white;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;">Continuar →</button></div>`;document.body.appendChild(modal);
    window._guardarRegistro=function(){const n=document.getElementById('regNombre')?.value.trim();const c=document.getElementById('regCodigo')?.value||'+58';const t=document.getElementById('regTelefono')?.value.trim();if(!n||!t){showToast('⚠️ Completa tus datos');return;}localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',c+t.replace(/\D/g,''));modal.remove();showToast('¡Bienvenido '+n+'! 🎉');};
  }
},800);

setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},1200);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
