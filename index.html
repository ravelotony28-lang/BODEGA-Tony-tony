<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Bodega Tony Tony - Haz tu pedido aquí 🛒 Delivery en Cartagena">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bodega Tony Tony">
  <meta property="og:title" content="Bodega Tony Tony 🛒">
  <link rel="manifest" href="manifest.json">
  <title>Bodega Tony Tony 🛒</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <style>
    :root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--naranja:#ff6b2b;--oscuro:#1a1a2e;--bg:#f7f7f7;--card:#fff;--text:#1a1a2e;--subtext:#666;--border:#eee;--gris:#f1f1f1;}
    .dark{--bg:#0f0f1a;--card:#1a1a2e;--text:#f0f0f0;--subtext:#bbb;--border:#2a2a3e;--gris:#2a2a3e;}
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
    header{background:var(--oscuro);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--amarillo);}
    .logo span{color:var(--rojo);}
    .cart-btn{background:var(--rojo);color:#fff;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
    .cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
    .tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;scrollbar-width:none;}
    .tabs::-webkit-scrollbar{display:none;}
    .tab-btn{padding:11px 16px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
    .tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
    .search-wrap{padding:10px 16px;background:var(--card);border-bottom:1px solid var(--border);}
    .search-wrap input{width:100%;padding:10px 16px;border:2px solid var(--border);border-radius:50px;font-size:14px;outline:none;background:var(--bg);color:var(--text);}
    .view{display:none;padding:14px;}
    .view.active{display:block;}
    .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;}
    .product-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);display:flex;flex-direction:column;position:relative;cursor:pointer;}
    .product-card img{width:100%;height:130px;object-fit:cover;}
    .product-info{padding:8px 12px 12px;flex:1;display:flex;flex-direction:column;gap:5px;}
    .product-name{font-weight:700;font-size:13px;}
    .product-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--rojo);}
    .add-btn{background:var(--oscuro);color:#fff;border:none;border-radius:50px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:auto;}
    .badge{position:absolute;top:8px;left:8px;background:var(--rojo);color:#fff;border-radius:50px;padding:3px 9px;font-size:11px;font-weight:800;}
    .cat-filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none;}
    .cat-chip{flex-shrink:0;padding:7px 14px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--subtext);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
    .cat-chip.active{border-color:var(--rojo);background:var(--rojo);color:#fff;}
    .cart-item{background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);margin-bottom:10px;}
    .cart-total{background:var(--oscuro);color:#fff;border-radius:16px;padding:18px;margin:14px 0;text-align:center;}
    .cart-total .amount{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--amarillo);}
    .customer-info input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:10px;outline:none;background:var(--bg);color:var(--text);}
    .whatsapp-btn{background:#25d366;color:#fff;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:#fff;padding:12px 24px;border-radius:50px;font-weight:700;font-size:14px;z-index:999;transition:transform 0.3s;white-space:nowrap;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
    .toast.show{transform:translateX(-50%) translateY(0);}
    .agotado-badge{background:#555;color:#fff;border-radius:50px;padding:8px 14px;font-weight:800;font-size:12px;width:100%;margin-top:auto;text-align:center;}
    .qty-ctrl{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;margin-top:auto;}
    .qty-btn{background:var(--gris);border:none;border-radius:50%;width:30px;height:30px;font-size:18px;font-weight:900;cursor:pointer;}
    .qty-num{font-weight:800;font-size:16px;min-width:20px;text-align:center;}
    .empty{text-align:center;padding:40px 20px;color:var(--subtext);}
    .empty-icon{font-size:60px;margin-bottom:12px;}
    @media(max-width:400px){.products-grid{grid-template-columns:repeat(2,1fr);}}
  </style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;background:var(--oscuro);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s;">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:40px;letter-spacing:3px;color:var(--amarillo);">Bodega <span style="color:var(--rojo);">Tony</span> Tony</div>
  <div style="width:40px;height:40px;border:3px solid rgba(255,255,255,0.2);border-radius:50%;border-top-color:var(--rojo);animation:spin 0.8s linear infinite;margin-top:20px;"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<header>
  <div>
    <div class="logo">Bodega <span>Tony</span> Tony</div>
    <div style="font-size:11px;color:#aaa;">🛒 Haz tu pedido aquí</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button onclick="toggleDark()" style="background:none;border:none;font-size:20px;cursor:pointer;" id="darkBtn">🌙</button>
    <button class="cart-btn" onclick="showTab('carrito')">🛒 <span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('tienda')">🏪 Tienda</button>
  <button class="tab-btn" onclick="showTab('carrito')">🛒 Mi Pedido</button>
  <button class="tab-btn" onclick="showTab('historial')">📋 Mis Pedidos</button>
  <button class="tab-btn" onclick="showTab('soporte')">❗ Soporte</button>
</div>

<div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar producto..." oninput="onSearchInput()"></div>

<div class="view active" id="view-tienda"><div id="storeContainer"></div></div>
<div class="view" id="view-carrito"><div id="cartContainer"></div></div>
<div class="view" id="view-historial"><div id="historialContainer"></div></div>
<div class="view" id="view-soporte"><div id="soporteContainer"></div></div>

<div class="toast" id="toast"></div>

<script>
// FIREBASE
firebase.initializeApp({
  apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",
  authDomain:"bodegatonytony.firebaseapp.com",
  projectId:"bodegatonytony",
  storageBucket:"bodegatonytony.firebasestorage.app",
  messagingSenderId:"763208241886",
  appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"
});
const db = firebase.firestore();

// ESTADO
let products=[], cart={}, selectedCategory='Todos', comprobanteBase64='', darkMode=localStorage.getItem('darkMode')==='1';
let config={whatsapp:'+584242520138', metodosPago:{efectivo:true,pagoMovil:true,transferencia:false}, envioGratis:true, tiempoPreparacion:30, pedidoMinimo:0, horario:{apertura:0,cierre:24}, pagoMovil:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cedula:'6.966.714',telefono:'04241572275'}, transferencia:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cuenta:''}};
let zonas=[], selectedMetodo='pagoMovil', clienteGeo=null, searchTimeout=null;

function toggleDark(){darkMode=!darkMode;localStorage.setItem('darkMode',darkMode?'1':'0');document.body.classList.toggle('dark',darkMode);document.getElementById('darkBtn').textContent=darkMode?'☀️':'🌙';}
document.body.classList.toggle('dark',darkMode);
document.getElementById('darkBtn').textContent=darkMode?'☀️':'🌙';

// LISTENERS
db.collection('config').doc('tienda').onSnapshot(snap=>{if(snap.exists){const d=snap.data();config.whatsapp=d.whatsapp||config.whatsapp;config.metodosPago=d.metodosPago||config.metodosPago;config.envioGratis=d.envioGratis!==false;config.tiempoPreparacion=d.tiempoPreparacion||30;config.pedidoMinimo=d.pedidoMinimo||0;config.horario=d.horario||config.horario;config.pagoMovil=d.pagoMovil||config.pagoMovil;config.transferencia=d.transferencia||config.transferencia;}});
db.collection('zonas').onSnapshot(snap=>{zonas=snap.docs.map(d=>({id:d.id,...d.data()}));});
db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.visible!==false);renderStore();});

// CART
function cartKey(pid,v){return pid+'_'+(v||'');}
function getQty(pid,v){return(cart[cartKey(pid,v)]||{}).qty||0;}
function cartTotal(){return Object.values(cart).reduce((s,i)=>s+i.product.price*i.qty,0);}

function showTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if(tab==='tienda')renderStore();
  if(tab==='carrito')renderCart();
  if(tab==='historial')renderHistorial();
  if(tab==='soporte')renderSoporte();
}
function onSearchInput(){clearTimeout(searchTimeout);searchTimeout=setTimeout(renderStore,250);}

function renderStore(){
  const container=document.getElementById('storeContainer');
  if(!products.length){container.innerHTML='<div class="empty"><div class="empty-icon">🏪</div><p>¡Pronto hay productos!</p></div>';updateCartCount();return;}
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
  const allCats=['Todos',...new Set(products.map(p=>p.category||'General'))];
  let html='<div class="cat-filter">';
  allCats.forEach(c=>{html+=`<button class="cat-chip${selectedCategory===c?' active':''}" onclick="filterCat('${c}')">${c}</button>`;});
  html+='</div>';
  const filtered=products.filter(p=>{
    const matchCat=selectedCategory==='Todos'||(p.category||'General')===selectedCategory;
    const matchSearch=!q||p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q);
    return matchCat&&matchSearch;
  });
  if(!filtered.length){html+='<div class="empty"><div class="empty-icon">🔍</div><p>No encontramos productos</p></div>';}
  else{
    html+='<div class="products-grid">';
    filtered.forEach(p=>{
      const imgHtml=p.photo?`<img src="${p.photo}" alt="${p.name}">`:`<div style="font-size:46px;text-align:center;padding:14px 0;">${p.emoji||'📦'}</div>`;
      const priceHtml=p.oferta&&p.precioAnterior?`<div style="font-size:12px;color:var(--subtext);text-decoration:line-through;">$ ${p.precioAnterior}</div><div class="product-price" style="color:var(--verde);">$ ${p.price}</div>`:`<div class="product-price">$ ${p.price}</div>`;
      const actionHtml=p.agotado?`<div class="agotado-badge">❌ Agotado</div>`:
        (getQty(p.id,'')>0?`<div class="qty-ctrl"><button class="qty-btn" onclick="event.stopPropagation();changeQty('${p.id}','',-1)">−</button><span class="qty-num">${getQty(p.id,'')}</span><button class="qty-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+</button></div>`:
        `<button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+ Agregar</button>`);
      html+=`<div class="product-card">${p.oferta?'<span class="badge">🔥 Oferta</span>':''}${imgHtml}<div class="product-info"><div class="product-name">${p.name}</div>${priceHtml}${actionHtml}</div></div>`;
    });
    html+='</div>';
  }
  container.innerHTML=html;
  updateCartCount();
}

function filterCat(c){selectedCategory=c;renderStore();}
function addToCart(pid,variant){
  const p=products.find(x=>x.id===pid);
  if(!p||p.agotado){showToast('❌ Producto no disponible');return;}
  const key=cartKey(pid,variant);
  if(!cart[key])cart[key]={product:p,variant:variant||'',qty:0};
  cart[key].qty++;
  renderStore();showToast('✅ Agregado');updateCartCount();
}
function changeQty(pid,variant,delta){
  const key=cartKey(pid,variant);
  if(!cart[key])return;
  cart[key].qty+=delta;
  if(cart[key].qty<=0)delete cart[key];
  renderStore();updateCartCount();
}
function updateCartCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b.qty,0);}

function renderCart(){
  const container=document.getElementById('cartContainer');
  const keys=Object.keys(cart);
  if(!keys.length){container.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><p>Tu carrito está vacío</p></div>';return;}
  let total=0,itemsHtml='';
  keys.forEach(key=>{
    const item=cart[key],p=item.product,sub=p.price*item.qty;
    total+=sub;
    itemsHtml+=`<div class="cart-item"><div style="flex:1;"><div style="font-weight:700;">${p.name}</div><div style="color:var(--rojo);">$ ${p.price} × ${item.qty} = $ ${sub.toFixed(2)}</div></div><div class="qty-ctrl" style="width:auto;"><button class="qty-btn" onclick="changeQty('${p.id}','${item.variant}',-1);renderCart()">−</button><span class="qty-num">${item.qty}</span><button class="qty-btn" onclick="addToCart('${p.id}','${item.variant}');renderCart()">+</button></div></div>`;
  });
  const savedName=localStorage.getItem('clientName')||'',savedPhone=localStorage.getItem('clientPhone')||'',savedAddr=localStorage.getItem('clientAddress')||'';
  const metodosHtml=Object.entries(config.metodosPago).filter(([,v])=>v).map(([k])=>`<button onclick="selectedMetodo='${k}';renderCart()" style="padding:10px;border:2px solid ${selectedMetodo===k?'var(--rojo)':'var(--border)'};border-radius:12px;cursor:pointer;font-weight:700;background:var(--card);color:var(--text);">${k==='efectivo'?'💵 Efectivo':k==='pagoMovil'?'📱 Pago Móvil':'🏦 Transferencia'}</button>`).join('');
  container.innerHTML=`
    <div>${itemsHtml}</div>
    <div class="cart-total"><div>Total</div><div class="amount">$ ${total.toFixed(2)}</div></div>
    <div style="font-weight:700;margin-bottom:8px;">💳 Método de pago</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${metodosHtml}</div>
    ${selectedMetodo==='pagoMovil'?`<div style="background:#fff8e1;border:2px solid var(--amarillo);border-radius:14px;padding:14px;margin-top:12px;"><div style="font-weight:800;">📱 Pago Móvil</div><div>🏦 ${config.pagoMovil.banco}<br>👤 ${config.pagoMovil.nombre}<br>🪪 ${config.pagoMovil.cedula}<br>📱 ${config.pagoMovil.telefono}</div></div>`:''}
    ${selectedMetodo==='transferencia'?`<div style="background:#fff8e1;border:2px solid var(--amarillo);border-radius:14px;padding:14px;margin-top:12px;"><div style="font-weight:800;">🏦 Transferencia</div><div>🏦 ${config.transferencia.banco}<br>👤 ${config.transferencia.nombre}<br>📱 ${config.transferencia.cuenta}</div></div>`:''}
    <div class="customer-info" style="margin-top:12px;">
      <div style="font-weight:700;margin-bottom:8px;">📝 Tus datos</div>
      <input type="text" id="custName" placeholder="Tu nombre *" value="${savedName}">
      <input type="tel" id="custPhone" placeholder="Tu teléfono *" value="${savedPhone}">
      <input type="text" id="custAddress" placeholder="Tu dirección *" value="${savedAddr}">
    </div>
    <label for="comprobanteInput" style="cursor:pointer;display:block;margin-top:10px;"><div id="comprobantePreview" style="width:100%;height:110px;border:2px dashed var(--amarillo);border-radius:14px;background:#fff8e1;display:flex;align-items:center;justify-content:center;font-weight:700;color:#999;">📎 Toca para subir comprobante</div><input type="file" id="comprobanteInput" accept="image/*" style="display:none;" onchange="previewComprobante(this)"></label>
    <button class="whatsapp-btn" onclick="sendOrder()">📤 Enviar pedido por WhatsApp</button>`;
}

function previewComprobante(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{comprobanteBase64=e.target.result;document.getElementById('comprobantePreview').innerHTML=`<img src="${comprobanteBase64}" style="width:100%;height:100%;object-fit:cover;">`;};
  reader.readAsDataURL(file);
}

async function sendOrder(){
  const name=document.getElementById('custName')?.value.trim();
  const phone=document.getElementById('custPhone')?.value.trim();
  const address=document.getElementById('custAddress')?.value.trim();
  if(!name||!phone||!address){showToast('⚠️ Completa todos los campos');return;}
  let total=0,productosMsg='',productosArray=[];
  Object.values(cart).forEach(item=>{
    const sub=item.product.price*item.qty;
    total+=sub;
    productosMsg+=`${item.product.emoji||'📦'} ${item.product.name} × ${item.qty} — $${sub.toFixed(2)}\n`;
    productosArray.push({emoji:item.product.emoji||'📦',name:item.product.name,qty:item.qty,price:item.product.price});
  });
  if(config.pedidoMinimo>0&&total<config.pedidoMinimo){showToast(`💰 Mínimo $${config.pedidoMinimo}`);return;}
  localStorage.setItem('clientName',name);localStorage.setItem('clientPhone',phone);localStorage.setItem('clientAddress',address);
  showToast('⏳ Enviando...');
  try{
    await db.collection('pedidos').add({nombre:name,telefono:phone,direccion:address,metodoPago:selectedMetodo,productos:productosMsg,productosArray,total,fecha:new Date().toISOString(),estado:'pendiente',comprobante:comprobanteBase64,tiempoEstimado:config.tiempoPreparacion||30});
    let msg=`🛒 *Pedido - Bodega Tony Tony*\n👤 *${name}*\n📞 *${phone}*\n📌 *${address}*\n💳 *${selectedMetodo}*\n\n🧺 *Productos:*\n${productosMsg}\n💰 *TOTAL: $${total.toFixed(2)}*`;
    window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
    cart={};comprobanteBase64='';updateCartCount();
    showToast('✅ Pedido enviado');showTab('tienda');
  }catch(e){showToast('❌ Error al enviar');}
}

function renderHistorial(){
  const container=document.getElementById('historialContainer');
  const phone=localStorage.getItem('clientPhone')||'';
  if(!phone){container.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>Haz tu primer pedido</p></div>';return;}
  container.innerHTML='<p style="text-align:center;padding:20px;color:var(--subtext);">⏳ Cargando...</p>';
  db.collection('pedidos').where('telefono','==',phone).orderBy('fecha','desc').limit(20).get().then(snap=>{
    if(snap.empty){container.innerHTML='<div class="empty"><div class="empty-icon">📋</div><p>No tienes pedidos</p></div>';return;}
    container.innerHTML=snap.docs.map(d=>{const p=d.data();return`<div style="background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:0 4px 20px rgba(0,0,0,0.12);"><div style="font-weight:800;font-size:13px;">${new Date(p.fecha).toLocaleString('es-VE')}</div><div style="font-size:13px;white-space:pre-line;color:var(--subtext);margin:6px 0;">${p.productos}</div><div style="font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--rojo);">$ ${p.total?.toFixed(2)||'0.00'}</div><span style="font-size:11px;font-weight:800;padding:4px 10px;border-radius:50px;background:#fff3cd;color:#856404;">${p.estado||'pendiente'}</span></div>`;}).join('');
  });
}

function renderSoporte(){
  const container=document.getElementById('soporteContainer');
  container.innerHTML=`
    <div style="background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,0.12);">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--rojo);margin-bottom:16px;">❗ Reportar problema</div>
      <input type="text" id="sNombre" placeholder="Tu nombre *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);">
      <input type="tel" id="sTelefono" placeholder="Tu teléfono *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);">
      <textarea id="sDescripcion" placeholder="Describe el problema *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);min-height:90px;"></textarea>
      <button onclick="enviarSoporte()" style="width:100%;background:var(--rojo);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;font-size:15px;cursor:pointer;">📤 Enviar reporte</button>
    </div>`;
}

async function enviarSoporte(){
  const nombre=document.getElementById('sNombre')?.value.trim();
  const telefono=document.getElementById('sTelefono')?.value.trim();
  const descripcion=document.getElementById('sDescripcion')?.value.trim();
  if(!nombre||!telefono||!descripcion){showToast('⚠️ Completa todos los campos');return;}
  await db.collection('soporte').add({clienteNombre:nombre,telefono,descripcion,estado:'nuevo',fecha:new Date().toISOString()});
  showToast('✅ Reporte enviado');showTab('tienda');
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

setTimeout(()=>{document.getElementById('splash').style.opacity='0';setTimeout(()=>document.getElementById('splash').style.display='none',400);},1000);

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
