<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bodega Tony Tony">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<title>Bodega Tony Tony</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f7f7f7;--card:#fff;--text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--oscuro);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--amarillo);}
.logo-text span{color:var(--rojo);}
.cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.cart-btn:active{transform:scale(0.96);}
.cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{padding:11px 14px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.search-wrap{padding:8px 14px;background:var(--card);position:sticky;top:46px;z-index:100;}
.search-wrap input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:50px;font-size:14px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
.search-wrap input:focus{border-color:var(--rojo);}
.view{display:none;padding:12px;}
.view.active{display:block;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.product-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);}
.product-card:active{transform:translateY(2px);}
.product-img{width:100%;height:120px;object-fit:cover;background:var(--gris);}
.product-emoji{font-size:40px;text-align:center;padding:20px 0 10px;}
.product-info{padding:8px 12px 12px;}
.product-name{font-weight:700;font-size:13px;margin-bottom:4px;}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--rojo);}
.add-btn{background:var(--oscuro);color:white;border:none;border-radius:50px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:8px;}
.cart-total{background:var(--oscuro);color:white;border-radius:16px;padding:18px;margin:14px 0;text-align:center;}
.cart-total .amount{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--amarillo);}
.ci input,.ci select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:8px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;-webkit-appearance:none;}
.ci input:focus{border-color:var(--rojo);}
.wa-btn{display:block;width:100%;background:#25d366;color:white;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;margin-top:8px;font-family:'Nunito',sans-serif;}
.wa-btn:active{background:#20ba58;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;z-index:9999;max-width:90vw;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:40px 20px;color:var(--subtext);}
.floating-cart{position:fixed;bottom:0;left:0;right:0;z-index:300;padding:10px 16px;background:var(--oscuro);display:flex;align-items:center;justify-content:space-between;gap:10px;transform:translateY(100%);box-shadow:0 -2px 12px rgba(0,0,0,0.2);}
.floating-cart.visible{transform:translateY(0);}
.floating-cart-total{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--amarillo);}
.floating-cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:10px 18px;font-weight:800;font-size:13px;cursor:pointer;}
body.has-float .view{padding-bottom:70px;}
.hero-banner{background:linear-gradient(135deg,var(--oscuro) 0%,#2d1b69 100%);border-radius:18px;padding:20px 18px;margin:0 0 14px;color:white;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:30px;margin-bottom:12px;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;padding:14px 14px 6px;}
.cats-scroll{display:flex;gap:10px;overflow-x:auto;padding:8px 14px 14px;scrollbar-width:none;}
.cats-scroll::-webkit-scrollbar{display:none;}
.cat-card{flex-shrink:0;width:80px;text-align:center;cursor:pointer;}
.cat-circle{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;box-shadow:0 4px 14px rgba(0,0,0,.18);background:var(--card);}
.cat-card-label{font-size:11px;font-weight:700;color:var(--text);}
.puntos-card{background:linear-gradient(135deg,#1a1a2e,#2d2d4e);border-radius:16px;padding:16px;margin:10px 0;color:white;}
.puntos-num{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--amarillo);}
.entrega-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px;}
.entrega-opt{padding:14px 8px;border:2px solid var(--border);border-radius:14px;background:var(--card);text-align:center;cursor:pointer;font-weight:800;}
.entrega-opt.active{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
.metodos-wrap{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
.metodo-chip{padding:9px 16px;border:2px solid var(--border);border-radius:50px;background:var(--card);font-weight:700;font-size:13px;cursor:pointer;}
.metodo-chip.active{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
@keyframes spin{to{transform:rotate(360deg)}}
@media (min-width:768px){.products-grid{grid-template-columns:repeat(3,1fr);}}
</style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;background:var(--oscuro);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;">
  <img src="logo.png" alt="Logo" style="width:120px;height:auto;margin-bottom:16px;" onerror="this.style.display='none'">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:var(--amarillo);">Bodega <span style="color:var(--rojo);">Tony</span> Tony</div>
  <div style="width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-radius:50%;border-top-color:var(--rojo);animation:spin .8s linear infinite;margin-top:16px;"></div>
</div>

<header>
  <div style="display:flex;align-items:center;gap:8px;">
    <img src="logo.png" alt="Logo" style="width:34px;height:34px;border-radius:6px;" onerror="this.style.display='none'">
    <div>
      <div class="logo-text">Bodega <span>Tony</span> Tony</div>
      <div style="font-size:10px;color:#aaa;">Online 24/7</div>
    </div>
  </div>
  <button class="cart-btn" onclick="showTab('carrito')">🛒 <span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('inicio')">🏪 Inicio</button>
  <button class="tab-btn" onclick="showTab('carrito')">🛒 Carrito</button>
  <button class="tab-btn" onclick="showTab('tracking')">📦 Tracking</button>
  <button class="tab-btn" onclick="showTab('puntos')">⭐ Puntos</button>
</div>

<div id="inicio" class="view active">
  <div class="search-wrap"><input type="search" id="searchInput" placeholder="🔍 Busca..."></div>
  <div style="padding:0 14px 14px;">
    <div class="hero-banner">
      <div style="font-size:13px;color:rgba(255,255,255,.7);">Bienvenido a</div>
      <div class="hero-title">Bodega <span style="color:var(--amarillo);">Tony</span> Tony</div>
    </div>
  </div>
  <div class="section-title">📂 Categorías</div>
  <div class="cats-scroll" id="catsScroll"></div>
  <div class="section-title">🛍️ Productos</div>
  <div style="padding:0 14px 14px;"><div class="products-grid" id="productsGrid"></div></div>
</div>

<div id="carrito" class="view">
  <div style="padding:14px;">
    <h2>🛒 Tu Carrito</h2>
    <div id="cartItems"></div>
    <div id="cartEmpty" class="empty"><p>Vacío 🛒</p></div>
    <div id="cartFull" style="display:none;margin-top:14px;">
      <div class="cart-total">
        <div style="font-size:12px;color:#aaa;">TOTAL</div>
        <div class="amount" id="cartTotalAmount">$0</div>
      </div>
      <div style="margin-top:14px;">
        <div style="font-weight:700;margin-bottom:8px;">👤 Datos</div>
        <div class="ci">
          <input type="text" id="cName" placeholder="Nombre">
          <div style="display:flex;gap:8px;">
            <select id="cCodigo"><option value="+58">🇻🇪 +58</option><option value="+57">🇨🇴 +57</option><option value="+1">🇺🇸 +1</option></select>
            <input type="tel" id="cPhone" placeholder="Teléfono" inputmode="numeric" style="flex:1;">
          </div>
          <input type="text" id="cAddr" placeholder="Dirección">
        </div>
      </div>
      <div style="margin-top:14px;">
        <div style="font-weight:700;margin-bottom:8px;">📦 Entrega</div>
        <div class="entrega-grid">
          <button class="entrega-opt active" onclick="setEntrega('domicilio')">🛵 Domicilio</button>
          <button class="entrega-opt" onclick="setEntrega('retiro')">🏪 Retiro</button>
        </div>
      </div>
      <div>
        <div style="font-weight:700;margin-bottom:8px;">💳 Pago</div>
        <div class="metodos-wrap">
          <button class="metodo-chip active" onclick="setMetodo('efectivo')">Efectivo</button>
          <button class="metodo-chip" onclick="setMetodo('transferencia')">Transferencia</button>
          <button class="metodo-chip" onclick="setMetodo('cripto')">Cripto</button>
        </div>
      </div>
      <button class="wa-btn" onclick="doOrder(this)">📲 Confirmar</button>
    </div>
  </div>
</div>

<div id="tracking" class="view">
  <div style="padding:14px;">
    <h2>📦 Seguimiento</h2>
    <div id="trackingContainer" class="empty">Cargando...</div>
  </div>
</div>

<div id="puntos" class="view">
  <div style="padding:14px;">
    <h2>⭐ Mis Puntos</h2>
    <div class="puntos-card">
      <div style="font-size:13px;color:rgba(255,255,255,.8);">PUNTOS</div>
      <div class="puntos-num" id="puntosTot">0</div>
    </div>
    <div id="puntosHist" style="background:var(--card);border-radius:14px;padding:14px;margin-top:10px;"></div>
  </div>
</div>

<div class="floating-cart" id="floatingCart">
  <div class="floating-cart-total" id="floatTotal">$0</div>
  <button class="floating-cart-btn" onclick="showTab('carrito')">Ver →</button>
</div>

<div id="toast" class="toast"></div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  FIREBASE CONFIG - REEMPLAZA CON TU CONFIGURACIÓN REAL      ║
// ╚══════════════════════════════════════════════════════════════╝

const firebaseConfig = {
  apiKey: "AIzaSyDwJdFsG",
  authDomain: "bodegaton.firebaseapp.com",
  projectId: "bodegaton",
  storageBucket: "bodegaton.appspot.com",
  messagingSenderId: "123456789",
  appId: "1:123456789:web:abcd1234"
};

const app = firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/service-worker.js').catch(e => console.error('SW:', e));
}

// Variables
let cart = {}, geo = null, comp64 = '', entrega = 'domicilio', metodo = 'efectivo', unsubTracking = null, tT = null;

const cfg = { whatsapp: '+573233630356' };

// Toast
function showToast(msg, d = 2800) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if (tT) clearTimeout(tT);
  tT = setTimeout(() => t.classList.remove('show'), d);
}

// Notificaciones
function notificarCambioEstado(estado, pid) {
  const msg = { confirmado: '✅ Confirmado', preparacion: '👨‍🍳 Preparando', camino: '🚚 En camino', entregado: '🏠 Entregado', cancelado: '❌ Cancelado' }[estado];
  if (msg) showToast(msg, 5000);
}

// Checkout
function doOrder(link) {
  const cod = document.getElementById('cCodigo').value;
  const n = (document.getElementById('cName') || {}).value?.trim() || '';
  const ph = (document.getElementById('cPhone') || {}).value?.trim() || '';
  const ad = (document.getElementById('cAddr') || {}).value?.trim() || '';

  if (!n || !ph) { showToast('⚠️ Nombre y teléfono'); return false; }
  if (entrega === 'domicilio' && !ad) { showToast('⚠️ Dirección'); return false; }

  localStorage.setItem('clientName', n);
  localStorage.setItem('clientPhone', ph);

  let tot = 0, msg = '', parr = [];
  Object.values(cart).forEach(i => {
    const s = i.p.price * i.qty;
    tot += s;
    msg += (i.p.emoji || '') + ' ' + i.p.name + ' x' + i.qty + '\n';
    parr.push({ name: i.p.name, qty: i.qty, price: i.p.price });
  });

  const pid = Math.random().toString(36).substr(2, 9).toUpperCase();
  const etxt = entrega === 'domicilio' ? '🛵 Domicilio' : '🏪 Retiro';
  const waText = '🛒 *Pedido #' + pid + '*\n👤 ' + n + '\n📞 ' + cod + ph + '\n' + (ad ? '📌 ' + ad + '\n' : '') + '📦 ' + etxt + '\n💳 ' + metodo + '\n\n' + msg + '💰 $' + tot.toFixed(2);

  const data = {
    pedidoId: pid, nombre: n, telefono: cod + ph, direccion: ad || '',
    productos: msg, productosArray: parr, total: tot,
    tipoEntrega: entrega, metodoPago: metodo, fecha: new Date().toISOString(), estado: 'pendiente'
  };

  db.collection('pedidos').doc(pid).set(data).catch(e => console.error(e));

  const ptsG = Math.floor(tot);
  db.collection('clientes').doc(cod + ph).get().then(snap => {
    const actual = snap.exists ? (snap.data().puntos || 0) : 0;
    const hist = snap.exists ? (snap.data().historial || []) : [];
    hist.unshift({ fecha: new Date().toISOString(), puntos: ptsG, pedido: pid });
    db.collection('clientes').doc(cod + ph).set({
      nombre: n, telefono: cod + ph, puntos: actual + ptsG,
      totalGastado: (snap.exists ? (snap.data().totalGastado || 0) : 0) + tot,
      historial: hist.slice(0, 20)
    }, { merge: true }).catch(() => {});
  }).catch(() => {});

  localStorage.setItem('pedidoActivoId', pid);
  cart = {};
  updateFloat();
  showToast('✅ Pedido #' + pid + ' recibido!', 4000);
  showTab('tracking');

  link.href = 'https://wa.me/' + cfg.whatsapp.replace(/[^0-9+]/g, '') + '?text=' + encodeURIComponent(waText);
  return true;
}

// Tracking
function renderTracking() {
  const pid = localStorage.getItem('pedidoActivoId');
  const c = document.getElementById('trackingContainer');
  if (!pid) { c.innerHTML = '<div class="empty"><p>Sin pedidos</p></div>'; return; }
  c.innerHTML = '<div class="empty"><div style="animation:spin .8s;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--rojo);border-radius:50%;margin:0 auto;"></div></div>';
  if (unsubTracking) unsubTracking();
  unsubTracking = db.collection('pedidos').doc(pid).onSnapshot(doc => {
    if (!doc.exists) { c.innerHTML = '<div class="empty"><p>No encontrado</p></div>'; return; }
    const p = { id: doc.id, ...doc.data() };
    const estados = { pendiente: '⏳', confirmado: '✅', preparacion: '👨‍🍳', camino: '🚚', entregado: '🏠', cancelado: '❌' };
    c.innerHTML = '<div style="text-align:center;padding:20px;"><div style="font-size:50px;">📦</div><div style="font-family:Bebas Neue;font-size:24px;">#' + p.id + '</div><div style="margin:10px 0;">' + (estados[p.estado] || '⏳') + ' ' + (p.estado || 'Pendiente') + '</div><div style="font-family:Bebas Neue;font-size:28px;color:var(--rojo);margin-top:10px;">$' + (p.total || 0).toFixed(2) + '</div></div>';
    const e = window._ultimoEstadoPedido;
    if (e && e !== p.estado) notificarCambioEstado(p.estado, p.id);
    window._ultimoEstadoPedido = p.estado;
  }, err => { c.innerHTML = '<div class="empty"><p>Error</p></div>'; });
}

// Helpers
function showTab(t) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(t)?.classList.add('active');
  document.querySelector(`[onclick="showTab('${t}')"]`)?.classList.add('active');
  if (t === 'tracking') renderTracking();
}

function setEntrega(v) { entrega = v; document.querySelectorAll('.entrega-opt').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); }
function setMetodo(v) { metodo = v; document.querySelectorAll('.metodo-chip').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); }

function updateFloat() {
  let tot = 0;
  Object.values(cart).forEach(i => tot += i.p.price * i.qty);
  document.getElementById('floatTotal').textContent = '$' + tot.toFixed(2);
  const f = document.getElementById('floatingCart');
  if (tot > 0) { f.classList.add('visible'); document.body.classList.add('has-float'); } else { f.classList.remove('visible'); document.body.classList.remove('has-float'); }
}

// Init
if ('Notification' in window && Notification.permission === 'default') {
  document.addEventListener('click', () => { if (Notification.permission === 'default') Notification.requestPermission(); }, { once: true });
}

window.addEventListener('load', () => {
  const s = document.getElementById('splash');
  if (s) { s.style.opacity = '0'; s.style.pointerEvents = 'none'; }
});
</script>

</body>
</html>
