<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f7f7f7;--card:#fff;--text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--oscuro);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--amarillo);}
.logo-text span{color:var(--rojo);}
.cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
.tienda-status{text-align:center;padding:8px;font-size:13px;font-weight:700;background:linear-gradient(90deg,#2dc653,#1a9e3f);color:white;}
.envio-bar{background:linear-gradient(90deg,#2dc653,#1a9e3f);color:white;text-align:center;padding:6px;font-size:12px;font-weight:700;}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;}
.tab-btn{padding:11px 14px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.search-wrap{padding:8px 14px;background:var(--card);}
.search-wrap input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:50px;font-size:14px;outline:none;background:var(--bg);color:var(--text);}
.view{display:none;padding:12px;}
.view.active{display:block;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.product-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);position:relative;}
.product-img{width:100%;height:120px;object-fit:cover;}
.product-emoji{font-size:40px;text-align:center;padding:20px 0 10px;}
.product-info{padding:8px 12px 12px;}
.product-name{font-weight:700;font-size:13px;margin-bottom:4px;}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--rojo);}
.add-btn{background:var(--oscuro);color:white;border:none;border-radius:50px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:8px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;}
.qty-btn{background:var(--gris);border:none;border-radius:50%;width:28px;height:28px;font-size:18px;font-weight:900;cursor:pointer;}
.qty-num{font-weight:800;font-size:16px;}
.cat-filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;}
.cat-chip{padding:6px 12px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--subtext);font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap;}
.cat-chip.active{border-color:var(--rojo);background:var(--rojo);color:white;}
.cart-item{background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.cart-total{background:var(--oscuro);color:white;border-radius:16px;padding:18px;margin:14px 0;text-align:center;}
.cart-total .amount{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--amarillo);}
.customer-info input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:8px;outline:none;background:var(--bg);color:var(--text);}
.whatsapp-btn{background:#25d366;color:white;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:8px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;z-index:999;transition:transform 0.3s;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:40px 20px;color:var(--subtext);}
.empty-icon{font-size:60px;margin-bottom:12px;}
.floating-cart{position:fixed;bottom:0;left:0;right:0;z-index:300;padding:10px 16px;background:var(--oscuro);display:flex;align-items:center;justify-content:space-between;gap:10px;transform:translateY(100%);transition:transform 0.3s;}
.floating-cart.visible{transform:translateY(0);}
.floating-cart-total{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--amarillo);}
.floating-cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:10px 18px;font-weight:800;font-size:13px;cursor:pointer;}
body.has-float .view{padding-bottom:70px;}
.chat-fab{position:fixed;bottom:120px;right:18px;z-index:400;background:var(--verde);color:white;width:54px;height:54px;border-radius:50%;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,0.3);display:flex;align-items:center;justify-content:center;}
.chat-window{position:fixed;bottom:0;right:0;width:100%;max-width:380px;height:65vh;background:var(--card);z-index:500;border-radius:20px 20px 0 0;box-shadow:0 -4px 30px rgba(0,0,0,0.3);display:flex;flex-direction:column;transform:translateY(100%);transition:transform 0.3s;}
.chat-window.open{transform:translateY(0);}
.chat-header{background:var(--verde);color:white;padding:14px 16px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.4;}
.chat-msg.cliente{background:var(--verde);color:white;align-self:flex-end;border-bottom-right-radius:4px;}
.chat-msg.bot{background:#e3f2fd;color:#0d47a1;align-self:flex-start;border-bottom-left-radius:4px;}
.chat-msg.tienda{background:var(--gris);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px;}
.chat-input-wrap{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
.chat-input-wrap input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:20px;outline:none;background:var(--bg);color:var(--text);font-size:14px;}
.chat-input-wrap button{background:var(--verde);color:white;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;}
</style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;background:var(--oscuro);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s;">
  <img src="logo.png" alt="Logo" style="width:120px;height:auto;margin-bottom:16px;" onerror="this.style.display='none'">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:var(--amarillo);">Bodega <span style="color:var(--rojo);">Tony</span> Tony</div>
  <div style="width:30px;height:30px;border:3px solid rgba(255,255,255,0.2);border-radius:50%;border-top-color:var(--rojo);animation:spin 0.8s linear infinite;margin-top:16px;"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<header>
  <div style="display:flex;align-items:center;gap:8px;">
    <img src="logo.png" alt="Logo" style="width:34px;height:34px;border-radius:6px;" onerror="this.style.display='none'">
    <div>
      <div class="logo-text">Bodega <span>Tony</span> Tony</div>
      <div style="font-size:9px;color:#aaa;">🛒 Haz tu pedido aquí</div>
    </div>
  </div>
  <button class="cart-btn" onclick="showTab('carrito')">🛒 <span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="tienda-status">✅ Abierto · 09:00 AM - 10:00 PM</div>
<div class="envio-bar">🛵 Domicilio gratis</div>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('tienda')">🏪 Tienda</button>
  <button class="tab-btn" onclick="showTab('carrito')">🛒 Mi Pedido</button>
  <button class="tab-btn" onclick="showTab('tracking')">📦 Pedido</button>
  <button class="tab-btn" onclick="showTab('soporte')">❗ Soporte</button>
</div>

<div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar producto..." oninput="renderStore()"></div>

<div class="view active" id="view-tienda"><div id="storeContainer"></div></div>
<div class="view" id="view-carrito"><div id="cartContainer"></div></div>
<div class="view" id="view-tracking"><div id="trackingContainer"></div></div>
<div class="view" id="view-soporte"><div id="soporteContainer"></div></div>

<div class="floating-cart" id="floatingCart">
  <div><div style="font-size:10px;color:#aaa;">Tu pedido</div><div class="floating-cart-total" id="floatTotal">$ 0.00</div></div>
  <button class="floating-cart-btn" onclick="showTab('carrito')">Ver pedido 🛒</button>
</div>

<button class="chat-fab" onclick="toggleChat()">💬</button>
<div class="chat-window" id="chatWindow">
  <div class="chat-header">
    <span style="font-weight:800;">💬 Bodega Tony Tony</span>
    <button onclick="toggleChat()" style="background:none;border:none;color:white;font-size:24px;cursor:pointer;">✕</button>
  </div>
  <div class="chat-messages" id="chatMessages"><div style="text-align:center;color:var(--subtext);padding:20px;">¡Hola! ¿En qué te ayudamos? 😊</div></div>
  <div class="chat-input-wrap">
    <input type="text" id="chatInput" placeholder="Escribe aquí..." onkeyup="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",authDomain:"bodegatonytony.firebaseapp.com",projectId:"bodegatonytony",storageBucket:"bodegatonytony.firebasestorage.app",messagingSenderId:"763208241886",appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"});
const db=firebase.firestore();

let products=[],cart={},selectedCategory='Todos',selectedMetodo='pagoMovil';
let config={whatsapp:'+584242520138',metodosPago:{efectivo:true,pagoMovil:true,transferencia:false},tiempoPreparacion:30,pagoMovil:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cedula:'6.966.714',telefono:'04241572275'}};
let chatUnsub=null;

db.collection('config').doc('tienda').onSnapshot(snap=>{if(snap.exists){const d=snap.data();config.whatsapp=d.whatsapp||config.whatsapp;}});
db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.visible!==false);renderStore();});

function cartKey(pid,v){return pid+'_'+(v||'');}
function getQty(pid,v){return(cart[cartKey(pid,v)]||{}).qty||0;}
function cartTotal(){return Object.values(cart).reduce((s,i)=>s+i.product.price*i.qty,0);}
function updateCartCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b.qty,0);}
function actualizarFloatingCart(){const t=cartTotal();const i=Object.values(cart).reduce((a,b)=>a+b.qty,0);const b=document.getElementById('floatingCart');if(!b)return;if(i>0){b.classList.add('visible');document.body.classList.add('has-float');document.getElementById('floatTotal').textContent=`$ ${t.toFixed(2)} · ${i} item${i>1?'s':''}`;}else{b.classList.remove('visible');document.body.classList.remove('has-float');}updateCartCount();}

function showTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab)?.classList.add('active');
  if(tab==='tienda')renderStore();
  if(tab==='carrito')renderCart();
  if(tab==='tracking')renderTracking();
  if(tab==='soporte')renderSoporte();
}

function renderStore(){
  const c=document.getElementById('storeContainer');
  if(!products.length){c.innerHTML='<div class="empty"><div class="empty-icon">🏪</div><p>No hay productos aún. Ve al admin y carga el inventario inicial.</p></div>';return;}
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
  const ofertas=products.filter(p=>p.oferta&&!p.agotado&&!q);
  const allCats=['Todos',...new Set(products.map(p=>p.category||'General'))];
  let h='';
  if(ofertas.length&&!q){h+=`<div style="background:linear-gradient(135deg,#e63946,#ff6b2b);border-radius:14px;padding:14px;margin-bottom:12px;color:white;display:flex;align-items:center;justify-content:space-between;"><div><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;">🔥 Ofertas del día</div></div></div><div style="display:flex;gap:10px;overflow-x:auto;margin-bottom:12px;">`;ofertas.forEach(p=>h+=buildCard(p,true));h+='</div>';}
  h+='<div class="cat-filter">';allCats.forEach(cat=>{h+=`<button class="cat-chip${selectedCategory===cat?' active':''}" onclick="filterCat('${cat}')">${cat}</button>`;});h+='</div>';
  const filtered=products.filter(p=>{const mc=selectedCategory==='Todos'||(p.category||'General')===selectedCategory;const ms=!q||p.name.toLowerCase().includes(q);return mc&&ms;});
  if(!filtered.length){h+='<div class="empty"><div class="empty-icon">🔍</div><p>No encontramos productos</p></div>';}
  else{h+='<div class="products-grid">';filtered.forEach(p=>h+=buildCard(p,false));h+='</div>';}
  c.innerHTML=h;updateCartCount();
}

function buildCard(p,isScroll){
  const img=p.photo?`<img src="${p.photo}" class="product-img">`:`<div class="product-emoji">${p.emoji||'📦'}</div>`;
  const price=`<div class="product-price">$ ${p.price}</div>`;
  const action=p.agotado?`<div style="background:#555;color:white;border-radius:50px;padding:8px;text-align:center;font-size:12px;margin-top:8px;">❌ Agotado</div>`:(getQty(p.id,'')>0?`<div class="qty-ctrl"><button class="qty-btn" onclick="event.stopPropagation();changeQty('${p.id}','',-1)">−</button><span class="qty-num">${getQty(p.id,'')}</span><button class="qty-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+</button></div>`:`<button class="add-btn" onclick="event.stopPropagation();addToCart('${p.id}','')">+ Agregar</button>`);
  return`<div class="product-card" style="${isScroll?'min-width:150px;flex-shrink:0;':''}">${p.oferta?'<span style="position:absolute;top:8px;left:8px;background:var(--rojo);color:white;border-radius:50px;padding:3px 8px;font-size:10px;font-weight:800;">🔥</span>':''}${img}<div class="product-info"><div class="product-name">${p.name}</div>${price}${action}</div></div>`;
}

function filterCat(c){selectedCategory=c;renderStore();}
function addToCart(pid,v){const p=products.find(x=>x.id===pid);if(!p||p.agotado){showToast('❌ No disponible');return;}const key=cartKey(pid,v);if(!cart[key])cart[key]={product:p,variant:v||'',qty:0};cart[key].qty++;renderStore();showToast('✅ Agregado');actualizarFloatingCart();}
function changeQty(pid,v,d){const key=cartKey(pid,v);if(!cart[key])return;cart[key].qty+=d;if(cart[key].qty<=0)delete cart[key];renderStore();actualizarFloatingCart();}

function renderCart(){
  const c=document.getElementById('cartContainer');const keys=Object.keys(cart);
  if(!keys.length){c.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><p>Tu carrito está vacío</p></div>';return;}
  let t=0,items='';keys.forEach(k=>{const i=cart[k],p=i.product,s=p.price*i.qty;t+=s;items+=`<div class="cart-item"><div style="flex:1;"><div style="font-weight:700;">${p.name}</div><div style="color:var(--rojo);">$ ${p.price} × ${i.qty} = $ ${s.toFixed(2)}</div></div><div class="qty-ctrl" style="width:auto;"><button class="qty-btn" onclick="changeQty('${p.id}','${i.variant}',-1);renderCart()">−</button><span class="qty-num">${i.qty}</span><button class="qty-btn" onclick="addToCart('${p.id}','${i.variant}');renderCart()">+</button></div></div>`;});
  const n=localStorage.getItem('clientName')||'',ph=localStorage.getItem('clientPhone')||'',ad=localStorage.getItem('clientAddress')||'';
  c.innerHTML=`<div>${items}</div><div class="cart-total"><div>Total</div><div class="amount">$ ${t.toFixed(2)}</div></div><div class="customer-info"><div style="font-weight:700;margin-bottom:6px;">📝 Tus datos</div><input type="text" id="custName" placeholder="Tu nombre *" value="${n}"><input type="tel" id="custPhone" placeholder="Tu teléfono *" value="${ph}"><input type="text" id="custAddress" placeholder="Tu dirección *" value="${ad}"></div><button class="whatsapp-btn" onclick="sendOrder()">📤 Enviar pedido por WhatsApp</button>`;
}

async function sendOrder(){
  const n=document.getElementById('custName')?.value.trim();
  const ph=document.getElementById('custPhone')?.value.trim();
  const ad=document.getElementById('custAddress')?.value.trim();
  if(!n||!ph||!ad){showToast('⚠️ Completa todos los campos');return;}
  let t=0,msg='';Object.values(cart).forEach(i=>{const s=i.product.price*i.qty;t+=s;msg+=`${i.product.emoji||'📦'} ${i.product.name} × ${i.qty} — $${s.toFixed(2)}\n`;});
  localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',ph);if(ad)localStorage.setItem('clientAddress',ad);
  try{
    const ref=await db.collection('pedidos').add({nombre:n,telefono:ph,direccion:ad,productos:msg,total:t,fecha:new Date().toISOString(),estado:'pendiente'});
    localStorage.setItem('pedidoActivoId',ref.id);
    const wMsg='🛒 *Pedido #'+ref.id.slice(-4).toUpperCase()+' - Bodega Tony Tony*\n👤 *'+n+'*\n📞 *'+ph+'*\n📌 *'+ad+'*\n\n🧺 *Productos:*\n'+msg+'\n💰 *TOTAL: $'+t.toFixed(2)+'*';
    const wURL='https://wa.me/'+config.whatsapp+'?text='+encodeURIComponent(wMsg);
    setTimeout(()=>{window.location.href=wURL;},500);
    cart={};actualizarFloatingCart();showToast('✅ Pedido enviado');showTab('tracking');
  }catch(e){showToast('❌ Error al enviar');console.error(e);}
}

function renderTracking(){
  const c=document.getElementById('trackingContainer'),pid=localStorage.getItem('pedidoActivoId');
  if(!pid){c.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No tienes pedidos activos</p></div>';return;}
  db.collection('pedidos').doc(pid).get().then(snap=>{if(!snap.exists){c.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>Pedido no encontrado</p></div>';return;}const p=snap.data();c.innerHTML=`<div style="text-align:center;padding:20px;"><div style="font-size:50px;">📦</div><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;">#${pid.slice(-4).toUpperCase()}</div><span style="padding:6px 14px;border-radius:50px;background:#fff3cd;color:#856404;font-weight:800;">${p.estado||'pendiente'}</span><div style="margin:16px 0;font-size:13px;white-space:pre-line;">${p
