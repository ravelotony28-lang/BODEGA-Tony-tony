<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bodega Tony Tony">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<title>Bodega Tony Tony 🛒</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f5f5f5;--card:#fff;--text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* HEADER */
header{background:var(--oscuro);color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.4);}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--amarillo);}
.logo-text span{color:var(--rojo);}
.cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:'Nunito',sans-serif;}
.cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}

/* STATUS */
.status-bar{text-align:center;padding:7px;font-size:12px;font-weight:700;background:linear-gradient(90deg,#2dc653,#1a9e3f);color:white;}

/* TABS */
.tabs{display:flex;background:var(--card);border-bottom:2px solid var(--border);overflow-x:auto;scrollbar-width:none;position:sticky;top:48px;z-index:150;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{padding:12px 14px;border:none;background:transparent;font-weight:700;font-size:12px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-2px;font-family:'Nunito',sans-serif;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}

/* SEARCH */
.search-wrap{padding:10px 14px 8px;background:white;border-bottom:1px solid var(--border);}
.search-inner{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:50px;padding:10px 16px;border:1.5px solid var(--border);}
.search-inner input{flex:1;border:none;background:transparent;font-size:14px;outline:none;color:var(--text);font-family:'Nunito',sans-serif;}

/* VIEWS */
.view{display:none;}
.view.active{display:block;animation:fadeIn .2s ease;}
body.has-float .view{padding-bottom:72px;}

/* HERO */
.hero-banner{background:linear-gradient(135deg,#1a1a2e 0%,#2d1b4e 100%);padding:18px 16px 16px;position:relative;overflow:hidden;}
.hero-banner::after{content:'';position:absolute;right:-20px;top:-20px;width:140px;height:140px;background:radial-gradient(circle,rgba(230,57,70,.25),transparent 70%);border-radius:50%;}
.hero-greeting{font-size:12px;color:rgba(255,255,255,.6);font-weight:600;margin-bottom:4px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:26px;color:white;letter-spacing:.5px;line-height:1.1;margin-bottom:10px;}
.hero-title span{color:var(--amarillo);}
.hero-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:50px;padding:5px 12px;font-size:12px;font-weight:700;color:white;}
.hero-badge b{color:var(--verde);}

/* PROMO STRIP */
.promo-strip{background:linear-gradient(90deg,var(--amarillo),#ffb300);padding:9px 16px;display:flex;align-items:center;justify-content:space-between;}
.promo-strip-text{font-weight:800;font-size:13px;color:var(--oscuro);}
.promo-strip-link{font-size:11px;font-weight:800;color:var(--oscuro);background:rgba(0,0,0,.1);border-radius:50px;padding:4px 10px;text-decoration:none;}

/* SECTION */
.section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;padding:14px 14px 8px;color:var(--text);letter-spacing:.5px;}

/* CATEGORY CARDS */
.cats-scroll{display:flex;gap:10px;overflow-x:auto;padding:0 14px 12px;scrollbar-width:none;}
.cats-scroll::-webkit-scrollbar{display:none;}
.cat-card{flex-shrink:0;width:76px;text-align:center;cursor:pointer;}
.cat-card-icon svg{width:100%;height:100%;display:block;}

/* ── CATEGORY ICONS ANIMATED ── */
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin2{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.15)}}
.cat-card:hover .cat-icon-img{animation-play-state:running!important;}
.cat-card .cat-icon-img{animation-play-state:paused;}
.cat-card.active .cat-icon-img{animation-play-state:running!important;}

.cat-card-icon{width:76px;height:76px;border-radius:16px;overflow:hidden;margin-bottom:5px;transition:transform .15s;box-shadow:0 3px 10px rgba(0,0,0,.12);}
.cat-card:active .cat-card-icon svg{width:100%;height:100%;display:block;}

/* ── CATEGORY ICONS ANIMATED ── */
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes spin2{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes pulse2{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-4px) rotate(3deg)}}
@keyframes sparkle{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(1.15)}}
.cat-card:hover .cat-icon-img{animation-play-state:running!important;}
.cat-card .cat-icon-img{animation-play-state:paused;}
.cat-card.active .cat-icon-img{animation-play-state:running!important;}

.cat-card-icon{transform:scale(.95);}
.cat-card-label{font-size:11px;font-weight:700;color:var(--text);line-height:1.3;}
.cat-card.active .cat-card-label{color:var(--rojo);}

/* PRODUCTS */
.products-section{padding:0 14px 14px;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.product-card{background:var(--card);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.08);position:relative;transition:transform .15s;}
.product-card:active{transform:scale(.98);}
.product-img{width:100%;height:130px;object-fit:cover;}
.product-emoji{font-size:44px;text-align:center;padding:22px 0 8px;background:var(--gris);}
.product-info{padding:10px 12px 14px;}
.product-name{font-weight:800;font-size:13px;margin-bottom:4px;line-height:1.3;}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--rojo);}
.price-old{font-size:11px;color:var(--subtext);text-decoration:line-through;}
.price-new{font-family:'Bebas Neue',sans-serif;font-size:22px;color:var(--verde);}
.add-btn{background:var(--oscuro);color:white;border:none;border-radius:50px;padding:9px 14px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:8px;font-family:'Nunito',sans-serif;}
.agotado-badge{background:#ddd;color:#888;border-radius:50px;padding:8px;text-align:center;font-size:12px;margin-top:8px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;}
.qty-btn{background:var(--rojo);color:white;border:none;border-radius:50%;width:30px;height:30px;font-size:18px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.qty-num{font-weight:800;font-size:16px;min-width:20px;text-align:center;}
.variants-label{font-size:11px;font-weight:700;color:var(--subtext);}
.variants-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.variant-chip{padding:4px 8px;border:2px solid var(--border);border-radius:50px;font-size:11px;font-weight:700;cursor:pointer;background:var(--card);color:var(--text);}
.variant-chip.selected{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
.resena-btn{background:none;border:none;font-size:12px;cursor:pointer;margin-top:6px;color:var(--subtext);font-family:'Nunito',sans-serif;}
.badge-oferta{position:absolute;top:8px;left:8px;background:var(--rojo);color:white;border-radius:50px;padding:3px 9px;font-size:10px;font-weight:800;z-index:2;}

/* OFERTAS */
.ofertas-section{padding:0 14px 4px;}
.ofertas-scroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.ofertas-scroll::-webkit-scrollbar{display:none;}

/* CART */
.cart-item{background:var(--card);border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);}
.cart-item .thumb{width:52px;height:52px;border-radius:12px;object-fit:cover;flex-shrink:0;}
.cart-item .cemoji{font-size:30px;flex-shrink:0;}
.cart-total{background:var(--oscuro);color:white;border-radius:18px;padding:18px;margin:14px 0;text-align:center;}
.cart-total .amount{font-family:'Bebas Neue',sans-serif;font-size:40px;color:var(--amarillo);}
.ci input,.ci select{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:14px;font-size:15px;margin-bottom:10px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;-webkit-appearance:none;}
.ci input:focus{border-color:var(--rojo);}
.wa-btn{display:block;width:100%;background:#25d366;color:white;border:none;border-radius:16px;padding:17px;font-weight:800;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;margin-top:10px;font-family:'Nunito',sans-serif;box-shadow:0 4px 16px rgba(37,211,102,.3);}
.wa-btn.off{background:#ccc;box-shadow:none;pointer-events:none;}
.entrega-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px;}
.entrega-opt{padding:14px 8px;border:2px solid var(--border);border-radius:16px;background:var(--card);text-align:center;cursor:pointer;font-weight:800;font-size:14px;transition:all .2s;font-family:'Nunito',sans-serif;}
.entrega-opt.active{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
.metodos-wrap{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
.metodo-chip{padding:9px 16px;border:2px solid var(--border);border-radius:50px;background:var(--card);font-weight:700;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s;}
.metodo-chip.active{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
.pago-card{background:#fff8e1;border:2px solid var(--amarillo);border-radius:16px;padding:14px;margin-top:8px;line-height:2;font-size:14px;}
.comp-box{border-radius:16px;padding:14px;margin:8px 0;}
.comp-red{background:#fff0f0;border:2px solid var(--rojo);}
.comp-yellow{background:#fff8e1;border:2px solid var(--amarillo);}
.comp-upload{width:100%;min-height:100px;border:2px dashed #ccc;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--subtext);font-weight:700;font-size:13px;overflow:hidden;margin-top:10px;background:var(--bg);}
.comp-ok{border:2px solid var(--verde);background:#e8f5e9;border-radius:12px;padding:10px;margin-top:8px;text-align:center;font-weight:800;color:#1b5e20;font-size:13px;}
.geo-box{border-radius:14px;padding:10px;margin-bottom:8px;font-size:13px;font-weight:700;}
.geo-no{background:#fff8e1;border:2px solid var(--amarillo);color:#856404;}
.geo-si{background:#e8f5e9;border:2px solid var(--verde);color:#1b5e20;}

/* FLOATING CART */
.floating-cart{position:fixed;bottom:0;left:0;right:0;z-index:300;padding:12px 16px;background:var(--oscuro);display:flex;align-items:center;justify-content:space-between;gap:10px;transform:translateY(100%);transition:transform .3s;border-radius:20px 20px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.3);}
.floating-cart.visible{transform:translateY(0);}
.floating-cart-total{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--amarillo);}
.floating-cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:11px 20px;font-weight:800;font-size:14px;cursor:pointer;font-family:'Nunito',sans-serif;}

/* CHAT FAB */
.chat-fab{position:fixed;bottom:90px;right:16px;z-index:400;background:var(--verde);color:white;width:54px;height:54px;border-radius:50%;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(45,198,83,.5);display:flex;align-items:center;justify-content:center;}

/* CHAT */
.chat-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.chat-modal.open{display:flex;}
.chat-window{width:100%;max-width:420px;height:70vh;background:var(--card);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:slideUp .3s ease;}
.chat-header{background:var(--verde);color:white;padding:14px 16px;border-radius:24px 24px 0 0;display:flex;justify-content:space-between;align-items:center;font-weight:800;}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;}
.chat-msg.me{background:var(--verde);color:white;align-self:flex-end;}
.chat-msg.bot{background:#e3f2fd;color:#0d47a1;align-self:flex-start;}
.chat-msg.admin{background:var(--gris);color:var(--text);align-self:flex-start;}
.chat-input-wrap{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
.chat-input-wrap input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:50px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
.chat-input-wrap button{background:var(--verde);color:white;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;}

/* RESENA */
.resena-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;display:none;align-items:flex-end;justify-content:center;}
.resena-modal.open{display:flex;}
.resena-sheet{width:100%;max-width:420px;background:var(--card);border-radius:24px 24px 0 0;padding:20px;animation:slideUp .3s ease;max-height:85vh;overflow-y:auto;}

/* PUNTOS */
.puntos-card{background:linear-gradient(135deg,#1a1a2e,#2d2d4e);border-radius:20px;padding:18px;margin:0 0 12px;color:white;position:relative;overflow:hidden;}
.puntos-card::before{content:'★';position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.06;line-height:1;}
.puntos-num{font-family:'Bebas Neue',sans-serif;font-size:46px;color:var(--amarillo);line-height:1;}
.puntos-bar-bg{background:rgba(255,255,255,.15);border-radius:50px;height:10px;margin:8px 0;}
.puntos-bar{background:linear-gradient(90deg,var(--amarillo),#ff6b2b);border-radius:50px;height:10px;transition:width .6s;}
.puntos-historial{background:var(--card);border-radius:16px;padding:14px;}
.puntos-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.puntos-item:last-child{border-bottom:none;}
.puntos-badge{background:var(--oscuro);color:var(--amarillo);border-radius:50px;padding:3px 10px;font-size:11px;font-weight:800;}

/* TOAST */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;z-index:9999;transition:transform .3s;max-width:90vw;text-align:center;font-size:14px;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:40px 20px;color:var(--subtext);}

/* REGISTRO */
.reg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99998;display:flex;align-items:center;justify-content:center;padding:20px;}
.reg-card{background:var(--card);border-radius:24px;padding:28px 20px;width:100%;max-width:330px;text-align:center;}
.reg-field{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:14px;font-size:16px;margin-bottom:12px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;-webkit-appearance:none;}
.reg-field:focus{border-color:var(--rojo);}
.reg-btn{width:100%;background:var(--rojo);color:white;border:none;border-radius:14px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;font-family:'Nunito',sans-serif;box-shadow:0 4px 16px rgba(230,57,70,.3);}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash" style="position:fixed;inset:0;background:var(--oscuro);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .4s;">
  <img src="logo.png" alt="Logo" style="width:120px;height:auto;margin-bottom:16px;border-radius:16px;" onerror="this.style.display='none'">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;color:var(--amarillo);">Bodega <span style="color:var(--rojo);">Tony</span> Tony</div>
  <div style="width:30px;height:30px;border:3px solid rgba(255,255,255,.2);border-radius:50%;border-top-color:var(--rojo);animation:spin .8s linear infinite;margin-top:16px;"></div>
</div>

<!-- REGISTRO -->
<div class="reg-overlay" id="regModal" style="display:none;">
  <div class="reg-card">
    <img src="logo.png" alt="Logo" style="width:90px;margin-bottom:14px;border-radius:12px;" onerror="this.style.display='none'">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);">Bodega Tony Tony</div>
    <div style="font-size:13px;color:var(--subtext);margin:6px 0 18px;">🛒 Ingresa tus datos para continuar</div>
    <input class="reg-field" type="text" id="regNombre" placeholder="Tu nombre completo" autocomplete="name">
    <div style="display:flex;margin-bottom:12px;">
      <select id="regCodigo" style="width:90px;padding:13px 6px;border:2px solid var(--border);border-right:none;border-radius:14px 0 0 14px;font-weight:700;outline:none;background:var(--bg);color:var(--text);font-size:13px;-webkit-appearance:none;">
        <option value="+58">🇻🇪 +58</option>
        <option value="+57">🇨🇴 +57</option>
        <option value="+1">🇺🇸 +1</option>
      </select>
      <input class="reg-field" type="tel" id="regTel" placeholder="Número sin código" style="border-radius:0 14px 14px 0;margin-bottom:0;flex:1;" inputmode="numeric" autocomplete="tel">
    </div>
    <p id="regErr" style="color:var(--rojo);font-size:13px;font-weight:700;min-height:18px;margin-bottom:10px;"></p>
    <button class="reg-btn" id="regBtn">¡Entrar! →</button>
  </div>
</div>

<header>
  <div style="display:flex;align-items:center;gap:10px;">
    <img src="logo.png" alt="Logo" style="width:36px;height:36px;border-radius:8px;" onerror="this.style.display='none'">
    <div>
      <div class="logo-text">Bodega <span>Tony</span> Tony</div>
      <div style="font-size:9px;color:rgba(255,255,255,.5);">Mini Market · Siempre fresco</div>
    </div>
  </div>
  <button class="cart-btn" onclick="showTab('carrito')">🛒 <span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="status-bar" id="statusBar">✅ Abierto · 09:00 AM - 10:00 PM</div>

<div class="tabs">
  <button class="tab-btn active" id="tab-tienda"   onclick="showTab('tienda')">🏪 Tienda</button>
  <button class="tab-btn"        id="tab-carrito"  onclick="showTab('carrito')">🛒 Pedido</button>
  <button class="tab-btn"        id="tab-tracking" onclick="showTab('tracking')">📦 Seguimiento</button>
  <button class="tab-btn"        id="tab-soporte"  onclick="showTab('soporte')">❗ Soporte</button>
  <button class="tab-btn"        id="tab-puntos"   onclick="showTab('puntos')">⭐ Puntos</button>
</div>

<div class="search-wrap">
  <div class="search-inner">
    <span style="font-size:15px;">🔍</span>
    <input type="text" id="searchInput" placeholder="¿Qué quieres hoy?" oninput="renderStore()">

        'farmacia':18,'salud':18,'medicamentos':18,'vitaminas':18,
        'congelados':19,'helados':19,
        'general':20
      };
      // Check exact match
      if(exact[n]!==undefined) return renderIcon(exact[n],name);
      // Check keyword
      if(/bebi|refre|agua|jugo|soda|gaseo/.test(n)) return renderIcon(1,name);
      if(/carne|pollo|res |cerdo|jamón|embut/.test(n)) return renderIcon(2,name);

      if(/panad|pan |paste|torta|bizcocho|repos/.test(n)) return renderIcon(6,name);

      if(/bebé|bebe|niño|niña|infant|pañal|juguete/.test(n)) return renderIcon(15,name);
      if(/tecno|celular|electrón|comput|cable|cargad/.test(n)) return renderIcon(16,name);
      if(/mascota|perro|gato|animal|veterinar/.test(n)) return renderIcon(17,name);
      if(/farmacia|medica|salud|vitamina|pastilla|remedios/.test(n)) return renderIcon(18,name);
      if(/congelado|helado|hielo/.test(n)) return renderIcon(19,name);
      // Fallback: color único + letra
      return renderIcon(-1,name);
    }
    function renderIcon(idx,name){
      const palettes=[
        ['#1a1a2e','#e63946'],// 0 Todos
        ['#0d47a1','#29b6f6'],// 1 Bebidas
        ['#b71c1c','#ef5350'],// 2 Carnes

        ['#006064','#26c6da'],// 9 Limpieza
        ['#6a1b9a','#ce93d8'],// 10 Higiene
        ['#4a148c','#9c27b0'],// 11 Licores
        ['#b8860b','#ffd700'],// 12 Joyería
        ['#2e7d32','#a5d6a7'],// 13 Papelería
        ['#880e4f','#f48fb1'],// 14 Cabello
        ['#0277bd','#81d4fa'],// 15 Bebé
        ['#1a237e','#7986cb'],// 16 Tecnología
        ['#bf360c','#ff8a65'],// 17 Mascotas
        ['#00695c','#80cbc4'],// 18 Farmacia
        ['#01579b','#81d4fa'],// 19 Congelados
        ['#546e7a','#90a4ae'],// 20 General
      ];
      const emojis=['🏪','🥤','🥩','🧀','🍎','🥦','🍞','🌾','🍿','🧹','🧴','🍷','💍','✏️','💇','👶','📱','🐾','💊','🧊','📦'];
      const bgColors=['#fff0f0','#e3f2fd','#fce4ec','#fff8e1','#ffebee','#e8f5e9','#fff3e0','#efebe9','#fffde7','#e0f2f1','#f3e5f5','#ede7f6','#fffde7','#e8f5e9','#fce4ec','#e3f2fd','#e8eaf6','#fbe9e7','#e0f7fa','#e1f5fe','#eceff1'];
      if(idx<0||idx>=emojis.length){
        // Custom fallback
        const colors=['#fff0f0','#e3f2fd','#e8f5e9','#fff8e1','#f3e5f5','#fce4ec','#e0f2f1'];
        let hash=0; for(let i=0;i<name.length;i++) hash=name.charCodeAt(i)+((hash<<5)-hash);
        const bg=colors[Math.abs(hash)%colors.length];
        const letter=(name[0]||'?').toUpperCase();

    }
    h+='<div style="padding:14px 14px 4px;font-family:Bebas Neue,sans-serif;font-size:18px;letter-spacing:.5px;">Categorías</div>';

function buildCard(p,scroll){
  const img=p.photo?'<img src="'+esc(p.photo)+'" class="product-img" loading="lazy">':'<div class="product-emoji">'+(p.emoji||'📦')+'</div>';

  let act='';
  if(p.agotado){act='<div class="agotado-badge">❌ Agotado</div>';}
  else if(hasV){
    act='<div class="variants-label">Elige variante:</div><div class="variants-list">';
    p.variants.forEach(v=>{const q2=qty(p.id,v);act+='<span class="variant-chip'+(q2>0?' selected':'')+'" onclick="event.stopPropagation();addCart(\''+esc(p.id)+'\',\''+esc(v)+'\')">'+esc(v)+(q2>0?' ×'+q2:'')+' </span>';});
    act+='</div>';
  }else{
    const q2=qty(p.id,'');
    act=q2>0?'<div class="qty-ctrl"><button class="qty-btn" onclick="event.stopPropagation();chgQty(\''+esc(p.id)+'\',\'\',-1)">−</button><span class="qty-num">'+q2+'</span><button class="qty-btn" onclick="event.stopPropagation();addCart(\''+esc(p.id)+'\',\'\')">+</button></div>':'<button class="add-btn" onclick="event.stopPropagation();addCart(\''+esc(p.id)+'\',\'\')">+ Agregar</button>';

}

function subirComp(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=900,cv=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      comp64=cv.toDataURL('image/jpeg',.82);
      renderCart();showToast('✅ Comprobante cargado');
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

function mkId(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let id='';for(let i=0;i<8;i++)id+=c[Math.floor(Math.random()*c.length)];return id;}
function doOrder(link){
  const n=(document.getElementById('cName')||{}).value?.trim()||'';
  const ph=(document.getElementById('cPhone')||{}).value?.trim()||'';
  const ad=(document.getElementById('cAddr')||{}).value?.trim()||'';
  if(!n||!ph){showToast('⚠️ Completa nombre y teléfono');return false;}
  if(entrega==='domicilio'&&!ad){showToast('⚠️ Escribe tu dirección');return false;}
  if(entrega==='domicilio'&&needsComp()&&!comp64){showToast('⚠️ Sube la foto del comprobante');return false;}
  localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',ph);if(ad)localStorage.setItem('clientAddress',ad);
  let tot=0,msg='',parr=[];
  Object.values(cart).forEach(i=>{const s=i.p.price*i.qty;tot+=s;msg+=(i.p.emoji||'')+' '+i.p.name+(i.v?' ('+i.v+')':'')+' ×'+i.qty+' -- $'+s.toFixed(2)+'\n';parr.push({name:i.p.name,variant:i.v,qty:i.qty,price:i.p.price});});
  const pid=mkId();
  const geoTxt=(geo&&!geo.manual)?'\n📍 https://maps.google.com/?q='+geo.lat+','+geo.lng:'';
  const compTxt=comp64?'\n🧾 Comprobante subido en la app':'';
  const etxt=entrega==='domicilio'?'🛵 Domicilio':'🏪 Retiro en tienda';
  const waText='🛒 *Pedido #'+pid+' - Bodega Tony Tony*\n👤 *'+n+'*\n📞 *'+ph+'*\n'+(ad?'📌 *'+ad+'*':'')+geoTxt+'\n📦 *'+etxt+'*\n💳 *'+metodo+'*'+compTxt+'\n\n🧺 *Productos:*\n'+msg+'\n💰 *TOTAL: $'+tot.toFixed(2)+'*';
  const data={pedidoId:pid,nombre:n,telefono:ph,direccion:ad||'',productos:msg,productosArray:parr,total:tot,tipoEntrega:entrega,metodoPago:metodo,comprobante:comp64||'',geo:geo||null,fecha:new Date().toISOString(),estado:'pendiente'};
  if(comp64)data.comprobanteAprobado=null;
  db.collection('pedidos').doc(pid).set(data).catch(e=>console.error(e));
  const puntosG=Math.floor(tot);
  const phone=localStorage.getItem('clientPhone')||'anonimo';
  db.collection('clientes').doc(phone).get().then(snap=>{
    const actual=snap.exists?(snap.data().puntos||0):0;
    const hist=snap.exists?(snap.data().historial||[]):[];
    hist.unshift({fecha:new Date().toISOString(),puntos:puntosG,pedido:pid,tipo:'ganado'});
    db.collection('clientes').doc(phone).set({nombre:n,telefono:ph,puntos:actual+puntosG,totalGastado:(snap.exists?(snap.data().totalGastado||0):0)+tot,historial:hist.slice(0,20)},{merge:true});
  }).catch(()=>{});
  localStorage.setItem('pedidoActivoId',pid);
  cart={};geo=null;comp64='';updateFloat();
  showToast('✅ ¡Pedido enviado! +'+puntosG+' pts ⭐');
  setTimeout(()=>showTab('tracking'),800);
  link.href='https://wa.me/'+cfg.whatsapp.replace(/[^0-9+]/g,'')+'?text='+encodeURIComponent(waText);
  return true;
}

    if(!t||t.length<7){if(err)err.textContent='⚠️ Número inválido';return;}
    localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',code+t);
    modal.style.display='none';showToast('🎉 ¡Bienvenido '+n+'!');
  }
  nb.addEventListener('click',reg);
  ['regNombre','regTel'].forEach(id=>{const el=document.getElementById(id);if(el)el.onkeyup=e=>{if(e.key==='Enter')reg();};});
}

setTimeout(()=>{if(!localStorage.getItem('clientName'))mostrarRegistro();},900);
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},1300);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
