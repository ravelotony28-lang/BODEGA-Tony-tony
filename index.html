<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="description" content="Bodega Tony Tony - Haz tu pedido aquí 🛒">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bodega Tony Tony">
<link rel="manifest" href="manifest.json">
<title>Bodega Tony Tony 🛒</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f7f7f7;--card:#fff;--text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;}
.dark{--bg:#0f0f1a;--card:#1a1a2e;--text:#f0f0f0;--subtext:#aaa;--border:#2a2a3e;--gris:#2a2a3e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--oscuro);color:#fff;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:var(--amarillo);}
.logo span{color:var(--rojo);}
.cart-btn{background:var(--rojo);color:#fff;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;}
.tab-btn{padding:11px 16px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.search-wrap{padding:10px 16px;background:var(--card);}
.search-wrap input{width:100%;padding:10px 16px;border:2px solid var(--border);border-radius:50px;font-size:14px;outline:none;background:var(--bg);color:var(--text);}
.view{display:none;padding:14px;}
.view.active{display:block;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.product-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);display:flex;flex-direction:column;}
.product-card img{width:100%;height:120px;object-fit:cover;}
.product-emoji{font-size:40px;text-align:center;padding:20px 0 10px;}
.product-info{padding:8px 12px 12px;flex:1;display:flex;flex-direction:column;gap:5px;}
.product-name{font-weight:700;font-size:13px;}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--rojo);}
.add-btn{background:var(--oscuro);color:#fff;border:none;border-radius:50px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:auto;}
.agotado-badge{background:#555;color:#fff;border-radius:50px;padding:8px 14px;font-weight:800;font-size:12px;width:100%;margin-top:auto;text-align:center;}
.qty-ctrl{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;margin-top:auto;}
.qty-btn{background:var(--gris);border:none;border-radius:50%;width:30px;height:30px;font-size:18px;font-weight:900;cursor:pointer;}
.qty-num{font-weight:800;font-size:16px;}
.cat-filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;}
.cat-chip{padding:7px 14px;border-radius:50px;border:2px solid var(--border);background:var(--card);color:var(--subtext);font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;}
.cat-chip.active{border-color:var(--rojo);background:var(--rojo);color:#fff;}
.cart-item{background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cart-total{background:var(--oscuro);color:#fff;border-radius:16px;padding:18px;margin:14px 0;text-align:center;}
.cart-total .amount{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--amarillo);}
.customer-info input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:10px;outline:none;background:var(--bg);color:var(--text);}
.whatsapp-btn{background:#25d366;color:#fff;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:10px;margin-top:8px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:#fff;padding:12px 24px;border-radius:50px;font-weight:700;z-index:999;transition:transform 0.3s;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:40px 20px;color:var(--subtext);}
.empty-icon{font-size:60px;margin-bottom:12px;}
.badge{position:absolute;top:8px;left:8px;background:var(--rojo);color:#fff;border-radius:50px;padding:3px 9px;font-size:11px;font-weight:800;}
.pago-card{background:#fff8e1;border:2px solid var(--amarillo);border-radius:14px;padding:14px;margin-top:12px;}
.metodo-chip{padding:10px;border:2px solid var(--border);border-radius:12px;cursor:pointer;font-weight:700;text-align:center;background:var(--card);color:var(--text);}
.metodo-chip.selected{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
</style>
</head>
<body>

<div id="splash" style="position:fixed;inset:0;background:var(--oscuro);z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.4s;">
  <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px;color:var(--amarillo);">Bodega <span style="color:var(--rojo);">Tony</span> Tony</div>
  <div style="width:35px;height:35px;border:3px solid rgba(255,255,255,0.2);border-radius:50%;border-top-color:var(--rojo);animation:spin 0.8s linear infinite;margin-top:16px;"></div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>

<header>
  <div>
    <div class="logo">Bodega <span>Tony</span> Tony</div>
    <div style="font-size:11px;color:#aaa;">🛒 Haz tu pedido aquí</div>
  </div>
  <button class="cart-btn" onclick="showTab('carrito')">🛒 <span class="cart-count" id="cartCount">0</span></button>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="showTab('tienda')">🏪 Tienda</button>
  <button class="tab-btn" onclick="showTab('carrito')">🛒 Mi Pedido</button>
  <button class="tab-btn" onclick="showTab('tracking')">📦 Seguimiento</button>
  <button class="tab-btn" onclick="showTab('soporte')">❗ Soporte</button>
</div>

<div class="search-wrap"><input type="text" id="searchInput" placeholder="Buscar producto..." oninput="renderStore()"></div>

<div class="view active" id="view-tienda"><div id="storeContainer"></div></div>
<div class="view" id="view-carrito"><div id="cartContainer"></div></div>
<div class="view" id="view-tracking"><div id="trackingContainer"></div></div>
<div class="view" id="view-soporte"><div id="soporteContainer"></div></div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",authDomain:"bodegatonytony.firebaseapp.com",projectId:"bodegatonytony",storageBucket:"bodegatonytony.firebasestorage.app",messagingSenderId:"763208241886",appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"});
const db=firebase.firestore();

let products=[],cart={},selectedCategory='Todos',selectedMetodo='pagoMovil',comprobanteBase64='';
let config={whatsapp:'+584242520138',metodosPago:{efectivo:true,pagoMovil:true,transferencia:false},tiempoPreparacion:30,pedidoMinimo:0,pagoMovil:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cedula:'6.966.714',telefono:'04241572275'},transferencia:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cuenta:''}};

db.collection('config').doc('tienda').onSnapshot(snap=>{if(snap.exists){const d=snap.data();config.whatsapp=d.whatsapp||config.whatsapp;config.metodosPago=d.metodosPago||config.metodosPago;config.tiempoPreparacion=d.tiempoPreparacion||30;config.pedidoMinimo=d.pedidoMinimo||0;config.pagoMovil=d.pagoMovil||config.pagoMovil;config.transferencia=d.transferencia||config.transferencia;}});
db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.visible!==false);renderStore();});

function cartKey(pid,v){return pid+'_'+(v||'');}
function getQty(pid,v){return(cart[cartKey(pid,v)]||{}).qty||0;}
function cartTotal(){return Object.values(cart).reduce((s,i)=>s+i.product.price*i.qty,0);}

function showTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  if(tab==='tienda')renderStore();
  if(tab==='carrito')renderCart();
  if(tab==='tracking')renderTracking();
  if(tab==='soporte')renderSoporte();
}

function renderStore(){
  const container=document.getElementById('storeContainer');
  if(!products.length){container.innerHTML='<div class="empty"><div class="empty-icon">🏪</div><p>Cargando productos...</p></div>';return;}
  const q=(document.getElementById('searchInput')?.value||'').toLowerCase().trim();
  const allCats=['Todos',...new Set(products.map(p=>p.category||'General'))];
  let html='<div class="cat-filter">';
  allCats.forEach(c=>{html+=`<button class="cat-chip${selectedCategory===c?' active':''}" onclick="filterCat('${c}')">${c}</button>`;});
  html+='</div>';
  const filtered=products.filter(p=>{
    const matchCat=selectedCategory==='Todos'||(p.category||'General')===selectedCategory;
    const matchSearch=!q||p.name.toLowerCase().includes(q);
    return matchCat&&matchSearch;
  });
  if(!filtered.length){html+='<div class="empty"><div class="empty-icon">🔍</div><p>No encontramos productos</p></div>';}
  else{
    html+='<div class="products-grid">';
    filtered.forEach(p=>{
      const imgHtml=p.photo?`<img src="${p.photo}" alt="${p.name}">`:`<div class="product-emoji">${p.emoji||'📦'}</div>`;
      const priceHtml=`<div class="product-price">$ ${p.price}</div>`;
      const actionHtml=p.agotado?`<div class="agotado-badge">❌ Agotado</div>`:(getQty(p.id,'')>0?`<div class="qty-ctrl"><button class="qty-btn" onclick="changeQty('${p.id}','',-1)">−</button><span class="qty-num">${getQty(p.id,'')}</span><button class="qty-btn" onclick="addToCart('${p.id}','')">+</button></div>`:`<button class="add-btn" onclick="addToCart('${p.id}','')">+ Agregar</button>`);
      html+=`<div class="product-card">${p.oferta?'<span class="badge">🔥</span>':''}${imgHtml}<div class="product-info"><div class="product-name">${p.name}</div>${priceHtml}${actionHtml}</div></div>`;
    });
    html+='</div>';
  }
  container.innerHTML=html;
  updateCartCount();
}

function filterCat(c){selectedCategory=c;renderStore();}
function addToCart(pid,variant){
  const p=products.find(x=>x.id===pid);
  if(!p||p.agotado){showToast('❌ No disponible');return;}
  const key=cartKey(pid,variant);
  if(!cart[key])cart[key]={product:p,variant:variant||'',qty:0};
  cart[key].qty++;
  renderStore();showToast('✅ Agregado');updateCartCount();
}
function changeQty(pid,variant,delta){
  const key=cartKey(pid,variant);if(!cart[key])return;
  cart[key].qty+=delta;if(cart[key].qty<=0)delete cart[key];
  renderStore();updateCartCount();
}
function updateCartCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b.qty,0);}

function renderCart(){
  const container=document.getElementById('cartContainer');
  const keys=Object.keys(cart);
  if(!keys.length){container.innerHTML='<div class="empty"><div class="empty-icon">🛒</div><p>Tu carrito está vacío</p></div>';return;}
  let total=0,itemsHtml='';
  keys.forEach(key=>{const item=cart[key],p=item.product,sub=p.price*item.qty;total+=sub;itemsHtml+=`<div class="cart-item"><div style="flex:1;"><div style="font-weight:700;">${p.name}</div><div style="color:var(--rojo);">$ ${p.price} × ${item.qty} = $ ${sub.toFixed(2)}</div></div><div class="qty-ctrl" style="width:auto;"><button class="qty-btn" onclick="changeQty('${p.id}','${item.variant}',-1);renderCart()">−</button><span class="qty-num">${item.qty}</span><button class="qty-btn" onclick="addToCart('${p.id}','${item.variant}');renderCart()">+</button></div></div>`;});
  const metodosHtml=Object.entries(config.metodosPago).filter(([,v])=>v).map(([k])=>`<div class="metodo-chip${selectedMetodo===k?' selected':''}" onclick="selectedMetodo='${k}';renderCart()">${k==='efectivo'?'💵 Efectivo':k==='pagoMovil'?'📱 Pago Móvil':'🏦 Transferencia'}</div>`).join('');
  container.innerHTML=`
    <div>${itemsHtml}</div>
    <div class="cart-total"><div>Total</div><div class="amount">$ ${total.toFixed(2)}</div></div>
    <div style="font-weight:700;margin-bottom:8px;">💳 Método de pago</div><div style="display:flex;gap:8px;flex-wrap:wrap;">${metodosHtml}</div>
    ${selectedMetodo==='pagoMovil'?`<div class="pago-card"><div style="font-weight:800;">📱 Pago Móvil</div><div>🏦 ${config.pagoMovil.banco}<br>👤 ${config.pagoMovil.nombre}<br>🪪 ${config.pagoMovil.cedula}<br>📱 ${config.pagoMovil.telefono}</div></div>`:''}
    <div class="customer-info" style="margin-top:12px;">
      <div style="font-weight:700;margin-bottom:8px;">📝 Tus datos</div>
      <input type="text" id="custName" placeholder="Tu nombre *">
      <input type="tel" id="custPhone" placeholder="Tu teléfono *">
      <input type="text" id="custAddress" placeholder="Tu dirección *">
    </div>
    <label for="comprobanteInput" style="cursor:pointer;display:block;margin-top:10px;"><div id="comprobantePreview" style="width:100%;height:100px;border:2px dashed var(--amarillo);border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#999;">📎 Toca para subir comprobante</div><input type="file" id="comprobanteInput" accept="image/*" style="display:none;" onchange="previewComprobante(this)"></label>
    <button class="whatsapp-btn" onclick="sendOrder()">📤 Enviar pedido por WhatsApp</button>`;
}

function previewComprobante(input){const file=input.files[0];if(!file)return;const reader=new FileReader();reader.onload=e=>{comprobanteBase64=e.target.result;document.getElementById('comprobantePreview').innerHTML=`<img src="${comprobanteBase64}" style="width:100%;height:100%;object-fit:cover;">`;};reader.readAsDataURL(file);}

async function sendOrder(){
  const name=document.getElementById('custName')?.value.trim();
  const phone=document.getElementById('custPhone')?.value.trim();
  const address=document.getElementById('custAddress')?.value.trim();
  if(!name||!phone||!address){showToast('⚠️ Completa todos los campos');return;}
  let total=0,productosMsg='';
  Object.values(cart).forEach(item=>{const sub=item.product.price*item.qty;total+=sub;productosMsg+=`${item.product.emoji||'📦'} ${item.product.name} × ${item.qty} — $${sub.toFixed(2)}\n`;});
  if(config.pedidoMinimo>0&&total<config.pedidoMinimo){showToast(`💰 Mínimo $${config.pedidoMinimo}`);return;}
  localStorage.setItem('clientName',name);localStorage.setItem('clientPhone',phone);localStorage.setItem('clientAddress',address);
  try{
    const ref=await db.collection('pedidos').add({nombre:name,telefono:phone,direccion:address,metodoPago:selectedMetodo,productos:productosMsg,total,fecha:new Date().toISOString(),estado:'pendiente',comprobante:comprobanteBase64,tiempoEstimado:config.tiempoPreparacion||30});
    localStorage.setItem('pedidoActivoId',ref.id);
    let msg=`🛒 *Pedido - Bodega Tony Tony*\n👤 *${name}*\n📞 *${phone}*\n📌 *${address}*\n💳 *${selectedMetodo}*\n\n🧺 *Productos:*\n${productosMsg}\n💰 *TOTAL: $${total.toFixed(2)}*`;
    window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
    cart={};comprobanteBase64='';updateCartCount();showToast('✅ Pedido enviado');showTab('tienda');
  }catch(e){showToast('❌ Error al enviar');}
}

function renderTracking(){
  const container=document.getElementById('trackingContainer');
  const pid=localStorage.getItem('pedidoActivoId');
  if(!pid){container.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>No tienes pedidos activos</p></div>';return;}
  db.collection('pedidos').doc(pid).get().then(snap=>{
    if(!snap.exists){container.innerHTML='<div class="empty"><div class="empty-icon">📦</div><p>Pedido no encontrado</p></div>';return;}
    const p=snap.data();
    container.innerHTML=`<div style="text-align:center;padding:20px;"><div style="font-size:50px;">📦</div><div style="font-family:'Bebas Neue',sans-serif;font-size:24px;margin:10px 0;">#${pid.slice(-4).toUpperCase()}</div><span style="padding:6px 14px;border-radius:50px;background:#fff3cd;color:#856404;font-weight:800;">${p.estado||'pendiente'}</span><div style="margin:16px 0;font-size:13px;white-space:pre-line;">${p.productos}</div><div style="font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--rojo);">$ ${p.total?.toFixed(2)||'0.00'}</div></div>`;
  });
}

function renderSoporte(){
  document.getElementById('soporteContainer').innerHTML=`
    <div style="background:var(--card);border-radius:16px;padding:18px;">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--rojo);margin-bottom:16px;">❗ Reportar problema</div>
      <input type="text" id="sNombre" placeholder="Tu nombre *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);">
      <input type="tel" id="sTelefono" placeholder="Tu teléfono *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);">
      <textarea id="sDescripcion" placeholder="Describe el problema *" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);min-height:90px;"></textarea>
      <button onclick="enviarSoporte()" style="width:100%;background:var(--rojo);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;">📤 Enviar reporte</button>
    </div>`;
}

async function enviarSoporte(){
  const n=document.getElementById('sNombre')?.value.trim();
  const t=document.getElementById('sTelefono')?.value.trim();
  const d=document.getElementById('sDescripcion')?.value.trim();
  if(!n||!t||!d){showToast('⚠️ Completa todos los campos');return;}
  await db.collection('soporte').add({clienteNombre:n,telefono:t,descripcion:d,estado:'nuevo',fecha:new Date().toISOString()});
  showToast('✅ Reporte enviado');showTab('tienda');
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

// REGISTRO INICIAL
setTimeout(()=>{
  if(!localStorage.getItem('clientName')){
    const modal=document.createElement('div');
    modal.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:9999;display:flex;align-items:center;justify-content:center;padding:20px;';
    modal.innerHTML=`
      <div style="background:var(--card);border-radius:24px;padding:28px 20px;width:100%;max-width:320px;text-align:center;">
        <div style="font-size:50px;margin-bottom:12px;">🛒</div>
        <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:var(--text);margin-bottom:20px;">Bodega Tony Tony</div>
        <input type="text" id="regNombre" placeholder="Tu nombre" style="width:100%;padding:12px;border:2px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--bg);color:var(--text);">
        <div style="position:relative;margin-bottom:16px;">
          <select id="regCodigo" style="position:absolute;left:0;top:0;bottom:0;width:80px;border:2px solid var(--border);border-right:none;border-radius:12px 0 0 12px;font-weight:700;outline:none;background:var(--bg);color:var(--text);padding:0 4px;">
            <option value="+58">🇻🇪 +58</option>
            <option value="+57">🇨🇴 +57</option>
          </select>
          <input type="tel" id="regTelefono" placeholder="Número sin código" style="width:100%;padding:12px 16px 12px 90px;border:2px solid var(--border);border-radius:12px;outline:none;background:var(--bg);color:var(--text);">
        </div>
        <button onclick="guardarRegistro()" style="width:100%;background:var(--rojo);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;">Continuar →</button>
      </div>`;
    document.body.appendChild(modal);
    window.guardarRegistro=function(){
      const n=document.getElementById('regNombre')?.value.trim();
      const c=document.getElementById('regCodigo')?.value||'+58';
      const t=document.getElementById('regTelefono')?.value.trim();
      if(!n||!t){showToast('⚠️ Completa tus datos');return;}
      localStorage.setItem('clientName',n);
      localStorage.setItem('clientPhone',c+t.replace(/\D/g,''));
      modal.remove();showToast('¡Bienvenido '+n+'! 🎉');
    };
  }
},800);

// SPLASH
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},1200);

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
