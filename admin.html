<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin Tony Tony">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>⚙️ Admin - Bodega Tony Tony</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{
  --rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;
  --oscuro:#1a1a2e;--bg:#f5f5f5;--card:#fff;
  --text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* ── HEADER ── */
header{
  background:var(--oscuro);color:white;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.3);
}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--amarillo);}
.logo-text span{color:var(--rojo);}

/* ── TABS ── */
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{
  padding:11px 14px;border:none;background:transparent;
  font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;
  white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;
  transition:color .2s;
}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.tab-btn:hover:not(.active){color:var(--text);}

/* ── VIEWS ── */
.view{display:none;padding:16px;}
.view.active{display:block;}

/* ── CARDS ── */
.admin-section{
  background:var(--card);border-radius:16px;padding:18px;
  box-shadow:0 4px 20px rgba(0,0,0,.1);margin-bottom:16px;
}
.admin-section h3{
  font-family:'Bebas Neue',sans-serif;font-size:20px;margin-bottom:14px;
  color:var(--text);border-left:4px solid var(--rojo);padding-left:10px;
}

/* ── FORMS ── */
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.form-row input,.form-row select,
.admin-input{
  flex:1;min-width:120px;padding:10px 14px;
  border:2px solid var(--border);border-radius:10px;
  font-size:14px;outline:none;background:var(--bg);color:var(--text);
  font-family:'Nunito',sans-serif;
  transition:border-color .2s;
}
.form-row input:focus,.admin-input:focus{border-color:var(--rojo);}
.btn-primary{
  background:var(--rojo);color:white;border:none;border-radius:10px;
  padding:10px 20px;font-weight:800;font-size:14px;cursor:pointer;
  font-family:'Nunito',sans-serif;transition:opacity .2s;
}
.btn-primary:hover{opacity:.85;}

/* ── PHOTO UPLOAD ── */
.photo-upload{
  width:100%;height:110px;border:2px dashed #ddd;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  cursor:pointer;color:#999;font-size:13px;font-weight:700;overflow:hidden;
  margin-bottom:10px;transition:border-color .2s;
}
.photo-upload:hover{border-color:var(--rojo);}

/* ── PRODUCT LIST ── */
.product-list-admin{display:flex;flex-direction:column;gap:10px;}
.product-item-admin{
  display:flex;align-items:center;gap:10px;
  background:var(--gris);border-radius:12px;padding:10px 14px;
}
.product-item-admin .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;}
.product-item-admin .pemoji{font-size:28px;min-width:32px;text-align:center;}
.product-item-admin .info{flex:1;}
.del-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--rojo);}

/* ── CHARTS ── */
.chart-container{background:var(--card);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
#salesChart,#ordersChart{max-height:250px;}

/* ── ORDERS TABLE ── */
.orders-table{width:100%;border-collapse:collapse;font-size:13px;}
.orders-table th{background:var(--gris);padding:10px;text-align:left;font-weight:800;}
.orders-table td{border-bottom:1px solid var(--border);padding:10px;}
.status-badge{display:inline-block;padding:4px 12px;border-radius:20px;font-weight:700;font-size:11px;}
.status-pendiente{background:#ffc107;color:#000;}
.status-entregado{background:var(--verde);color:white;}
.status-cancelado{background:#dc3545;color:white;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px;}
.stat-card{background:var(--card);border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.stat-number{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--rojo);margin:8px 0;}
.stat-label{font-size:12px;color:var(--subtext);font-weight:700;}

.msg{padding:10px;border-radius:8px;margin-bottom:10px;font-weight:700;display:none;}
.msg.success{background:var(--verde);color:white;}
.msg.error{background:#dc3545;color:white;}
</style>
</head>
<body>
<header>
<div class="logo-text">ADMIN <span>TT</span></div>
<span style="font-size:12px;color:#ccc;">Dashboard de Gestión</span>
</header>

<div class="tabs">
<button class="tab-btn active" onclick="switchAdminTab('dashboard')">📊 Dashboard</button>
<button class="tab-btn" onclick="switchAdminTab('productos')">📦 Productos</button>
<button class="tab-btn" onclick="switchAdminTab('pedidos')">📋 Pedidos</button>
</div>

<!-- ═══ DASHBOARD ═══ -->
<div id="dashboardView" class="view active">
<div class="stats-grid">
<div class="stat-card">
<div class="stat-label">Total Ventas</div>
<div class="stat-number" id="totalSales">$0</div>
</div>
<div class="stat-card">
<div class="stat-label">Órdenes</div>
<div class="stat-number" id="totalOrders">0</div>
</div>
<div class="stat-card">
<div class="stat-label">Productos</div>
<div class="stat-number" id="totalProducts">0</div>
</div>
<div class="stat-card">
<div class="stat-label">Pendientes</div>
<div class="stat-number" id="pendingOrders">0</div>
</div>
</div>

<div class="chart-container">
<canvas id="salesChart"></canvas>
</div>

<div class="admin-section">
<h3>Últimas Órdenes</h3>
<table class="orders-table">
<thead>
<tr>
<th>Cliente</th>
<th>Total</th>
<th>Estado</th>
<th>Fecha</th>
</tr>
</thead>
<tbody id="recentOrders"></tbody>
</table>
</div>
</div>

<!-- ═══ PRODUCTOS ═══ -->
<div id="productosView" class="view">
<div class="admin-section">
<h3>Agregar Nuevo Producto</h3>
<div class="msg" id="productMsg"></div>
<div class="form-row">
<input type="text" id="productName" placeholder="Nombre del producto" class="admin-input">
<input type="number" id="productPrice" placeholder="Precio" class="admin-input">
<input type="number" id="productStock" placeholder="Stock" class="admin-input">
</div>
<div class="form-row">
<select id="productCategory" class="admin-input">
<option value="">Categoría</option>
<option value="bebidas">Bebidas</option>
<option value="snacks">Snacks</option>
<option value="otros">Otros</option>
</select>
<input type="number" id="productDiscount" placeholder="Descuento %" class="admin-input">
<input type="text" id="productEmoji" placeholder="Emoji (ej: 🥤)" class="admin-input">
</div>
<div class="photo-upload" onclick="document.getElementById('productImage').click()">
📷 Subir foto del producto
<input type="file" id="productImage" accept="image/*" style="display:none;">
</div>
<button class="btn-primary" onclick="addProduct()">GUARDAR PRODUCTO</button>
</div>

<div class="admin-section">
<h3>Productos en Sistema</h3>
<div class="product-list-admin" id="productsList"></div>
</div>
</div>

<!-- ═══ PEDIDOS ═══ -->
<div id="pedidosView" class="view">
<div class="admin-section">
<h3>Gestión de Pedidos</h3>
<table class="orders-table">
<thead>
<tr>
<th>Cliente</th>
<th>Teléfono</th>
<th>Dirección</th>
<th>Total</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>
<tbody id="ordersManagement"></tbody>
</table>
</div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAdJM1POq4gYnLq9Vc7qYGzPFT5EqKzUjI",
  projectId: "bodega-tony-tony-c0a95",
  appId: "1:717816319206:web:f48a2a9c6c7e2c8d9e0f1a"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let allProducts = [];
let allOrders = [];
let salesChart = null;

async function loadData() {
  try {
    const productsSnapshot = await db.collection('products').get();
    allProducts = productsSnapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
    
    const ordersSnapshot = await db.collection('orders').get();
    allOrders = ordersSnapshot.docs.map(doc => ({id: doc.id, ...doc.data()}));
    
    updateDashboard();
    updateProductsList();
    updateOrdersManagement();
  } catch (e) {
    console.error("Error loading data:", e);
  }
}

function updateDashboard() {
  const totalSales = allOrders.reduce((sum, order) => sum + order.total, 0);
  const pendingCount = allOrders.filter(o => o.estado === 'pendiente').length;
  
  document.getElementById('totalSales').textContent = '$' + totalSales.toFixed(2);
  document.getElementById('totalOrders').textContent = allOrders.length;
  document.getElementById('totalProducts').textContent = allProducts.length;
  document.getElementById('pendingOrders').textContent = pendingCount;
  
  const recentOrdersHtml = allOrders.slice(-5).reverse().map(order => `
    <tr>
      <td>${order.cliente}</td>
      <td>$${order.total.toFixed(2)}</td>
      <td><span class="status-badge status-${order.estado}">${order.estado.toUpperCase()}</span></td>
      <td>${new Date(order.fecha.toDate ? order.fecha.toDate() : order.fecha).toLocaleDateString()}</td>
    </tr>
  `).join('');
  
  document.getElementById('recentOrders').innerHTML = recentOrdersHtml;
}

function updateProductsList() {
  const productsHtml = allProducts.map(p => `
    <div class="product-item-admin">
      ${p.imgUrl ? `<img src="${p.imgUrl}" class="thumb">` : `<div class="pemoji">${p.emoji || '📦'}</div>`}
      <div class="info">
        <div style="font-weight:700;">${p.nombre}</div>
        <div style="font-size:12px;color:var(--subtext);">$${p.precio} | Stock: ${p.stock}</div>
      </div>
      <button class="del-btn" onclick="deleteProduct('${p.id}')">🗑</button>
    </div>
  `).join('');
  
  document.getElementById('productsList').innerHTML = productsHtml;
}

function updateOrdersManagement() {
  const ordersHtml = allOrders.map(order => `
    <tr>
      <td>${order.cliente}</td>
      <td>${order.telefono}</td>
      <td>${order.direccion}</td>
      <td>$${order.total.toFixed(2)}</td>
      <td><span class="status-badge status-${order.estado}">${order.estado.toUpperCase()}</span></td>
      <td>
        <select onchange="updateOrderStatus('${order.id}', this.value)">
          <option value="${order.estado}">Cambiar...</option>
          <option value="entregado">✓ Entregado</option>
          <option value="cancelado">✗ Cancelado</option>
        </select>
      </td>
    </tr>
  `).join('');
  
  document.getElementById('ordersManagement').innerHTML = ordersHtml;
}

async function addProduct() {
  const name = document.getElementById('productName').value;
  const price = parseFloat(document.getElementById('productPrice').value);
  const stock = parseInt(document.getElementById('productStock').value);
  const category = document.getElementById('productCategory').value;
  const discount = parseFloat(document.getElementById('productDiscount').value) || 0;
  const emoji = document.getElementById('productEmoji').value;
  
  if(!name || !price || stock === '') {
    showMessage('productMsg', 'Completa los campos obligatorios', 'error');
    return;
  }
  
  try {
    const precioFinal = price * (1 - discount / 100);
    
    await db.collection('products').add({
      nombre: name,
      precio: price,
      precioFinal: precioFinal,
      stock: stock,
      categoria: category,
      descuento: discount,
      emoji: emoji,
      imgUrl: ''
    });
    
    showMessage('productMsg', '✓ Producto agregado correctamente', 'success');
    document.getElementById('productName').value = '';
    document.getElementById('productPrice').value = '';
    document.getElementById('productStock').value = '';
    document.getElementById('productDiscount').value = '';
    
    setTimeout(() => loadData(), 1000);
  } catch (e) {
    console.error("Error:", e);
    showMessage('productMsg', '✗ Error al agregar producto', 'error');
  }
}

async function deleteProduct(productId) {
  if(!confirm('¿Eliminar este producto?')) return;
  
  try {
    await db.collection('products').doc(productId).delete();
    loadData();
  } catch (e) {
    console.error("Error:", e);
  }
}

async function updateOrderStatus(orderId, newStatus) {
  try {
    await db.collection('orders').doc(orderId).update({
      estado: newStatus
    });
    loadData();
  } catch (e) {
    console.error("Error:", e);
  }
}

function switchAdminTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
  event.target.classList.add('active');
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`${tab}View`).classList.add('active');
}

function showMessage(elementId, message, type) {
  const element = document.getElementById(elementId);
  element.textContent = message;
  element.className = `msg ${type}`;
  element.style.display = 'block';
  setTimeout(() => element.style.display = 'none', 3000);
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
