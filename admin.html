<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Admin Tony Tony">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<title>⚙️ Admin - Bodega Tony Tony</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f5f5f5;--card:#fff;--text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--oscuro);color:white;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,0.3);}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:var(--amarillo);}
.logo-text span{color:var(--rojo);}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;}
.tab-btn{padding:11px 14px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.view{display:none;padding:16px;}
.view.active{display:block;}
.admin-section{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,0.12);margin-bottom:16px;}
.admin-section h3{font-family:'Bebas Neue',sans-serif;font-size:20px;margin-bottom:14px;color:var(--text);border-left:4px solid var(--rojo);padding-left:10px;}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.form-row input,.form-row select{flex:1;min-width:120px;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--bg);color:var(--text);}
.btn-primary{background:var(--rojo);color:white;border:none;border-radius:10px;padding:10px 20px;font-weight:800;font-size:14px;cursor:pointer;}
.photo-upload{width:100%;height:100px;border:2px dashed #ddd;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;color:#999;font-size:13px;font-weight:700;overflow:hidden;margin-bottom:10px;}
.photo-upload img{width:100%;height:100%;object-fit:cover;}
.product-list-admin{display:flex;flex-direction:column;gap:10px;}
.product-item-admin{display:flex;align-items:center;gap:10px;background:var(--gris);border-radius:12px;padding:10px 14px;}
.product-item-admin .thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;}
.product-item-admin .pemoji{font-size:28px;}
.product-item-admin .info{flex:1;}
.del-btn{background:none;border:none;font-size:20px;cursor:pointer;color:var(--rojo);}
.pedido-card{background:var(--gris);border-radius:14px;padding:14px;margin-bottom:12px;}
.estado-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:50px;}
.estado-pendiente{background:#fff3cd;color:#856404;}
.estado-confirmado{background:#d4edda;color:#155724;}
.estado-preparacion{background:#cce5ff;color:#004085;}
.estado-camino{background:#ffe5d0;color:#c05621;}
.estado-entregado{background:#d4edda;color:#155724;}
.estado-cancelado{background:#ffd6d6;color:#e63946;}
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--oscuro);}
.lock-card{background:#1e1e2e;border-radius:24px;padding:30px 24px;text-align:center;max-width:300px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #555;background:transparent;}
.pin-dot.filled{background:var(--rojo);border-color:var(--rojo);}
.pin-key{background:#2a2a3e;color:white;border:none;border-radius:14px;padding:18px;font-weight:800;font-size:20px;cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;z-index:999;transition:transform 0.3s;}
.toast.show{transform:translateX(-50%) translateY(0);}
canvas{max-width:100%;margin:10px 0;}
.chart-container{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,0.12);margin-bottom:16px;}
.stat-card{background:var(--gris);border-radius:12px;padding:12px;text-align:center;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:22px;}
.stat-lbl{font-size:11px;color:var(--subtext);}
.variant-tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.variant-tag{background:var(--oscuro);color:white;border-radius:50px;padding:4px 10px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px;}
.variant-tag button{background:none;border:none;color:white;cursor:pointer;font-size:16px;padding:0;line-height:1;}
.toggle-switch{position:relative;width:44px;height:24px;display:inline-block;}
.toggle-switch input{opacity:0;width:0;height:0;}
.toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#ccc;border-radius:24px;transition:.3s;}
.toggle-slider:before{content:"";height:18px;width:18px;left:3px;bottom:3px;background:white;border-radius:50%;position:absolute;transition:.3s;}
input:checked+.toggle-slider{background:var(--verde);}
input:checked+.toggle-slider:before{transform:translateX(20px);}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <img src="logo.png" alt="Logo" style="width:100px;height:auto;margin-bottom:12px;" onerror="this.style.display='none'">
    <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:white;">ADMIN</div>
    <div style="font-size:16px;color:var(--rojo);margin-bottom:20px;">BODEGA TONY TONY</div>
    <div id="pinDisplay" style="display:flex;justify-content:center;gap:12px;margin-bottom:24px;">
      <div class="pin-dot" id="dot0"></div><div class="pin-dot" id="dot1"></div><div class="pin-dot" id="dot2"></div><div class="pin-dot" id="dot3"></div><div class="pin-dot" id="dot4"></div><div class="pin-dot" id="dot5"></div>
    </div>
    <p id="pinError" style="color:var(--rojo);font-size:13px;font-weight:700;margin-bottom:12px;min-height:20px;"></p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;">
      <button class="pin-key" onclick="pinPress('1')">1</button><button class="pin-key" onclick="pinPress('2')">2</button><button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button><button class="pin-key" onclick="pinPress('5')">5</button><button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button><button class="pin-key" onclick="pinPress('8')">8</button><button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key" onclick="pinClear()" style="background:#555;">⌫</button><button class="pin-key" onclick="pinPress('0')">0</button><button class="pin-key" onclick="checkPin()" style="background:var(--rojo);">✓</button>
    </div>
  </div>
</div>

<div id="adminPanel" style="display:none;">
  <header>
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="logo.png" alt="Logo" style="width:36px;height:36px;border-radius:6px;" onerror="this.style.display='none'">
      <div><div class="logo-text">Admin <span>Tony</span> Tony</div><div style="font-size:11px;color:#aaa;">Panel de Administración</div></div>
    </div>
    <button onclick="lockPanel()" style="background:var(--rojo);color:white;border:none;border-radius:50px;padding:8px 14px;font-weight:800;cursor:pointer;">🔒 Salir</button>
  </header>
  <div class="tabs">
    <button class="tab-btn active" onclick="showAdminTab('productos')">📦 Productos</button>
    <button class="tab-btn" onclick="showAdminTab('pedidos')">📋 Pedidos</button>
    <button class="tab-btn" onclick="showAdminTab('config')">⚙️ Config</button>
  </div>

  <div class="view active" id="view-productos">
    <div class="admin-section"><h3>➕ Agregar Producto</h3>
      <label for="newPhoto" style="cursor:pointer;display:block;margin-bottom:10px;">
        <div class="photo-upload" id="photoPreview"><span style="font-size:30px;">📸</span><span>Toca para agregar foto</span></div>
        <input type="file" id="newPhoto" accept="image/*" style="display:none;" onchange="previewPhoto(this)">
      </label>
      <div class="form-row"><input type="text" id="newEmoji" placeholder="Emoji" maxlength="4" style="max-width:80px;text-align:center;font-size:20px;"><input type="text" id="newName" placeholder="Nombre del producto"></div>
      <div class="form-row"><input type="number" id="newPrice" placeholder="Precio ($)" min="0" step="0.01"><input type="text" id="newCategory" placeholder="Categoría"></div>
      <div class="form-row"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="newOferta">🔥 Oferta</label><input type="number" id="newPrecioAnterior" placeholder="Precio anterior" style="flex:1;"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;"><input type="checkbox" id="newVisible" checked>👁️ Visible</label></div>
      <div class="form-row"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="newAgotado">❌ Agotado</label><input type="number" id="newStock" placeholder="Stock" style="flex:1;"></div>
      <div style="margin-bottom:10px;"><label style="font-size:13px;font-weight:700;">🎨 Variantes</label><div class="variant-tags" id="variantTags"></div><div style="display:flex;gap:8px;"><input type="text" id="variantInput" placeholder="ej: Cola, Uva..." style="flex:1;padding:8px 12px;border:2px solid var(--border);border-radius:10px;font-size:13px;background:var(--bg);color:var(--text);"><button onclick="addVariantTag()" style="background:var(--oscuro);color:white;border:none;border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;">+</button></div></div>
      <button class="btn-primary" onclick="addProduct()" style="width:100%;">✅ Agregar Producto</button>
    </div>
    <div class="admin-section"><h3>📦 Mis Productos</h3><input type="text" id="adminSearch" placeholder="🔍 Buscar..." oninput="renderProductList()" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);margin-bottom:10px;"><div class="product-list-admin" id="adminProductList"></div></div>
    <div style="text-align:center;padding-bottom:20px;"><button onclick="cargarInventario()" style="background:var(--rojo);color:white;border:none;border-radius:12px;padding:12px 24px;font-weight:800;font-size:15px;cursor:pointer;">📦 Cargar 30 productos con variantes</button></div>
  </div>

  <div class="view" id="view-pedidos">
    <div class="admin-section"><h3>📋 Pedidos</h3><div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;"><button onclick="filterPedidos('todos')" class="btn-primary" style="font-size:12px;padding:6px 12px;border-radius:50px;">Todos</button><button onclick="filterPedidos('pendiente')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">⏳ Pendientes</button><button onclick="filterPedidos('confirmado')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">✅ Confirmados</button><button onclick="filterPedidos('preparacion')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">🍳 Preparando</button><button onclick="filterPedidos('camino')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">🛵 En camino</button><button onclick="filterPedidos('entregado')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">📦 Entregados</button></div><div id="pedidosList">Cargando...</div></div>
  </div>

  <div class="view" id="view-config">
    <div class="admin-section"><h3>📱 Pago Móvil</h3><div class="form-row"><input type="text" id="pmBanco" placeholder="Banco"><input type="text" id="pmNombre" placeholder="Nombre"></div><div class="form-row"><input type="text" id="pmCedula" placeholder="Cédula"><input type="tel" id="pmTelefono" placeholder="Teléfono"></div><button class="btn-primary" onclick="savePagoMovil()" style="width:100%;">💾 Guardar Pago Móvil</button></div>
    <div class="admin-section"><h3>🏦 Transferencia</h3><div class="form-row"><input type="text" id="trBanco" placeholder="Banco"><input type="text" id="trNombre" placeholder="Nombre"></div><div class="form-row"><input type="text" id="trCuenta" placeholder="Cuenta"></div><button class="btn-primary" onclick="saveTransferencia()" style="width:100%;">💾 Guardar Transferencia</button></div>
    <div class="admin-section"><h3>📱 WhatsApp</h3><div class="form-row"><input type="tel" id="configWhatsapp" placeholder="+58424..."><button class="btn-primary" onclick="saveWhatsapp()">Guardar</button></div></div>
    <div class="admin-section"><h3>⏱️ Tiempo Preparación</h3><div class="form-row"><input type="number" id="configTiempo" placeholder="Minutos"><button class="btn-primary" onclick="saveTiempo()">Guardar</button></div></div>
    <div class="admin-section"><h3>💰 Pedido Mínimo</h3><div class="form-row"><input type="number" id="configPedidoMinimo" placeholder="$"><button class="btn-primary" onclick="savePedidoMinimo()">Guardar</button></div></div>
    <div class="admin-section"><h3>🛵 Envío</h3><div class="form-row"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;"><input type="checkbox" id="envioGratis" onchange="saveEnvioGratis()"> Domicilio gratis</label><input type="number" id="configMontoEnvio" placeholder="Monto envío gratis"><button class="btn-primary" onclick="saveMontoEnvio()">Guardar</button></div></div>
    <div class="admin-section"><h3>🕐 Horario</h3><div class="form-row"><input type="number" id="configApertura" placeholder="Apertura (0-23)"><input type="number" id="configCierre" placeholder="Cierre (0-23)"><button class="btn-primary" onclick="saveHorario()">Guardar</button></div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",authDomain:"bodegatonytony.firebaseapp.com",projectId:"bodegatonytony",storageBucket:"bodegatonytony.firebasestorage.app",messagingSenderId:"763208241886",appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"});
const db=firebase.firestore();

const ADMIN_PIN='300419';
let pinEntered='';
let products=[],allPedidos=[],configData={whatsapp:'+584242520138',envioGratis:true,pedidoMinimo:0,tiempoPreparacion:30,pagoMovil:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cedula:'6.966.714',telefono:'04241572275'},transferencia:{banco:'Banco del Tesoro',nombre:'Lisbe Ovalle',cuenta:''}};
let pedidosFiltro='todos',currentVariants=[],pendingPhotoBase64='';

function pinPress(d){if(pinEntered.length>=6)return;pinEntered+=d;updateDots();if(pinEntered.length===6)checkPin();}
function pinClear(){pinEntered=pinEntered.slice(0,-1);updateDots();}
function updateDots(){for(let i=0;i<6;i++){document.getElementById('dot'+i).classList.toggle('filled',i<pinEntered.length);}}
function checkPin(){if(pinEntered===ADMIN_PIN){document.getElementById('lockScreen').style.display='none';document.getElementById('adminPanel').style.display='block';pinEntered='';updateDots();initAdmin();}else{document.getElementById('pinError').textContent='❌ PIN incorrecto';pinEntered='';updateDots();}}
function lockPanel(){document.getElementById('lockScreen').style.display='flex';document.getElementById('adminPanel').style.display='none';}

function initAdmin(){
  db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));renderProductList();});
  db.collection('pedidos').orderBy('fecha','desc').limit(50).onSnapshot(snap=>{allPedidos=snap.docs.map(d=>({id:d.id,...d.data()}));renderPedidos();});
  db.collection('config').doc('tienda').get().then(snap=>{if(snap.exists){configData={...configData,...snap.data()};fillConfig();}});
}

function fillConfig(){
  if(document.getElementById('configWhatsapp'))document.getElementById('configWhatsapp').value=configData.whatsapp||'';
  if(document.getElementById('envioGratis'))document.getElementById('envioGratis').checked=configData.envioGratis!==false;
  if(document.getElementById('configTiempo'))document.getElementById('configTiempo').value=configData.tiempoPreparacion||30;
  if(document.getElementById('configPedidoMinimo'))document.getElementById('configPedidoMinimo').value=configData.pedidoMinimo||0;
  if(configData.pagoMovil){
    if(document.getElementById('pmBanco'))document.getElementById('pmBanco').value=configData.pagoMovil.banco||'';
    if(document.getElementById('pmNombre'))document.getElementById('pmNombre').value=configData.pagoMovil.nombre||'';
    if(document.getElementById('pmCedula'))document.getElementById('pmCedula').value=configData.pagoMovil.cedula||'';
    if(document.getElementById('pmTelefono'))document.getElementById('pmTelefono').value=configData.pagoMovil.telefono||'';
  }
  if(configData.transferencia){
    if(document.getElementById('trBanco'))document.getElementById('trBanco').value=configData.transferencia.banco||'';
    if(document.getElementById('trNombre'))document.getElementById('trNombre').value=configData.transferencia.nombre||'';
    if(document.getElementById('trCuenta'))document.getElementById('trCuenta').value=configData.transferencia.cuenta||'';
  }
  if(configData.horario){
    if(document.getElementById('configApertura'))document.getElementById('configApertura').value=configData.horario.apertura;
    if(document.getElementById('configCierre'))document.getElementById('configCierre').value=configData.horario.cierre;
  }
}

function showAdminTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
}

function previewPhoto(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();img.onload=()=>{
      const canvas=document.createElement('canvas');const MAX=400;
      let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=h*MAX/w;w=MAX;}}else{if(h>MAX){w=w*MAX/h;h=MAX;}}
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      pendingPhotoBase64=canvas.toDataURL('image/jpeg',0.7);
      document.getElementById('photoPreview').innerHTML=`<img src="${pendingPhotoBase64}" style="width:100%;height:100%;object-fit:cover;">`;
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function addVariantTag(){
  const v=document.getElementById('variantInput').value.trim();
  if(!v||currentVariants.includes(v))return;
  currentVariants.push(v);renderVariantTags();
  document.getElementById('variantInput').value='';
}
function renderVariantTags(){
  document.getElementById('variantTags').innerHTML=currentVariants.map(v=>
    `<div class="variant-tag">${v}<button onclick="removeVariantTag('${v}')">×</button></div>`).join('');
}
function removeVariantTag(v){currentVariants=currentVariants.filter(x=>x!==v);renderVariantTags();}

async function addProduct(){
  const name=document.getElementById('newName').value.trim();
  const price=parseFloat(document.getElementById('newPrice').value);
  const category=document.getElementById('newCategory').value.trim()||'General';
  const emoji=document.getElementById('newEmoji').value.trim()||'📦';
  const oferta=document.getElementById('newOferta').checked||false;
  const precioAnterior=parseFloat(document.getElementById('newPrecioAnterior').value)||0;
  const visible=document.getElementById('newVisible').checked!==false;
  const agotado=document.getElementById('newAgotado').checked||false;
  const stockVal=document.getElementById('newStock').value;
  const stock=stockVal!==''?parseInt(stockVal):null;

  if(!name||isNaN(price)||price<=0){showToast('⚠️ Completa nombre y precio válido');return;}

  try{
    await db.collection('productos').add({
      emoji,name,price,category,photo:pendingPhotoBase64,
      variants:[...currentVariants],oferta,
      precioAnterior:oferta&&precioAnterior?precioAnterior:0,
      visible,agotado,stock,etiqueta:'',tipo:'normal'
    });
    ['newEmoji','newName','newPrice','newCategory','newPrecioAnterior','newStock'].forEach(id=>{
      document.getElementById(id).value='';
    });
    document.getElementById('newOferta').checked=false;
    document.getElementById('newAgotado').checked=false;
    document.getElementById('variantInput').value='';
    currentVariants=[];renderVariantTags();
    pendingPhotoBase64='';
    document.getElementById('photoPreview').innerHTML='<span style="font-size:30px;">📸</span><span>Toca para agregar foto</span>';
    showToast('✅ Producto agregado correctamente');
  }catch(e){
    console.error('Error:',e);
    showToast('❌ Error al agregar: '+e.message);
  }
}

async function deleteProduct(id){
  if(!confirm('¿Eliminar este producto?'))return;
  await db.collection('productos').doc(id).delete();
  showToast('🗑️ Eliminado');
}

async function toggleAgotado(id,a){
  await db.collection('productos').doc(id).update({agotado:!a});
  showToast(!a?'❌ Agotado':'✅ Disponible');
}

function renderProductList(){
  const el=document.getElementById('adminProductList');
  if(!el)return;
  const q=(document.getElementById('adminSearch')?.value||'').toLowerCase();
  const filtered=q?products.filter(p=>p.name.toLowerCase().includes(q)):products;
  if(!filtered.length){el.innerHTML='<p style="color:var(--subtext);text-align:center;">No hay productos</p>';return;}
  el.innerHTML=filtered.map(p=>`<div class="product-item-admin">
    ${p.photo?`<img src="${p.photo}" class="thumb">`:`<div class="pemoji">${p.emoji||'📦'}</div>`}
    <div class="info">
      <div style="font-weight:700;">${p.name}${p.agotado?' ❌':''}${p.variants&&p.variants.length?' — '+p.variants.join(', '):''}</div>
      <div style="font-size:12px;color:var(--subtext);">${p.category||'General'} — $${p.price}${p.oferta?' 🔥':''}</div>
    </div>
    <button onclick="toggleAgotado('${p.id}',${!!p.agotado})" style="background:none;border:none;font-size:18px;cursor:pointer;">${p.agotado?'🔴':'🟢'}</button>
    <button class="del-btn" onclick="deleteProduct('${p.id}')">🗑️</button>
  </div>`).join('');
}

function filterPedidos(e){pedidosFiltro=e;renderPedidos();}
function renderPedidos(){
  const el=document.getElementById('pedidosList');if(!el)return;
  const filtered=pedidosFiltro==='todos'?allPedidos:allPedidos.filter(p=>p.estado===pedidosFiltro);
  if(!filtered.length){el.innerHTML='<p style="color:var(--subtext);text-align:center;">No hay pedidos</p>';return;}
  const ei={pendiente:{l:'⏳ Pendiente',c:'estado-pendiente'},confirmado:{l:'✅ Confirmado',c:'estado-confirmado'},preparacion:{l:'🍳 Preparando',c:'estado-preparacion'},camino:{l:'🛵 En camino',c:'estado-camino'},entregado:{l:'📦 Entregado',c:'estado-entregado'},cancelado:{l:'❌ Cancelado',c:'estado-cancelado'}};
  el.innerHTML=filtered.map(p=>`<div class="pedido-card">
    <div style="display:flex;justify-content:space-between;"><div><div style="font-weight:800;">👤 ${p.nombre}</div><div style="font-size:12px;color:var(--subtext);">📞 ${p.telefono} · 📌 ${p.direccion||'—'}</div></div><span class="estado-badge ${ei[p.estado]?.c||'estado-pendiente'}">${ei[p.estado]?.l||p.estado}</span></div>
    <div style="font-size:13px;white-space:pre-line;margin:6px 0;">${p.productos}</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--rojo);">$ ${p.total?.toFixed(2)||'0.00'}</div>
    <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;">
      <button onclick="updateEstado('${p.id}','confirmado')" style="background:#2dc653;color:white;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">✅ Confirmar</button>
      <button onclick="updateEstado('${p.id}','preparacion')" style="background:#007bff;color:white;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">🍳 Preparando</button>
      <button onclick="updateEstado('${p.id}','camino')" style="background:#ff6b2b;color:white;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">🛵 En camino</button>
      <button onclick="updateEstado('${p.id}','entregado')" style="background:#1565c0;color:white;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">📦 Entregado</button>
    </div></div>`).join('');
}

async function updateEstado(id,estado){
  await db.collection('pedidos').doc(id).update({estado});
  showToast('✅ Actualizado');
  const p=allPedidos.find(x=>x.id===id);
  if(p&&p.telefono){
    const msgs={confirmado:'✅ ¡Tu pedido fue CONFIRMADO!',preparacion:'🍳 ¡Tu pedido está en PREPARACIÓN!',camino:'🛵 ¡Tu pedido está EN CAMINO!',entregado:'📦 ¡Pedido ENTREGADO! Gracias 🙏'};
    if(msgs[estado]){
      let tel=p.telefono.replace(/\s+/g,'');
      if(!tel.startsWith('+')){tel=tel.replace(/^0+/,'');tel='+58'+tel;}
      window.open(`https://wa.me/${tel.replace(/[^0-9+]/g,'')}?text=${encodeURIComponent('🛒 *Bodega Tony Tony*\n\n'+msgs[estado])}`,'_blank');
    }
  }
}

async function savePagoMovil(){
  const b=document.getElementById('pmBanco').value.trim();
  const n=document.getElementById('pmNombre').value.trim();
  const c=document.getElementById('pmCedula').value.trim();
  const t=document.getElementById('pmTelefono').value.trim();
  if(!b||!n||!t){showToast('⚠️ Completa banco, nombre y teléfono');return;}
  await db.collection('config').doc('tienda').set({pagoMovil:{banco:b,nombre:n,cedula:c,telefono:t}},{merge:true});
  showToast('✅ Pago Móvil guardado');
}
async function saveTransferencia(){
  const b=document.getElementById('trBanco').value.trim();
  const n=document.getElementById('trNombre').value.trim();
  const c=document.getElementById('trCuenta').value.trim();
  if(!b||!n){showToast('⚠️ Completa banco y nombre');return;}
  await db.collection('config').doc('tienda').set({transferencia:{banco:b,nombre:n,cuenta:c}},{merge:true});
  showToast('✅ Transferencia guardada');
}

  await db.collection('config').doc('tienda').set({whatsapp:w},{merge:true});
  showToast('✅ WhatsApp: '+w);
}
async function saveEnvioGratis(){
  const v=document.getElementById('envioGratis').checked;

  const v=parseInt(document.getElementById('configTiempo').value);

  await db.collection('config').doc('tienda').set({tiempoPreparacion:v},{merge:true});
  showToast('✅ Guardado');
}
async function savePedidoMinimo(){
  const v=parseFloat(document.getElementById('configPedidoMinimo').value);
  if(isNaN(v)||v<0){showToast('⚠️ Inválido');return;}
  await db.collection('config').doc('tienda').set({pedidoMinimo:v},{merge:true});
  showToast('✅ Guardado');
}
async function saveMontoEnvio(){
  const v=parseFloat(document.getElementById('configMontoEnvio').value)||0;
  await db.collection('config').doc('tienda').set({montoEnvioGratis:v},{merge:true});
  showToast('✅ Guardado');

async function saveHorario(){
  const a=parseInt(document.getElementById('configApertura').value);
  const c=parseInt(document.getElementById('configCierre').value);
  if(isNaN(a)||isNaN(c)){showToast('⚠️ Ingresa valores');return;}
  await db.collection('config').doc('tienda').set({horario:{apertura:a,cierre:c}},{merge:true});
  showToast('✅ Guardado');
}
