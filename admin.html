<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>Admin - Bodega Tony Tony</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f5f5f5;--card:#fff;--text:#1a1a2e;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--oscuro);}
.lock-card{background:#1e1e2e;border-radius:24px;padding:30px 24px;text-align:center;max-width:300px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #555;background:transparent;display:inline-block;margin:0 6px;}
.pin-dot.filled{background:var(--rojo);border-color:var(--rojo);}
.pin-key{background:#2a2a3e;color:white;border:none;border-radius:14px;padding:18px;font-weight:800;font-size:20px;cursor:pointer;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;z-index:999;}
header{background:var(--oscuro);color:white;padding:16px 20px;display:flex;justify-content:space-between;position:sticky;top:0;}
.btn-primary{background:var(--rojo);color:white;border:none;border-radius:10px;padding:10px 20px;font-weight:800;cursor:pointer;}
.admin-section{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 4px 20px rgba(0,0,0,0.12);}
.form-row{display:flex;gap:10px;margin-bottom:10px;}
.form-row input{flex:1;padding:10px;border:2px solid #eee;border-radius:10px;}
.view{display:none;padding:16px;}
.view.active{display:block;}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;}
.tab-btn{padding:11px 14px;border:none;background:transparent;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div style="font-size:50px;margin-bottom:12px;">🔐</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;color:white;">ADMIN</div>
    <div style="font-size:16px;color:var(--rojo);margin-bottom:20px;">BODEGA TONY TONY</div>
    <div id="pinDisplay" style="margin-bottom:24px;">
      <span class="pin-dot" id="dot0"></span><span class="pin-dot" id="dot1"></span><span class="pin-dot" id="dot2"></span><span class="pin-dot" id="dot3"></span><span class="pin-dot" id="dot4"></span><span class="pin-dot" id="dot5"></span>
    </div>
    <p id="pinError" style="color:var(--rojo);font-size:13px;min-height:20px;"></p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;">
      <button class="pin-key" onclick="pinPress('1')">1</button><button class="pin-key" onclick="pinPress('2')">2</button><button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button><button class="pin-key" onclick="pinPress('5')">5</button><button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button><button class="pin-key" onclick="pinPress('8')">8</button><button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key" onclick="pinClear()" style="background:#555;">⌫</button><button class="pin-key" onclick="pinPress('0')">0</button><button class="pin-key" onclick="checkPin()" style="background:var(--rojo);">✓</button>
    </div>
  </div>
</div>

<div id="adminPanel" style="display:none;">
  <header>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--amarillo);">Admin <span style="color:var(--rojo);">Tony</span> Tony</div>
    <button onclick="lockPanel()" style="background:var(--rojo);color:white;border:none;border-radius:50px;padding:8px 14px;font-weight:800;cursor:pointer;">Salir</button>
  </header>
  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('productos')">Productos</button>
    <button class="tab-btn" onclick="showTab('pedidos')">Pedidos</button>
    <button class="tab-btn" onclick="showTab('config')">Config</button>
  </div>

  <div class="view active" id="view-productos">
    <div class="admin-section">
      <h3 style="font-family:'Bebas Neue',sans-serif;">Agregar Producto</h3>
      <div class="form-row"><input type="text" id="newName" placeholder="Nombre"><input type="number" id="newPrice" placeholder="Precio" step="0.01"></div>
      <div class="form-row"><input type="text" id="newCategory" placeholder="Categoría"><input type="text" id="newEmoji" placeholder="Emoji" maxlength="4"></div>
      <button class="btn-primary" onclick="addProduct()" style="width:100%;">Agregar</button>
    </div>
    <div class="admin-section"><h3>Productos</h3><div id="productList"></div></div>
    <button onclick="cargarInventario()" style="width:100%;padding:12px;border:2px solid #eee;border-radius:12px;background:transparent;font-weight:700;cursor:pointer;">📦 Cargar inventario inicial</button>
  </div>

  <div class="view" id="view-pedidos"><div class="admin-section"><h3>Pedidos</h3><div id="pedidosList">Cargando...</div></div></div>
  <div class="view" id="view-config"><div class="admin-section"><h3>WhatsApp</h3><div class="form-row"><input type="tel" id="configWhatsapp" placeholder="+58424..."><button class="btn-primary" onclick="saveWhatsapp()">Guardar</button></div></div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const ADMIN_PIN = '300419';
let pinEntered = '';

firebase.initializeApp({apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",authDomain:"bodegatonytony.firebaseapp.com",projectId:"bodegatonytony",storageBucket:"bodegatonytony.firebasestorage.app",messagingSenderId:"763208241886",appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"});
const db = firebase.firestore();
let products = [], allPedidos = [], config = {whatsapp:'+584242520138'};

function pinPress(d){if(pinEntered.length>=6)return;pinEntered+=d;updateDots();if(pinEntered.length===6)setTimeout(checkPin,300);}
function pinClear(){pinEntered=pinEntered.slice(0,-1);updateDots();}
function updateDots(){for(let i=0;i<6;i++){document.getElementById('dot'+i).classList.toggle('filled',i<pinEntered.length);}}
function checkPin(){
  if(pinEntered===ADMIN_PIN){
    document.getElementById('lockScreen').style.display='none';
    document.getElementById('adminPanel').style.display='block';
    pinEntered='';updateDots();init();
  }else{
    document.getElementById('pinError').textContent='PIN incorrecto';
    pinEntered='';updateDots();
    setTimeout(()=>document.getElementById('pinError').textContent='',2000);
  }
}
function lockPanel(){document.getElementById('lockScreen').style.display='flex';document.getElementById('adminPanel').style.display='none';}

function init(){
  db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));renderProducts();});
  db.collection('pedidos').orderBy('fecha','desc').limit(50).onSnapshot(snap=>{allPedidos=snap.docs.map(d=>({id:d.id,...d.data()}));renderPedidos();});
  db.collection('config').doc('tienda').get().then(snap=>{if(snap.exists&&snap.data().whatsapp){config.whatsapp=snap.data().whatsapp;const el=document.getElementById('configWhatsapp');if(el)el.value=config.whatsapp;}});
}

function showTab(t){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+t).classList.add('active');
  document.getElementById('tab-'+t).classList.add('active');
}

async function addProduct(){
  const n=document.getElementById('newName').value.trim();
  const p=parseFloat(document.getElementById('newPrice').value);
  const c=document.getElementById('newCategory').value.trim()||'General';
  const e=document.getElementById('newEmoji').value.trim()||'📦';
  if(!n||isNaN(p)){showToast('Completa nombre y precio');return;}
  await db.collection('productos').add({name:n,price:p,category:c,emoji:e,visible:true,agotado:false,variants:[],photo:''});
  document.getElementById('newName').value='';document.getElementById('newPrice').value='';
  showToast('Producto agregado');
}

function renderProducts(){
  const el=document.getElementById('productList');
  if(!products.length){el.innerHTML='<p style="text-align:center;color:#888;">No hay productos</p>';return;}
  el.innerHTML=products.map(p=>`<div style="display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee;"><span>${p.emoji||'📦'} ${p.name} - $${p.price}</span><button onclick="deleteProduct('${p.id}')" style="background:none;border:none;cursor:pointer;">🗑️</button></div>`).join('');
}
async function deleteProduct(id){if(confirm('Eliminar?')){await db.collection('productos').doc(id).delete();showToast('Eliminado');}}

function renderPedidos(){
  const el=document.getElementById('pedidosList');
  if(!allPedidos.length){el.innerHTML='<p style="text-align:center;color:#888;">No hay pedidos</p>';return;}
  el.innerHTML=allPedidos.map(p=>`<div style="background:#f1f1f1;border-radius:12px;padding:12px;margin-bottom:8px;"><div style="font-weight:700;">${p.nombre} - ${p.telefono}</div><div style="font-size:13px;white-space:pre-line;">${p.productos}</div><div style="font-weight:700;color:var(--rojo);">$ ${p.total?.toFixed(2)||'0.00'}</div><div style="font-size:11px;color:#888;">${p.estado||'pendiente'}</div></div>`).join('');
}

async function saveWhatsapp(){const w=document.getElementById('configWhatsapp').value.trim();if(w){await db.collection('config').doc('tienda').set({whatsapp:w},{merge:true});showToast('Guardado');}}

async function cargarInventario(){
  if(!confirm('Cargar 13 productos?'))return;
  const inv=[{emoji:'🧻',name:'Papel Higiénico',price:0.70,category:'Higiene'},{emoji:'🌽',name:'Harina Pan 1K',price:1.80,category:'Víveres'},{emoji:'🍚',name:'Arroz 900G',price:1.60,category:'Víveres'},{emoji:'☕',name:'Café 200G',price:2.70,category:'Víveres'},{emoji:'🥤',name:'Glup',price:1.50,category:'Refrescos',variants:['Cola 2L','Kolita 2L','Uva 2L']},{emoji:'🧀',name:'Queso Duro',price:4.50,category:'Frescos'},{emoji:'🧴',name:'Desodorante',price:0.80,category:'Higiene'},{emoji:'🦷',name:'Crema Dental',price:0.80,category:'Higiene'},{emoji:'🍬',name:'Boka',price:0.40,category:'Dulces',variants:['Parchita','Salpicón','Limón','Naranja']},{emoji:'💡',name:'Bombillo LED',price:1.10,category:'Varios'},{emoji:'🧂',name:'Sal Perlamar 1K',price:0.80,category:'Víveres'},{emoji:'🍾',name:'Vinagre 500ML',price:0.60,category:'Víveres'},{emoji:'🍞',name:'Pan',price:1.00,category:'Panadería'}];
  for(const p of inv){await db.collection('productos').add({...p,photo:'',visible:true,agotado:false,variants:p.variants||[]});}
  showToast('13 productos cargados');
}

function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.style.transform='translateX(-50%) translateY(0)';setTimeout(()=>{t.style.transform='translateX(-50%) translateY(80px)';},2000);}
</script>
</body>
</html>
