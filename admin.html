<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>⚙️ Admin - Bodega Tony Tony</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f5f5f5;--card:#fff;--text:#1a1a2e;--subtext:#666;--border:#eee;--gris:#f1f1f1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--oscuro);color:#fff;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--amarillo);}
.logo span{color:var(--rojo);}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;}
.tab-btn{padding:11px 14px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.view{display:none;padding:16px;}
.view.active{display:block;}
.admin-section{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 4px 20px rgba(0,0,0,0.12);margin-bottom:16px;}
.admin-section h3{font-family:'Bebas Neue',sans-serif;font-size:20px;margin-bottom:14px;border-left:4px solid var(--rojo);padding-left:10px;}
.form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.form-row input,.form-row select{flex:1;min-width:120px;padding:10px 14px;border:2px solid var(--border);border-radius:10px;font-size:14px;outline:none;background:var(--bg);color:var(--text);}
.btn-primary{background:var(--rojo);color:#fff;border:none;border-radius:10px;padding:10px 20px;font-weight:800;font-size:14px;cursor:pointer;}
.product-item-admin{display:flex;align-items:center;gap:10px;background:var(--gris);border-radius:12px;padding:10px 14px;margin-bottom:8px;}
.pedido-card{background:var(--gris);border-radius:14px;padding:14px;margin-bottom:12px;}
.estado-badge{font-size:11px;font-weight:800;padding:4px 10px;border-radius:50px;}
.estado-pendiente{background:#fff3cd;color:#856404;}
.estado-confirmado{background:#d4edda;color:#155724;}
.estado-entregado{background:#d4edda;color:#155724;}
.lock-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--oscuro);}
.lock-card{background:#1e1e2e;border-radius:24px;padding:30px 24px;text-align:center;max-width:300px;width:100%;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid #555;background:transparent;}
.pin-dot.filled{background:var(--rojo);border-color:var(--rojo);}
.pin-key{background:#2a2a3e;color:#fff;border:none;border-radius:14px;padding:18px;font-weight:800;font-size:20px;cursor:pointer;}
.pin-key:active{background:var(--rojo);}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:#fff;padding:12px 24px;border-radius:50px;font-weight:700;font-size:14px;z-index:999;transition:transform 0.3s;box-shadow:0 8px 24px rgba(0,0,0,0.3);}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="lock-screen" id="lockScreen">
  <div class="lock-card">
    <div style="font-size:50px;margin-bottom:12px;">🔐</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;color:#fff;">ADMIN</div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:16px;color:var(--rojo);margin-bottom:20px;">BODEGA TONY TONY</div>
    <div style="display:flex;justify-content:center;gap:12px;margin-bottom:24px;" id="pinDisplay">
      <div class="pin-dot" id="dot0"></div><div class="pin-dot" id="dot1"></div><div class="pin-dot" id="dot2"></div><div class="pin-dot" id="dot3"></div><div class="pin-dot" id="dot4"></div><div class="pin-dot" id="dot5"></div>
    </div>
    <p id="pinError" style="color:var(--rojo);font-size:13px;font-weight:700;margin-bottom:12px;min-height:20px;"></p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto;">
      <button class="pin-key" onclick="pinPress('1')">1</button><button class="pin-key" onclick="pinPress('2')">2</button><button class="pin-key" onclick="pinPress('3')">3</button>
      <button class="pin-key" onclick="pinPress('4')">4</button><button class="pin-key" onclick="pinPress('5')">5</button><button class="pin-key" onclick="pinPress('6')">6</button>
      <button class="pin-key" onclick="pinPress('7')">7</button><button class="pin-key" onclick="pinPress('8')">8</button><button class="pin-key" onclick="pinPress('9')">9</button>
      <button class="pin-key" onclick="pinClear()" style="background:#555;">⌫</button><button class="pin-key" onclick="pinPress('0')">0</button><button class="pin-key" onclick="checkPin()" style="background:var(--rojo);">✓</button>
    </div>
  </div>
</div>

<div id="adminPanel" style="display:none;">
  <header>
    <div><div class="logo">Admin <span>Tony</span> Tony</div><div style="font-size:11px;color:#aaa;">Panel de Administración</div></div>
    <button onclick="lockPanel()" style="background:var(--rojo);color:#fff;border:none;border-radius:50px;padding:8px 14px;font-weight:800;cursor:pointer;">🔒 Salir</button>
  </header>
  <div class="tabs">
    <button class="tab-btn active" onclick="showAdminTab('productos')">📦 Productos</button>
    <button class="tab-btn" onclick="showAdminTab('pedidos')">📋 Pedidos</button>
    <button class="tab-btn" onclick="showAdminTab('config')">⚙️ Config</button>
  </div>

  <div class="view active" id="view-productos">
    <div class="admin-section">
      <h3>➕ Agregar Producto</h3>
      <div class="form-row">
        <input type="text" id="newEmoji" placeholder="Emoji 🍎" maxlength="4" style="max-width:80px;text-align:center;font-size:20px;">
        <input type="text" id="newName" placeholder="Nombre del producto">
      </div>
      <div class="form-row">
        <input type="number" id="newPrice" placeholder="Precio ($)" min="0" step="0.01">
        <input type="text" id="newCategory" placeholder="Categoría">
      </div>
      <div class="form-row">
        <label><input type="checkbox" id="newOferta">🔥 Es oferta</label>
        <input type="number" id="newPrecioAnterior" placeholder="Precio anterior" min="0" step="0.01">
        <label><input type="checkbox" id="newVisible" checked>👁️ Visible</label>
        <label><input type="checkbox" id="newAgotado">❌ Agotado</label>
      </div>
      <button class="btn-primary" onclick="addProduct()" style="width:100%;">✅ Agregar Producto</button>
    </div>
    <div class="admin-section">
      <h3>📦 Mis Productos</h3>
      <div style="margin-bottom:10px;"><input type="text" id="adminSearch" placeholder="🔍 Buscar..." oninput="renderProductList()" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);"></div>
      <div id="adminProductList"></div>
    </div>
  </div>

  <div class="view" id="view-pedidos">
    <div class="admin-section">
      <h3>📋 Pedidos</h3>
      <div style="display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;">
        <button onclick="filterPedidos('todos')" class="btn-primary" style="font-size:12px;padding:6px 12px;border-radius:50px;">Todos</button>
        <button onclick="filterPedidos('pendiente')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">⏳ Pendientes</button>
        <button onclick="filterPedidos('confirmado')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">✅ Confirmados</button>
        <button onclick="filterPedidos('entregado')" style="background:var(--gris);border:none;border-radius:50px;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer;color:var(--text);">📦 Entregados</button>
      </div>
      <div id="pedidosList">Cargando...</div>
    </div>
  </div>

  <div class="view" id="view-config">
    <div class="admin-section">
      <h3>📱 WhatsApp</h3>
      <div class="form-row"><input type="tel" id="configWhatsapp" placeholder="+58424..."><button class="btn-primary" onclick="saveWhatsapp()">Guardar</button></div>
    </div>
    <div class="admin-section">
      <h3>💰 Pedido Mínimo</h3>
      <div class="form-row"><input type="number" id="configPedidoMinimo" placeholder="ej: 3.00" min="0" step="0.5"><button class="btn-primary" onclick="savePedidoMinimo()">Guardar</button></div>
    </div>
    <div class="admin-section">
      <h3>⏱️ Tiempo Preparación</h3>
      <div class="form-row"><input type="number" id="configTiempo" placeholder="ej: 30" min="1"><button class="btn-primary" onclick="saveTiempo()">Guardar</button></div>
    </div>
    <button onclick="cargarInventario()" style="background:none;border:2px solid var(--border);border-radius:12px;padding:10px 20px;font-weight:700;cursor:pointer;color:var(--subtext);margin-top:10px;">📦 Cargar inventario inicial</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyBdv2cOMgbeBuW-V9Buz8EzGAoElnvySoI",
  authDomain:"bodegatonytony.firebaseapp.com",
  projectId:"bodegatonytony",
  storageBucket:"bodegatonytony.firebasestorage.app",
  messagingSenderId:"763208241886",
  appId:"1:763208241886:web:dd4a04d68c2c72ed24a84f"
});
const db = firebase.firestore();

let products=[], allPedidos=[], pedidosFiltro='todos', pinEntered='', adminPin='';

async function loadAdminPin(){
  try{const snap=await db.collection('config').doc('seguridad').get();adminPin=snap.exists?snap.data().adminPin:'300419';}
  catch(e){adminPin='300419';}
}
loadAdminPin();

function pinPress(d){if(pinEntered.length>=6)return;pinEntered+=d;updatePinDots();if(pinEntered.length===6)setTimeout(checkPin,200);}
function pinClear(){pinEntered=pinEntered.slice(0,-1);updatePinDots();}
function updatePinDots(){for(let i=0;i<6;i++){const d=document.getElementById('dot'+i);if(d)d.classList.toggle('filled',i<pinEntered.length);}}
async function checkPin(){
  if(!adminPin){document.getElementById('pinError').textContent='⏳ Verificando...';return;}
  if(pinEntered===adminPin){document.getElementById('lockScreen').style.display='none';document.getElementById('adminPanel').style.display='block';pinEntered='';updatePinDots();initAdmin();}
  else{document.getElementById('pinError').textContent='❌ PIN incorrecto';pinEntered='';updatePinDots();setTimeout(()=>document.getElementById('pinError').textContent='',2000);}
}
function lockPanel(){document.getElementById('lockScreen').style.display='flex';document.getElementById('adminPanel').style.display='none';pinEntered='';updatePinDots();}

function initAdmin(){
  db.collection('productos').onSnapshot(snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));renderProductList();});
  db.collection('pedidos').orderBy('fecha','desc').limit(100).onSnapshot(snap=>{allPedidos=snap.docs.map(d=>({id:d.id,...d.data()}));renderPedidos();});
  db.collection('config').doc('tienda').onSnapshot(snap=>{if(snap.exists){const d=snap.data();if(document.getElementById('configWhatsapp'))document.getElementById('configWhatsapp').value=d.whatsapp||'';if(document.getElementById('configPedidoMinimo'))document.getElementById('configPedidoMinimo').value=d.pedidoMinimo||0;if(document.getElementById('configTiempo'))document.getElementById('configTiempo').value=d.tiempoPreparacion||30;}});
}

function showAdminTab(tab){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
}

async function addProduct(){
  const emoji=document.getElementById('newEmoji').value.trim()||'📦';
  const name=document.getElementById('newName').value.trim();
  const price=parseFloat(document.getElementById('newPrice').value);
  const category=document.getElementById('newCategory').value.trim()||'General';
  const oferta=document.getElementById('newOferta').checked;
  const precioAnterior=parseFloat(document.getElementById('newPrecioAnterior').value)||0;
  const visible=document.getElementById('newVisible').checked;
  const agotado=document.getElementById('newAgotado').checked;
  if(!name||isNaN(price)||price<=0){showToast('⚠️ Datos inválidos');return;}
  await db.collection('productos').add({emoji,name,price,category,oferta,precioAnterior:oferta&&precioAnterior?precioAnterior:0,visible,agotado,variants:[],photo:'',etiqueta:'',tipo:'normal',stock:null});
  ['newEmoji','newName','newPrice','newCategory','newPrecioAnterior'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('newOferta').checked=false;document.getElementById('newAgotado').checked=false;
  showToast('✅ Producto agregado');
}

async function deleteProduct(id){if(!confirm('¿Eliminar?'))return;await db.collection('productos').doc(id).delete();showToast('🗑️ Eliminado');}
async function toggleAgotado(id,agotado){await db.collection('productos').doc(id).update({agotado:!agotado});showToast(!agotado?'❌ Agotado':'✅ Disponible');}

function renderProductList(){
  const q=(document.getElementById('adminSearch')?.value||'').toLowerCase();
  const filtered=q?products.filter(p=>p.name.toLowerCase().includes(q)):products;
  const el=document.getElementById('adminProductList');
  if(!filtered.length){el.innerHTML='<p style="color:var(--subtext);text-align:center;padding:20px;">No hay productos</p>';return;}
  el.innerHTML=filtered.map(p=>`<div class="product-item-admin"><div style="flex:1;"><div style="font-weight:700;">${p.emoji||'📦'} ${p.name}${p.agotado?' ❌':''}</div><div style="font-size:12px;color:var(--subtext);">${p.category||'General'} — $${p.price}</div></div><button onclick="toggleAgotado('${p.id}',${!!p.agotado})" style="background:none;border:none;font-size:18px;cursor:pointer;">${p.agotado?'🔴':'🟢'}</button><button onclick="deleteProduct('${p.id}')" style="background:none;border:none;font-size:20px;cursor:pointer;">🗑️</button></div>`).join('');
}

function filterPedidos(e){pedidosFiltro=e;renderPedidos();}
function renderPedidos(){
  const filtered=pedidosFiltro==='todos'?allPedidos:allPedidos.filter(p=>p.estado===pedidosFiltro);
  const el=document.getElementById('pedidosList');
  if(!filtered.length){el.innerHTML='<p style="color:var(--subtext);text-align:center;padding:20px;">No hay pedidos</p>';return;}
  el.innerHTML=filtered.map(p=>`
    <div class="pedido-card">
      <div style="display:flex;justify-content:space-between;"><div style="font-weight:800;">👤 ${p.nombre}</div><span class="estado-badge estado-${p.estado||'pendiente'}">${p.estado||'pendiente'}</span></div>
      <div style="font-size:12px;color:var(--subtext);">📞 ${p.telefono} · 💳 ${p.metodoPago||'—'} · 📌 ${p.direccion||'—'}</div>
      <div style="font-size:13px;white-space:pre-line;margin:6px 0;">${p.productos}</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:24px;color:var(--rojo);">$ ${p.total?.toFixed(2)||'0.00'}</div>
      <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;">
        <button onclick="updateEstado('${p.id}','confirmado')" style="background:#2dc653;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">✅ Confirmar</button>
        <button onclick="updateEstado('${p.id}','preparacion')" style="background:#007bff;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">🍳 Preparando</button>
        <button onclick="updateEstado('${p.id}','camino')" style="background:#ff6b2b;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">🛵 En camino</button>
        <button onclick="updateEstado('${p.id}','entregado')" style="background:#1565c0;color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;cursor:pointer;">📦 Entregado</button>
      </div>
    </div>`).join('');
}
async function updateEstado(id,estado){await db.collection('pedidos').doc(id).update({estado});showToast('✅ Actualizado');}

async function saveWhatsapp(){const wa=document.getElementById('configWhatsapp').value.trim();if(!wa){showToast('⚠️ Escribe el número');return;}await db.collection('config').doc('tienda').set({whatsapp:wa},{merge:true});showToast('✅ Guardado');}
async function savePedidoMinimo(){const val=parseFloat(document.getElementById('configPedidoMinimo').value);if(isNaN(val)||val<0){showToast('⚠️ Inválido');return;}await db.collection('config').doc('tienda').set({pedidoMinimo:val},{merge:true});showToast('✅ Guardado');}
async function saveTiempo(){const val=parseInt(document.getElementById('configTiempo').value);if(isNaN(val)||val<1){showToast('⚠️ Inválido');return;}await db.collection('config').doc('tienda').set({tiempoPreparacion:val},{merge:true});showToast('✅ Guardado');}

async function cargarInventario(){
  if(!confirm('¿Cargar productos?'))return;
  const inventario=[
    {emoji:'🧻',name:'Papel Higiénico',price:0.7,category:'Higiene'},
    {emoji:'🌽',name:'Harina Pan 1K',price:1.8,category:'Víveres'},
    {emoji:'🍚',name:'Arroz 900G',price:1.6,category:'Víveres'},
    {emoji:'☕',name:'Café 200G',price:2.7,category:'Víveres'},
    {emoji:'🥤',name:'Glup 2L',price:1.5,category:'Refrescos'},
    {emoji:'🧀',name:'Queso Duro',price:4.5,category:'Frescos'},
    {emoji:'🧴',name:'Desodorante',price:0.8,category:'Higiene'},
    {emoji:'🦷',name:'Crema Dental',price:0.8,category:'Higiene'},
    {emoji:'🍬',name:'Boka',price:0.4,category:'Dulces'},
    {emoji:'💡',name:'Bombillo LED',price:1.1,category:'Varios'}
  ];
  for(const p of inventario){await db.collection('productos').add({...p,variants:[],photo:'',visible:true,agotado:false,oferta:false,precioAnterior:0,etiqueta:'',tipo:'normal',stock:null});}
  showToast('✅ Inventario cargado');
}

function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
</script>
</body>
</html>
