<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bodega Tony Tony">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<title>Bodega Tony Tony</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
:root{--rojo:#e63946;--amarillo:#f4d35e;--verde:#2dc653;--oscuro:#1a1a2e;--bg:#f7f7f7;--card:#fff;--text:#1a1a2e;--subtext:#888;--border:#eee;--gris:#f1f1f1;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
header{background:var(--oscuro);color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.3);}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--amarillo);}
.logo-text span{color:var(--rojo);}
.cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:9px 16px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;}
.cart-count{background:var(--amarillo);color:var(--oscuro);border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;}
.status-bar{text-align:center;padding:8px;font-size:13px;font-weight:700;background:linear-gradient(90deg,#2dc653,#1a9e3f);color:white;}
.tabs{display:flex;background:var(--card);border-bottom:3px solid var(--amarillo);overflow-x:auto;scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab-btn{padding:11px 14px;border:none;background:transparent;font-weight:700;font-size:13px;color:var(--subtext);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-3px;}
.tab-btn.active{color:var(--rojo);border-bottom-color:var(--rojo);}
.search-wrap{padding:8px 14px;background:var(--card);}
.search-wrap input{width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:50px;font-size:14px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
.view{display:none;padding:12px;}
.view.active{display:block;}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.product-card{background:var(--card);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08);position:relative;}
.product-img{width:100%;height:120px;object-fit:cover;}
.product-emoji{font-size:40px;text-align:center;padding:20px 0 10px;}
.product-info{padding:8px 12px 12px;}
.product-name{font-weight:700;font-size:13px;margin-bottom:4px;}
.product-price{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--rojo);}
.price-old{font-size:11px;color:var(--subtext);text-decoration:line-through;}
.price-new{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--verde);}
.add-btn{background:var(--oscuro);color:white;border:none;border-radius:50px;padding:8px 14px;font-weight:800;font-size:13px;cursor:pointer;width:100%;margin-top:8px;}
.agotado-badge{background:#555;color:white;border-radius:50px;padding:8px;text-align:center;font-size:12px;margin-top:8px;}
.qty-ctrl{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:8px;}
.qty-btn{background:var(--gris);border:none;border-radius:50%;width:28px;height:28px;font-size:18px;font-weight:900;cursor:pointer;}
.qty-num{font-weight:800;font-size:16px;}
.variants-label{font-size:11px;font-weight:700;color:var(--subtext);}
.variants-list{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;}
.variant-chip{padding:4px 8px;border:2px solid var(--border);border-radius:50px;font-size:11px;font-weight:700;cursor:pointer;background:var(--card);color:var(--text);}
.variant-chip.selected{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
.cat-filter{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;}
.cat-filter::-webkit-scrollbar{display:none;}
.cats-scroll{display:flex;gap:10px;overflow-x:auto;padding:8px 14px 14px;scrollbar-width:none;}
.cats-scroll::-webkit-scrollbar{display:none;}
.cat-card{flex-shrink:0;width:80px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.cat-card:active .cat-circle{transform:scale(.92);}
.cat-circle{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 6px;box-shadow:0 4px 14px rgba(0,0,0,.18);transition:transform .15s;}
.cat-circle svg{width:38px;height:38px;}
.cat-card-label{font-size:11px;font-weight:700;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cat-card.active .cat-card-label{color:var(--rojo);}
.cat-card.active .cat-circle{box-shadow:0 0 0 3px var(--rojo),0 4px 14px rgba(0,0,0,.18);}
.cart-item{background:var(--card);border-radius:14px;padding:12px;display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.cart-item .thumb{width:48px;height:48px;border-radius:10px;object-fit:cover;flex-shrink:0;}
.cart-item .cemoji{font-size:28px;flex-shrink:0;}
.cart-total{background:var(--oscuro);color:white;border-radius:16px;padding:18px;margin:14px 0;text-align:center;}
.cart-total .amount{font-family:'Bebas Neue',sans-serif;font-size:38px;color:var(--amarillo);}
.ci input,.ci select{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:8px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
.ci input:focus{border-color:var(--rojo);}
.wa-btn{display:block;width:100%;background:#25d366;color:white;border:none;border-radius:14px;padding:16px;font-weight:800;font-size:16px;cursor:pointer;text-align:center;text-decoration:none;margin-top:8px;font-family:'Nunito',sans-serif;}
.wa-btn.off{background:#aaa;pointer-events:none;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--oscuro);color:white;padding:12px 24px;border-radius:50px;font-weight:700;z-index:9999;transition:transform .3s;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.empty{text-align:center;padding:40px 20px;color:var(--subtext);}
.floating-cart{position:fixed;bottom:0;left:0;right:0;z-index:300;padding:10px 16px;background:var(--oscuro);display:flex;align-items:center;justify-content:space-between;gap:10px;transform:translateY(100%);transition:transform .3s;}
.floating-cart.visible{transform:translateY(0);}
.floating-cart-total{font-family:'Bebas Neue',sans-serif;font-size:20px;color:var(--amarillo);}
.floating-cart-btn{background:var(--rojo);color:white;border:none;border-radius:50px;padding:10px 18px;font-weight:800;font-size:13px;cursor:pointer;}
body.has-float .view{padding-bottom:70px;}
.ofertas-banner{background:linear-gradient(135deg,#e63946,#ff6b2b);border-radius:14px;padding:14px;margin-bottom:12px;color:white;}
.badge-oferta{position:absolute;top:8px;left:8px;background:var(--rojo);color:white;border-radius:50px;padding:3px 8px;font-size:10px;font-weight:800;z-index:2;}
.resena-btn{background:none;border:none;font-size:14px;cursor:pointer;margin-top:4px;color:var(--subtext);}
.chat-fab{position:fixed;bottom:120px;right:18px;z-index:400;background:var(--verde);color:white;width:54px;height:54px;border-radius:50%;border:none;font-size:26px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;}
.chat-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:flex-end;justify-content:center;}
.chat-modal.open{display:flex;}
.chat-window{width:100%;max-width:400px;height:70vh;background:var(--card);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideUp .3s ease;}
.chat-header{background:var(--verde);color:white;padding:14px 16px;border-radius:20px 20px 0 0;display:flex;justify-content:space-between;align-items:center;}
.chat-messages{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.chat-msg{max-width:80%;padding:10px 14px;border-radius:16px;font-size:13px;}
.chat-msg.me{background:var(--verde);color:white;align-self:flex-end;}
.chat-msg.bot{background:#e3f2fd;color:#0d47a1;align-self:flex-start;}
.chat-msg.admin{background:var(--gris);color:var(--text);align-self:flex-start;}
.chat-input-wrap{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);}
.chat-input-wrap input{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:20px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;}
.chat-input-wrap button{background:var(--verde);color:white;border:none;border-radius:50%;width:40px;height:40px;font-size:20px;cursor:pointer;}
.resena-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:600;display:none;align-items:flex-end;justify-content:center;}
.resena-modal.open{display:flex;}
.resena-sheet{width:100%;max-width:400px;background:var(--card);border-radius:20px 20px 0 0;padding:20px;animation:slideUp .3s ease;}
.pago-card{background:#fff8e1;border:2px solid var(--amarillo);border-radius:14px;padding:14px;margin-top:12px;line-height:2;}
.entrega-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 14px;}
.entrega-opt{padding:14px 8px;border:2px solid var(--border);border-radius:14px;background:var(--card);text-align:center;cursor:pointer;font-weight:800;font-size:14px;transition:all .2s;font-family:'Nunito',sans-serif;}
.entrega-opt.active{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
.metodos-wrap{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px;}
.metodo-chip{padding:9px 16px;border:2px solid var(--border);border-radius:50px;background:var(--card);font-weight:700;font-size:13px;cursor:pointer;font-family:'Nunito',sans-serif;transition:all .2s;}
.metodo-chip.active{border-color:var(--rojo);background:#fff0f0;color:var(--rojo);}
.comp-box{border-radius:14px;padding:14px;margin:8px 0;}
.comp-red{background:#fff0f0;border:2px solid var(--rojo);}
.comp-yellow{background:#fff8e1;border:2px solid var(--amarillo);}
.comp-upload{width:100%;min-height:100px;border:2px dashed #bbb;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--subtext);font-weight:700;font-size:13px;overflow:hidden;margin-top:10px;background:var(--bg);}
.comp-ok{border:2px solid var(--verde);background:#e8f5e9;border-radius:12px;padding:10px;margin-top:8px;text-align:center;font-weight:800;color:#1b5e20;font-size:13px;}
.geo-box{border-radius:12px;padding:10px;margin-bottom:8px;font-size:13px;font-weight:700;}
.geo-no{background:#fff8e1;border:2px solid var(--amarillo);color:#856404;}
.geo-si{background:#e8f5e9;border:2px solid var(--verde);color:#1b5e20;}
.hero-banner{background:linear-gradient(135deg,var(--oscuro) 0%,#2d1b69 100%);border-radius:18px;padding:20px 18px;margin:0 0 14px;color:white;position:relative;overflow:hidden;}
.hero-banner::after{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(230,57,70,.15);border-radius:50%;}
.hero-greeting{font-size:13px;color:rgba(255,255,255,.7);margin-bottom:4px;}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:1px;line-height:1.1;margin-bottom:12px;}
.hero-title span{color:var(--amarillo);}
.hero-badge{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:50px;padding:6px 12px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
.hero-badge b{color:var(--verde);}
.promo-strip{background:var(--amarillo);border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.promo-strip-text{font-weight:800;font-size:13px;color:var(--oscuro);}
.promo-strip-link{background:var(--oscuro);color:white;border-radius:50px;padding:5px 12px;font-size:12px;font-weight:800;cursor:pointer;}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.5px;padding:14px 14px 6px;display:flex;align-items:center;gap:6px;}
.ofertas-section{padding:0 14px 14px;}
.ofertas-scroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;}
.ofertas-scroll::-webkit-scrollbar{display:none;}
.products-section{padding:0 14px 14px;}
.puntos-card{background:linear-gradient(135deg,#1a1a2e,#2d2d4e);border-radius:16px;padding:16px;margin:10px 0;color:white;}
.puntos-num{font-family:'Bebas Neue',sans-serif;font-size:42px;color:var(--amarillo);line-height:1;}
.puntos-bar-bg{background:rgba(255,255,255,.15);border-radius:50px;height:10px;margin:8px 0;}
.puntos-bar{background:linear-gradient(90deg,var(--amarillo),#ff6b2b);border-radius:50px;height:10px;transition:width .5s;}
.puntos-historial{background:var(--card);border-radius:14px;padding:14px;margin-top:10px;}
.puntos-item{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.puntos-item:last-child{border-bottom:none;}
.puntos-badge{background:var(--oscuro);color:var(--amarillo);border-radius:50px;padding:2px 8px;font-size:11px;font-weight:800;}
.reg-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99998;display:flex;align-items:center;justify-content:center;padding:20px;}
.reg-card{background:var(--card);border-radius:24px;padding:28px 20px;width:100%;max-width:330px;text-align:center;}
.reg-field{width:100%;padding:13px 14px;border:2px solid var(--border);border-radius:12px;font-size:16px;margin-bottom:12px;outline:none;background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;-webkit-appearance:none;}
.reg-field:focus{border-color:var(--rojo);}
.reg-btn{width:100%;background:var(--rojo);color:white;border:none;border-radius:12px;padding:15px;font-weight:800;font-size:16px;cursor:pointer;font-family:'Nunito',sans-serif;}
/* ANIMACIONES CATEGORÍAS */
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{0%,100%{opacity:.7}50%{opacity:1;filter:brightness(1.3)}}
@keyframes escribir{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-10deg)}70%{transform:rotate(8deg)}}
@keyframes flotar{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes latido{0%,100%{transform:scale(1)}20%{transform:scale(1.18)}40%{transform:scale(1)}}
@keyframes vapor{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes onda{0%,100%{transform:skewX(0)}40%{transform:skewX(-7deg)}70%{transform:skewX(6deg)}}
@keyframes barrer{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes tijera{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
.a-shimmer{animation:shimmer 2.5s ease-in-out infinite;}
.a-escribir{animation:escribir 1.8s ease-in-out infinite;}
.a-flotar{animation:flotar 2.2s ease-in-out infinite;}
.a-latido{animation:latido 1.5s ease-in-out infinite;}
.a-vapor{animation:vapor 2s ease-in-out infinite;}
.a-onda{animation:onda 2.2s ease-in-out infinite;}
.a-barrer{animation:barrer 1.8s ease-in-out infinite;}
.a-tijera{animation:tijera 2s ease-in-out infinite;}
.cat-card:hover .cat-circle,.cat-card.active .cat-circle{transform:scale(1.08);}

/* ══════════════════════════════════════
   CATEGORY 3D CLAY ICONS
══════════════════════════════════════ */
.cats-scroll{display:flex;gap:12px;overflow-x:auto;padding:6px 14px 16px;scrollbar-width:none;}
.cats-scroll::-webkit-scrollbar{display:none;}
.cat-card{display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:80px;-webkit-tap-highlight-color:transparent;user-select:none;}
.cat-card-label{font-size:11px;font-weight:800;color:#444;text-align:center;max-width:80px;margin-top:6px;line-height:1.3;}
.cat-card.active .cat-card-label{color:var(--rojo);}
.cat-icon-wrap{
  width:72px;height:72px;border-radius:22px;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:visible;
  transition:transform .18s cubic-bezier(.34,1.56,.64,1);
  filter:drop-shadow(0 6px 12px rgba(0,0,0,.22)) drop-shadow(0 2px 4px rgba(0,0,0,.12));
}
.cat-card:active .cat-icon-wrap{transform:scale(.86)!important;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18));}
.cat-card.active .cat-icon-wrap{filter:drop-shadow(0 0 0 3px var(--rojo)) drop-shadow(0 6px 12px rgba(0,0,0,.22));}
.cat-icon-wrap svg{width:72px;height:72px;display:block;overflow:visible;}

/* ── KEYFRAMES ────────────────────────── */

/* 1. Joyería — giro + destello */
@keyframes k-joy-spin{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
@keyframes k-joy-glow{0%,100%{opacity:0;r:3}50%{opacity:1;r:6}}
.anim-joyeria .obj{animation:k-joy-spin 3s ease-in-out infinite;transform-origin:50% 50%;}
.anim-joyeria .shine{animation:k-joy-glow 3s ease-in-out infinite;}

/* 2. Papelería — trazo escritura */
@keyframes k-pap-move{0%,100%{transform:rotate(-8deg) translate(0,0)}30%{transform:rotate(-6deg) translate(3px,-2px)}60%{transform:rotate(-10deg) translate(-2px,2px)}}
.anim-papeleria .obj{animation:k-pap-move 2s ease-in-out infinite;transform-origin:70% 70%;}

/* 3. Higiene — burbujas flotando */
@keyframes k-bub-float{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-7px);opacity:1}}
@keyframes k-bub2{0%,100%{transform:translateY(0) scale(1)}60%{transform:translateY(-5px) scale(1.1)}}
.anim-higiene .obj{animation:k-bub-float 2s ease-in-out infinite;}
.anim-higiene .b1{animation:k-bub-float 2s .2s ease-in-out infinite;}
.anim-higiene .b2{animation:k-bub2 2s .5s ease-in-out infinite;}
.anim-higiene .b3{animation:k-bub-float 2s .8s ease-in-out infinite;}

/* 4. Cabello — tijeras abriéndose */
@keyframes k-sci-top{0%,100%{transform:rotate(0deg)}40%{transform:rotate(-14deg)}}
@keyframes k-sci-bot{0%,100%{transform:rotate(0deg)}40%{transform:rotate(14deg)}}
.anim-cabello .blade-top{animation:k-sci-top 1.6s ease-in-out infinite;transform-origin:30% 50%;}
.anim-cabello .blade-bot{animation:k-sci-bot 1.6s ease-in-out infinite;transform-origin:30% 50%;}

/* 5. Bebé — balanceo cuna */
@keyframes k-rock{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-10deg)}70%{transform:rotate(10deg)}}
.anim-bebe .obj{animation:k-rock 2.4s ease-in-out infinite;transform-origin:50% 80%;}

/* 6. Bebidas — líquido sube y baja */
@keyframes k-liq{0%,100%{transform:translateY(0) scaleX(1)}40%{transform:translateY(-5px) scaleX(1.04)}70%{transform:translateY(-2px) scaleX(.98)}}
.anim-bebidas .obj{animation:k-liq 2s ease-in-out infinite;}

/* 7. Carnes — vapor sube */
@keyframes k-vap1{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-8px);opacity:.3}}
@keyframes k-vap2{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-6px);opacity:.2}}
.anim-carnes .v1{animation:k-vap1 1.8s ease-in-out infinite;}
.anim-carnes .v2{animation:k-vap2 1.8s .3s ease-in-out infinite;}
.anim-carnes .v3{animation:k-vap1 1.8s .6s ease-in-out infinite;}

/* 8. Lácteos — derretimiento suave */
@keyframes k-melt{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.93) scaleX(1.04)}}
.anim-lacteos .obj{animation:k-melt 2.6s ease-in-out infinite;transform-origin:50% 90%;}

/* 9. Frutas — hoja oscila */
@keyframes k-leaf{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-16deg)}70%{transform:rotate(12deg)}}
.anim-frutas .leaf{animation:k-leaf 2s ease-in-out infinite;transform-origin:10% 90%;}

/* 10. Granos — mecido viento */
@keyframes k-sway{0%,100%{transform:rotate(0deg) translateX(0)}33%{transform:rotate(-12deg) translateX(-3px)}66%{transform:rotate(12deg) translateX(3px)}}
.anim-granos .obj{animation:k-sway 2.4s ease-in-out infinite;transform-origin:50% 95%;}

/* 11. Limpieza — barrido escoba */

  if(d.transferencia)cfg.transferencia=d.transferencia;
  if(d.horario){
    const h=d.horario,now=new Date().getHours();
    const open=now>=h.apertura&&now<h.cierre;
    const sb=document.getElementById('statusBar');
    if(sb){sb.style.background=open?'linear-gradient(90deg,#2dc653,#1a9e3f)':'linear-gradient(90deg,#888,#555)';sb.textContent=(open?'✅ Abierto':'❌ Cerrado')+' · '+h.apertura+':00 - '+h.cierre+':00';}
  }
}).catch(()=>{});

db.collection('productos').onSnapshot(snap=>{
  products=snap.docs.map(d=>({id:d.id,...d.data()})).filter(p=>p.visible!==false);
  renderStore();
});

// HELPERS
function ckey(pid,v){return pid+'_'+(v||'');}
function qty(pid,v){return(cart[ckey(pid,v)]||{}).qty||0;}
function total(){return Object.values(cart).reduce((s,i)=>s+i.p.price*i.qty,0);}
function updateCount(){document.getElementById('cartCount').textContent=Object.values(cart).reduce((a,b)=>a+b.qty,0);}
function updateFloat(){
  const t=total(),n=Object.values(cart).reduce((a,b)=>a+b.qty,0);
  const b=document.getElementById('floatingCart');if(!b)return;
  if(n>0){b.classList.add('visible');document.body.classList.add('has-float');document.getElementById('floatTotal').textContent='$ '+t.toFixed(2)+' · '+n+' item'+(n>1?'s':'');}
  else{b.classList.remove('visible');document.body.classList.remove('has-float');}
  updateCount();
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// TABS
function showTab(t){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('view-'+t)?.classList.add('active');
  document.getElementById('tab-'+t)?.classList.add('active');
  if(t==='tienda')renderStore();
  if(t==='carrito')renderCart();
  if(t==='tracking')renderTracking();
  if(t==='soporte')renderSoporte();
  if(t==='puntos')renderPuntos();
}

function getCatData(name) {
  const n = (name||'').toLowerCase().trim();
  if(n==='todos') return CAT_DATA[0];
  return CAT_DATA.find(d => d.keys.some(k => n.includes(k))) || null;
}

function getCatIcon(name) {
  const n   = (name||'').toLowerCase().trim();
  const dat = getCatData(name);
  if (dat && CAT_SVGS[dat.svgId]) {
    return `<div class="cat-icon-wrap ${dat.anim}">${CAT_SVGS[dat.svgId]}</div>`;
  }
  // Fallback
  const palette = ['#fbe9d2','#dff2e1','#ede0ff','#ffe0ea','#d6eeff','#ffe0e0','#eedfc8','#c8f0e8'];
  let hash = 0; for (let i=0;i<name.length;i++) hash = name.charCodeAt(i)+((hash<<5)-hash);
  const bg = palette[Math.abs(hash)%palette.length];
  return `<div class="cat-icon-wrap anim-default" style="background:${bg};font-size:28px;color:white;">${(name[0]||'?').toUpperCase()}</div>`;
}

      const safe=c2.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

function buildCard(p,scroll){
  const img=p.photo?'<img src="'+esc(p.photo)+'" class="product-img" loading="lazy">':'<div class="product-emoji">'+(p.emoji||'&#128230;')+'</div>';
  const hasV=p.variants&&p.variants.length>0;
  let ph=(p.oferta&&p.precioAnterior)?'<div class="price-old">$ '+p.precioAnterior+'</div><div class="price-new">$ '+p.price+'</div>':'<div class="product-price">$ '+p.price+'</div>';
  let act='';
  if(p.agotado){act='<div class="agotado-badge">&#10060; Agotado</div>';}
  else if(hasV){
    act='<div class="variants-label">Elige:</div><div class="variants-list">';
    p.variants.forEach(v=>{
      const q2=qty(p.id,v),sv=v.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
      act+='<span class="variant-chip'+(q2>0?' selected':'')+'" onclick="event.stopPropagation();addCart(\''+esc(p.id)+'\',\''+sv+'\')">'+esc(v)+(q2>0?' &times;'+q2:'')+' </span>';
    });
    act+='</div>';
  }else{
    const q2=qty(p.id,'');
    act=q2>0?'<div class="qty-ctrl"><button class="qty-btn" onclick="event.stopPropagation();chgQty(\''+esc(p.id)+'\',\'\',-1)">&#8722;</button><span class="qty-num">'+q2+'</span><button class="qty-btn" onclick="event.stopPropagation();addCart(\''+esc(p.id)+'\',\'\')">+</button></div>':'<button class="add-btn" onclick="event.stopPropagation();addCart(\''+esc(p.id)+'\',\'\')">+ Agregar</button>';
  }
  return '<div class="product-card" style="'+(scroll?'min-width:155px;flex-shrink:0;':'')+'">'+
    (p.oferta?'<span class="badge-oferta">&#128293;</span>':'')+img+
    '<div class="product-info"><div class="product-name">'+esc(p.name)+'</div>'+ph+act+
    '<button class="resena-btn" onclick="event.stopPropagation();abrirResena(\''+esc(p.id)+'\')">&#11088; Rese&ntilde;as</button></div></div>';
}
function addCart(pid,v){
  const p=products.find(x=>x.id===pid);if(!p||p.agotado){showToast('&#10060; No disponible');return;}
  const k=ckey(pid,v);if(!cart[k])cart[k]={p,v:v||'',qty:0};cart[k].qty++;
  renderStore();showToast('&#9989; Agregado');updateFloat();
}
function chgQty(pid,v,d){
  const k=ckey(pid,v);if(!cart[k])return;cart[k].qty+=d;if(cart[k].qty<=0)delete cart[k];
  renderStore();updateFloat();
}
function getGPS(){
  if(!navigator.geolocation){showToast('GPS no disponible');return;}
  navigator.geolocation.getCurrentPosition(
    pos=>{geo={lat:pos.coords.latitude,lng:pos.coords.longitude};showToast('&#9989; Ubicaci&oacute;n obtenida');renderCart();},
    ()=>showToast('&#9888;&#65039; No se pudo obtener GPS')
  );
}
function setEntrega(t){entrega=t;comp64='';renderCart();}
function setMetodo(m){metodo=m;comp64='';renderCart();}
function needsComp(){return metodo!=='efectivo';}
function subirComp(input){
  const file=input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=900,cv=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>h){if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}}else{if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}}
      cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);
      comp64=cv.toDataURL('image/jpeg',.82);renderCart();showToast('&#9989; Comprobante cargado');
    };img.src=e.target.result;
  };reader.readAsDataURL(file);
}

// FIX iOS: sincrónico, sin await
function mkId(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let id='';for(let i=0;i<8;i++)id+=c[Math.floor(Math.random()*c.length)];return id;}
function doOrder(link){
  const n=(document.getElementById('cName')||{}).value?.trim()||'';
  const ph=(document.getElementById('cPhone')||{}).value?.trim()||'';
  const ad=(document.getElementById('cAddr')||{}).value?.trim()||'';
  if(!n||!ph){showToast('&#9888;&#65039; Completa nombre y tel&eacute;fono');return false;}
  if(entrega==='domicilio'&&!ad){showToast('&#9888;&#65039; Escribe tu direcci&oacute;n');return false;}
  if(needsComp()&&entrega==='domicilio'&&!comp64){showToast('&#9888;&#65039; Sube la foto del comprobante');return false;}
  localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',ph);if(ad)localStorage.setItem('clientAddress',ad);
  let tot=0,msg='',parr=[];
  Object.values(cart).forEach(i=>{
    const s=i.p.price*i.qty;tot+=s;
    msg+=(i.p.emoji||'')+' '+i.p.name+(i.v?' ('+i.v+')':'')+' x'+i.qty+' -- $'+s.toFixed(2)+'\n';
    parr.push({name:i.p.name,variant:i.v,qty:i.qty,price:i.p.price});
  });
  const pid=mkId();
  const geoTxt=(geo&&!geo.manual)?'\n📍 https://maps.google.com/?q='+geo.lat+','+geo.lng:'';
  const compTxt=comp64?'\n🧾 Comprobante subido en la app':'';
  const etxt=entrega==='domicilio'?'🛵 Domicilio':'🏪 Retiro en tienda';
  const waText='🛒 *Pedido #'+pid+' - Bodega Tony Tony*\n👤 *'+n+'*\n📞 *'+ph+'*\n'+(ad?'📌 *'+ad+'*':'')+geoTxt+'\n📦 *'+etxt+'*\n💳 *'+metodo+'*'+compTxt+'\n\n🧺 *Productos:*\n'+msg+'\n💰 *TOTAL: $'+tot.toFixed(2)+'*';
  const data={pedidoId:pid,nombre:n,telefono:ph,direccion:ad||'',productos:msg,productosArray:parr,total:tot,tipoEntrega:entrega,metodoPago:metodo,comprobante:comp64||'',geo:geo||null,fecha:new Date().toISOString(),estado:'pendiente'};
  if(comp64)data.comprobanteAprobado=null;
  db.collection('pedidos').doc(pid).set(data).catch(e=>console.error(e));
  // Puntos
  const ptsG=Math.floor(tot);
  const phone=localStorage.getItem('clientPhone')||'anonimo';
  db.collection('clientes').doc(phone).get().then(snap=>{
    const actual=snap.exists?(snap.data().puntos||0):0;
    const hist=snap.exists?(snap.data().historial||[]):[];
    hist.unshift({fecha:new Date().toISOString(),puntos:ptsG,pedido:pid,tipo:'ganado'});
    db.collection('clientes').doc(phone).set({nombre:n,telefono:ph,puntos:actual+ptsG,totalGastado:(snap.exists?(snap.data().totalGastado||0):0)+tot,historial:hist.slice(0,20)},{merge:true});
  }).catch(()=>{});
  localStorage.setItem('pedidoActivoId',pid);
  cart={};geo=null;comp64='';updateFloat();
  showToast('&#9989; &iexcl;Pedido enviado! +'+ptsG+' puntos &#11088;');
  setTimeout(()=>showTab('tracking'),800);
  link.href='https://wa.me/'+cfg.whatsapp.replace(/[^0-9+]/g,'')+'?text='+encodeURIComponent(waText);
  return true;
}

  const pid=localStorage.getItem('pedidoActivoId');
  if(!pid){el.innerHTML='<div class="empty"><p>&#128230; No tienes pedidos activos</p></div>';return;}
  el.innerHTML='<div class="empty"><div style="animation:spin .8s linear infinite;width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--rojo);border-radius:50%;margin:0 auto 10px;"></div>Cargando...</div>';
  db.collection('pedidos').where('pedidoId','==',pid).limit(1).get().then(snap=>{
    if(!snap.empty){
      const estadoAnterior = window._ultimoEstadoPedido;
      const nuevoEstado = snap.docs[0].data().estado;
      if(estadoAnterior && estadoAnterior !== nuevoEstado) {
        notificarCambioEstado(nuevoEstado, pid);
      }
      window._ultimoEstadoPedido = nuevoEstado;
      showTrack(pid,snap.docs[0].data());
    }
    else db.collection('pedidos').doc(pid).get().then(d=>{if(d.exists){
      const estadoAnterior = window._ultimoEstadoPedido;
      const nuevoEstado = d.data().estado;
      if(estadoAnterior && estadoAnterior !== nuevoEstado) {
        notificarCambioEstado(nuevoEstado, pid);
      }
      window._ultimoEstadoPedido = nuevoEstado;
      showTrack(pid,d.data());
    }else el.innerHTML='<div class="empty"><p>Pedido no encontrado</p></div>';});
  }).catch(()=>el.innerHTML='<div class="empty"><p>Error al cargar</p></div>');
}
function showTrack(pid,p){
  const el=document.getElementById('trackingContainer');
  const mapH=p.geo&&!p.geo.manual?'<a href="https://www.google.com/maps?q='+p.geo.lat+','+p.geo.lng+'" target="_blank" style="display:block;background:#e8f5e9;color:#1b5e20;padding:10px;border-radius:10px;text-align:center;font-weight:700;margin:10px 0;text-decoration:none;">&#128506;&#65039; Ver ubicaci&oacute;n</a>':'';
  const repH=p.nombreRepartidor?'<div style="background:var(--gris);border-radius:12px;padding:12px;margin:10px 0;text-align:center;"><div>&#128693; <b>'+esc(p.nombreRepartidor)+'</b></div>'+(p.telefonoRepartidor?'<a href="https://wa.me/'+p.telefonoRepartidor.replace(/\D/g,'')+'" target="_blank" style="display:inline-block;margin-top:6px;background:#25d366;color:white;border-radius:50px;padding:6px 14px;font-size:12px;font-weight:700;">&#128222; Contactar</a>':'')+'</div>':'';
  let compH='';
  if(p.comprobante){const est=p.comprobanteAprobado===true?'<span style="color:#1b5e20;font-weight:800;">&#9989; Pago aprobado</span>':p.comprobanteAprobado===false?'<span style="color:var(--rojo);font-weight:800;">&#10060; Rechazado &mdash; env&iacute;a uno nuevo</span>':'<span style="color:#856404;font-weight:800;">&#9203; Revisando...</span>';compH='<div style="background:var(--gris);border-radius:12px;padding:12px;margin:10px 0;text-align:center;">&#129534; Estado de pago: '+est+'</div>';}
  const bc={pendiente:'#fff3cd',confirmado:'#d4edda',preparacion:'#cce5ff',camino:'#ffe5d0',entregado:'#d4edda',cancelado:'#ffd6d6'};
  const tc={pendiente:'#856404',confirmado:'#155724',preparacion:'#004085',camino:'#c05621',entregado:'#155724',cancelado:'#e63946'};
  const st=p.estado||'pendiente';
  el.innerHTML='<div style="text-align:center;padding:20px;">'+
    '<div style="font-size:50px;">&#128230;</div>'+
    '<div style="font-family:Bebas Neue,sans-serif;font-size:24px;">#'+pid+'</div>'+
    '<span style="padding:6px 14px;border-radius:50px;background:'+(bc[st]||'#fff3cd')+';color:'+(tc[st]||'#856404')+';font-weight:800;font-size:14px;">'+st+'</span>'+
    '<div style="font-size:12px;color:var(--subtext);margin:6px 0;">'+(p.tipoEntrega==='domicilio'?'&#128693; Domicilio':'&#127978; Retiro en tienda')+'</div>'+
    compH+mapH+repH+
    '<div style="margin:16px 0;font-size:13px;white-space:pre-line;text-align:left;background:var(--gris);border-radius:12px;padding:12px;">'+esc(p.productos)+'</div>'+
    '<div style="font-family:Bebas Neue,sans-serif;font-size:28px;color:var(--rojo);">$ '+(p.total||0).toFixed(2)+'</div>'+
    '<button onclick="renderTracking()" style="margin-top:14px;padding:10px 20px;border:2px solid var(--border);border-radius:50px;background:var(--card);font-weight:700;cursor:pointer;font-family:Nunito,sans-serif;">&#128260; Actualizar estado</button>'+
    '</div>';
}

// SOPORTE
function renderSoporte(){
  document.getElementById('soporteContainer').innerHTML='<div style="background:var(--card);border-radius:16px;padding:18px;">'+
    '<div style="font-family:Bebas Neue,sans-serif;font-size:24px;color:var(--rojo);margin-bottom:14px;">&#10069; Reportar problema</div>'+
    '<input type="text" id="sN" class="ci" placeholder="&#128100; Tu nombre *" style="display:block;"><input type="tel" id="sT" class="ci" placeholder="&#128222; Tu tel&eacute;fono *" style="display:block;" inputmode="numeric"><textarea id="sD" class="ci" placeholder="Describe el problema *" style="display:block;min-height:90px;resize:none;"></textarea>'+
    '<button onclick="doSoporte()" style="width:100%;background:var(--rojo);color:white;border:none;border-radius:12px;padding:14px;font-weight:800;cursor:pointer;font-family:Nunito,sans-serif;font-size:15px;">&#128228; Enviar reporte</button></div>';
}
function doSoporte(){
  const n=(document.getElementById('sN')||{}).value?.trim()||'',t=(document.getElementById('sT')||{}).value?.trim()||'',d=(document.getElementById('sD')||{}).value?.trim()||'';
  if(!n||!t||!d){showToast('&#9888;&#65039; Completa todos los campos');return;}
  db.collection('soporte').add({clienteNombre:n,telefono:t,descripcion:d,estado:'nuevo',fecha:new Date().toISOString()})
    .then(()=>{showToast('&#9989; Reporte enviado');showTab('tienda');}).catch(()=>showToast('&#10060; Error al enviar'));
}

// PUNTOS
function renderPuntos(){
  const el=document.getElementById('puntosContainer');if(!el)return;
  const phone=localStorage.getItem('clientPhone');
  if(!phone){el.innerHTML='<div class="empty"><p>&#11088; Haz tu primer pedido para ganar puntos</p></div>';return;}
  el.innerHTML='<div class="empty"><div style="animation:spin .8s linear infinite;width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--amarillo);border-radius:50%;margin:0 auto 8px;"></div>Cargando...</div>';
  db.collection('clientes').doc(phone).get().then(snap=>{
    const d=snap.exists?snap.data():{puntos:0,totalGastado:0,historial:[]};
    const pts=d.puntos||0,gastado=d.totalGastado||0,hist=d.historial||[];
    let nivel,sigNivel,ptsParaSig;
    if(pts<100){nivel='&#129355; Bronce';sigNivel='&#129356; Plata';ptsParaSig=100;}
    else if(pts<300){nivel='&#129356; Plata';sigNivel='&#129351; Oro';ptsParaSig=300;}
    else if(pts<600){nivel='&#129351; Oro';sigNivel='&#128142; Diamante';ptsParaSig=600;}
    else{nivel='&#128142; Diamante';sigNivel='';ptsParaSig=pts;}
    const pct=sigNivel?Math.min(100,Math.round(pts/ptsParaSig*100)):100;
    const histHTML=hist.length?hist.map(h=>{const f=new Date(h.fecha).toLocaleDateString('es-VE');return'<div class="puntos-item"><div><div style="font-weight:700;">&#9989; Compra #'+h.pedido.slice(-4)+'</div><div style="font-size:11px;color:var(--subtext);">'+f+'</div></div><span class="puntos-badge">+'+h.puntos+' pts</span></div>';}).join(''):'<p style="color:var(--subtext);text-align:center;padding:10px 0;font-size:13px;">Haz tu primer pedido</p>';
    el.innerHTML='<div class="puntos-card">'+
      '<div style="font-size:11px;color:rgba(255,255,255,.6);margin-bottom:4px;">Nivel actual</div>'+
      '<div style="font-family:Bebas Neue,sans-serif;font-size:22px;margin-bottom:2px;">'+nivel+'</div>'+
      '<div style="margin:12px 0 4px;display:flex;justify-content:space-between;align-items:flex-end;">'+
      '<div><div style="font-size:11px;color:rgba(255,255,255,.6);">Tus puntos</div><div class="puntos-num">'+pts+'</div></div>'+
      (sigNivel?'<div style="text-align:right;font-size:11px;color:rgba(255,255,255,.5);">Pr&oacute;ximo: <b style="color:var(--amarillo);">'+sigNivel+'</b><br>'+ptsParaSig+' pts</div>':'<div style="font-size:13px;color:var(--amarillo);font-weight:800;">&#127942; Nivel m&aacute;ximo</div>')+
      '</div><div class="puntos-bar-bg"><div class="puntos-bar" style="width:'+pct+'%"></div></div>'+
      '<div style="font-size:11px;color:rgba(255,255,255,.5);">Total gastado: $'+gastado.toFixed(2)+'</div></div>'+
      '<div style="background:var(--card);border-radius:16px;padding:16px;margin-top:12px;">'+
      '<div style="font-weight:800;font-size:14px;margin-bottom:4px;">&#128161; C&oacute;mo funciona</div>'+
      '<div style="font-size:13px;color:var(--subtext);line-height:1.8;">&bull; <b>1 punto</b> por cada $1 gastado<br>&bull; &#129355; Bronce: 0 | &#129356; Plata: 100 | &#129351; Oro: 300 | &#128142; Diamante: 600</div></div>'+
      '<div class="puntos-historial"><div style="font-weight:800;font-size:15px;margin-bottom:8px;">&#128203; Historial</div>'+histHTML+'</div>';
  }).catch(()=>{el.innerHTML='<div class="empty"><p>Error al cargar puntos</p></div>';});
}

// CHAT
const bots={'hola|buenas':'&#128075; &#161;Hola! Soy Tony el asistente.\n\n&#128172; Pu\u00e9do ayudarte con:\n&#128176; "precios" | &#128221; "c\u00f3mo pedir"\n&#128336; "horario" | &#129534; "comprobante"','precio|cuanto':'&#128176; Los precios est\u00e1n en la pesta\u00f1a &#127978; Tienda.','pedir|comprar':'&#128221; Para pedir:\n1\ufe0f\u20e3 Ve a Tienda\n2\ufe0f\u20e3 Agrega productos\n3\ufe0f\u20e3 Ve a Mi Pedido\n4\ufe0f\u20e3 Llena datos y env\u00eda','horario|abierto':'&#128336; Horario: 9 AM - 10 PM\n&#128693; Domicilio disponible','comprobante|pago':'&#129534; Para domicilio con Pago M\u00f3vil o Transferencia debes subir el comprobante. &#161;Es obligatorio!','gracias':'&#128522; &#161;De nada! Aqu\u00ed estoy &#10084;','default':'&#128154; Puedo ayudarte con:\n&#128176; precios | &#128221; pedir | &#128336; horario | &#129534; comprobante'};
function toggleChat(){const m=document.getElementById('chatModal');m.classList.toggle('open');if(m.classList.contains('open')&&!chatOn){chatOn=true;initChat();}}
function initChat(){if(chatUnsub)return;const phone=localStorage.getItem('clientPhone')||'anonimo';chatUnsub=db.collection('chats').doc(phone).collection('mensajes').orderBy('fecha','asc').onSnapshot(snap=>{const el=document.getElementById('chatMessages');if(!el)return;el.innerHTML=snap.empty?'<div style="text-align:center;color:var(--subtext);padding:20px;">&#161;Hola! &#191;En qu&eacute; te ayudamos? &#128522;</div>':snap.docs.map(d=>{const m=d.data();let cls='admin',who='Bodega Tony';if(m.de==='cliente'){cls='me';who='T&uacute;';}else if(m.de==='bot'){cls='bot';who='&#129302; Tony';}return'<div class="chat-msg '+cls+'"><div style="font-size:10px;opacity:.7;">'+who+'</div>'+esc(m.texto)+'</div>';}).join('');el.scrollTop=el.scrollHeight;});}
function sendChat(){const i=document.getElementById('chatInput'),t=i?.value.trim();if(!t)return;const phone=localStorage.getItem('clientPhone')||'anonimo';db.collection('chats').doc(phone).collection('mensajes').add({texto:t,fecha:new Date().toISOString(),de:'cliente'});i.value='';setTimeout(()=>{const tl=t.toLowerCase();let r=bots['default'];for(const k in bots){if(k==='default')continue;if(k.split('|').some(c=>tl.includes(c))){r=bots[k];break;}}db.collection('chats').doc(phone).collection('mensajes').add({texto:r,fecha:new Date().toISOString(),de:'bot'});},600);}

// RESEÑAS
function abrirResena(pid){rPid=pid;rStars=5;rFoto='';document.getElementById('resenaModal').classList.add('open');drawStars();document.getElementById('rTxt').value='';document.getElementById('rFotoPrev').innerHTML='&#128248; Toca para agregar foto';loadResenas(pid);}
function cerrarResena(){document.getElementById('resenaModal').classList.remove('open');}
function drawStars(){const s=document.getElementById('rStars');s.innerHTML='';for(let i=1;i<=5;i++){const sp=document.createElement('span');sp.textContent=i<=rStars?'⭐':'☆';sp.style.cssText='font-size:28px;cursor:pointer;color:'+(i<=rStars?'#f4a800':'#ccc');sp.onclick=()=>{rStars=i;drawStars();};s.appendChild(sp);}}
function prevRFoto(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{rFoto=e.target.result;document.getElementById('rFotoPrev').innerHTML='<img src="'+rFoto+'" style="width:100%;height:100%;object-fit:cover;">';};r.readAsDataURL(f);}
function loadResenas(pid){db.collection('productos').doc(pid).collection('resenas').orderBy('fecha','desc').limit(10).get().then(snap=>{const c=document.getElementById('rTxt')?.parentElement;if(!c)return;const old=c.querySelector('.rlist');if(old)old.remove();let h='<div class="rlist" style="max-height:140px;overflow-y:auto;margin-bottom:10px;">';if(snap.empty)h+='<p style="color:var(--subtext);font-size:13px;">Sin rese&ntilde;as a&uacute;n</p>';else snap.docs.forEach(d=>{const r=d.data();h+='<div style="border-bottom:1px solid var(--border);padding:6px 0;"><div style="font-weight:700;font-size:13px;">'+esc(r.autor||'Cliente')+' '+(r.estrellas?'⭐'.repeat(r.estrellas):'⭐⭐⭐⭐⭐')+'</div><div style="font-size:12px;color:var(--subtext);">'+esc(r.texto||'')+'</div>'+(r.foto?'<img src="'+r.foto+'" style="width:56px;height:56px;object-fit:cover;border-radius:8px;margin-top:4px;">':'')+'</div>';});h+='</div>';c.insertAdjacentHTML('afterbegin',h);}).catch(()=>{});}
function enviarResena(){const t=document.getElementById('rTxt')?.value.trim();if(!t){showToast('&#9888;&#65039; Escribe tu opini&oacute;n');return;}const autor=localStorage.getItem('clientName')||'Cliente';db.collection('productos').doc(rPid).collection('resenas').add({autor,texto:t,estrellas:rStars,foto:rFoto||'',fecha:new Date().toISOString()}).then(()=>{showToast('&#9989; &#161;Gracias por tu rese&ntilde;a!');cerrarResena();}).catch(()=>showToast('&#10060; Error'));}

// TOAST - MEJORADO
let tT=null;
function showToast(msg, duration=2800){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');if(tT)clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),duration);}

// NOTIFICACIONES - MEJORA
function notificarCambioEstado(estado, pedidoId) {
  const mensajes = {
    confirmado: `✅ ¡Pedido #${pedidoId} confirmado!`,
    preparacion: `👨‍🍳 Tu pedido #${pedidoId} se está preparando`,
    camino: `🚚 ¡Tu pedido #${pedidoId} va en camino!`,
    entregado: `🏠 ¡Pedido entregado! Gracias`,
    cancelado: `❌ Pedido #${pedidoId} cancelado`
  };
  const mensaje = mensajes[estado];
  if (!mensaje) return;
  showToast(mensaje, 5000);
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('Bodega Tony Tony', { body: mensaje, icon: 'logo.png', tag: `pedido-${pedidoId}` });
  }
}

// REGISTRO — FIX iOS
function mostrarRegistro(){
  const modal=document.getElementById('regModal');if(!modal)return;modal.style.display='flex';
  const btn=document.getElementById('regBtn');if(!btn)return;
  const nb=btn.cloneNode(true);btn.parentNode.replaceChild(nb,btn);
  function reg(){
    const n=(document.getElementById('regNombre')||{}).value?.trim()||'';
    const code=(document.getElementById('regCodigo')||{}).value||'+58';
    const t=(document.getElementById('regTel')||{}).value?.replace(/\D/g,'')||'';
    const err=document.getElementById('regErr');
    if(!n){if(err)err.textContent='&#9888;&#65039; Escribe tu nombre';return;}
    if(!t||t.length<7){if(err)err.textContent='&#9888;&#65039; N&uacute;mero inv&aacute;lido';return;}
    localStorage.setItem('clientName',n);localStorage.setItem('clientPhone',code+t);
    modal.style.display='none';showToast('&#127881; &#161;Bienvenido '+n+'!');
  }
  nb.addEventListener('click',reg);
  ['regNombre','regTel'].forEach(id=>{const el=document.getElementById(id);if(el)el.onkeyup=e=>{if(e.key==='Enter')reg();};});
}

// INICIO
setTimeout(()=>{if(!localStorage.getItem('clientName'))mostrarRegistro();},900);
setTimeout(()=>{const s=document.getElementById('splash');if(s){s.style.opacity='0';setTimeout(()=>s.style.display='none',400);}},1300);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
